D("e25","estin",[BI],"L'effettiva condizione di inertizzazione di un ambiente va valutata in funzione:",["Della concentrazione limite di ossigeno (LOC).","Del potere calorifico del combustibile.","Della pressione atmosferica."]);

// Blocco 4 – Modulo 3 (Scuderi): legislazione e progettazione antincendio.
const SC = "Modulo 3 Scuderi 28/09/2026";
D("g20","codg",[SC],"Il DM 3 agosto 2015, oltre alla parte dispositiva, contiene un allegato (il Codice) diviso in:",["4 sezioni: G Generalità, S Strategia antincendio, V Regole tecniche verticali, M Metodi.","3 sezioni: G, S e V.","5 sezioni: G, S, V, M e P Procedimenti."]);
D("g21","codg",[SC],"L'art. 2-bis del DM 3 agosto 2015 («Modalità applicative alternative») è stato introdotto:",["Dal DM 12 aprile 2019.","Dal DM 18 ottobre 2019.","Dal DM 3 settembre 2021."]);
D("g22","codg",[SC],"La sezione S del Codice tratta:",["La strategia antincendio, cioè le misure antincendio dalla reazione al fuoco alla sicurezza degli impianti tecnologici.","Le regole tecniche verticali.","Gli scenari di incendio per la progettazione prestazionale."]);
D("g23","codg",[SC],"La sezione M del Codice tratta:",["I metodi: ingegneria della sicurezza antincendio, scenari per la progettazione prestazionale, salvaguardia della vita.","Le misure di manutenzione degli impianti.","Le attività di monitoraggio del Codice."]);
D("g24","codg",[SC],"Nella sezione V del Codice, i capitoli V.1, V.2 e V.3 riguardano rispettivamente:",["Aree a rischio specifico, aree a rischio per atmosfere esplosive, vani degli ascensori.","Uffici, alberghi, autorimesse.","Reazione al fuoco, resistenza al fuoco, compartimentazione."]);
D("g25","codg",[SC],"Tra i principi di progettazione del Codice (G.2.1), «inclusione» significa:",["Sensibilità alle diverse disabilità: fisiche, mentali, sensoriali.","Applicabilità a tutte le tipologie di attività.","Integrazione dei documenti di prevenzione incendi preesistenti."]);
D("g26","codg",[SC],"Tra i principi di progettazione del Codice (G.2.1), «flessibilità» significa:",["Molteplicità di soluzioni e ampio grado di libertà al progettista (soluzioni alternative, in deroga).","Facilità di aggiornamento per seguire il progresso tecnologico.","Scomposizione della materia in moduli."]);
D("g27","codg",[SC],"Tra i principi di progettazione del Codice (G.2.1), «contenuti basati sull'evidenza» significa:",["Studio, valutazione e utilizzo sistematico della ricerca scientifica.","Uso esclusivo di prove sperimentali in scala reale.","Conformità alle circolari ministeriali."]);
D("g28","codg",[SC],"Il Codice di prevenzione incendi si applica:",["Ad attività nuove ed esistenti, senza distinzione.","Solo ad attività di nuova realizzazione.","Solo ad attività esistenti da adeguare."]);
D("g29","codg",[SC],"Per le «attività non soggette», il Codice:",["È utilizzabile come riferimento.","È vietato.","È sempre obbligatorio."]);
D("g30","codg",[SC],"La metodologia generale di progettazione del Codice (G.2.6) è:",["Un processo iterativo: scopo, obiettivi di sicurezza, valutazione del rischio, profilazione del rischio, strategia antincendio.","Un elenco di prescrizioni da applicare in sequenza senza valutazioni.","Un calcolo probabilistico del rischio residuo."]);
D("g31","codg",[SC],"Nella metodologia del Codice, la «profilazione del rischio» consiste:",["Nel determinare e attribuire i profili di rischio Rvita, Rbeni e Rambiente.","Nel descrivere qualitativamente l'attività.","Nello scegliere gli impianti di protezione attiva."]);
D("g32","codg",[SC],"Nella metodologia del Codice, con la «strategia antincendio» si procede:",["Alla mitigazione del rischio valutato tramite misure preventive, protettive e gestionali.","Alla sola verifica documentale del progetto.","Alla richiesta di deroga al Comando."]);
D("g33","codg",[SC],"Secondo il Codice (G.2.9), il progettista:",["Assume piena responsabilità della valutazione del rischio d'incendio riportata nella documentazione progettuale.","Condivide la responsabilità della valutazione del rischio con il Comando.","Risponde solo della correttezza grafica degli elaborati."]);
D("g34","codg",[SC],"Quale dei seguenti è un obbligo del progettista secondo il par. G.2.9 del Codice?",["Garantire la correttezza nell'applicazione di metodi, modelli e strumenti normativi.","Garantire la manutenzione degli impianti nel tempo.","Nominare gli addetti antincendio."]);
D("g35","codg",[SC],"Secondo la lezione, il Codice del 2015 segna il passaggio da un approccio puramente prescrittivo a un approccio:",["Semi-prestazionale.","Esclusivamente probabilistico.","Esclusivamente amministrativo."]);
D("g36","codg",[SC],"Nel Codice di prevenzione incendi, i riferimenti di tipo amministrativo (procedimenti, istanze):",["Non sono presenti.","Sono contenuti nella sezione G.","Sono contenuti nella sezione M."]);
D("l20","lav",[SC],"Il DM 1° settembre 2021 («Decreto controlli») riguarda:",["I criteri generali per il controllo e la manutenzione di impianti, attrezzature e altri sistemi di sicurezza antincendio.","La gestione dei luoghi di lavoro in esercizio e in emergenza.","I criteri di progettazione antincendio dei luoghi di lavoro a basso rischio."]);
D("l21","lav",[SC],"Il DM 2 settembre 2021 («Decreto GSA») riguarda:",["I criteri per la gestione dei luoghi di lavoro in esercizio e in emergenza e le caratteristiche del servizio di prevenzione e protezione antincendio.","Il controllo e la manutenzione degli impianti antincendio.","La progettazione dei luoghi di lavoro a basso rischio."]);
D("l22","lav",[SC],"Il DM 3 settembre 2021 («Minicodice») riguarda:",["I criteri generali di progettazione, realizzazione ed esercizio della sicurezza antincendio per i luoghi di lavoro.","La formazione dei manutentori qualificati.","Le procedure di presentazione della SCIA."]);
D("l23","lav",[SC],"I DM 1, 2 e 3 settembre 2021 sono stati emanati ai sensi:",["Dell'art. 46, comma 3, del D.Lgs. 81/08.","Dell'art. 16 del D.Lgs. 139/2006.","Dell'art. 2 del DPR 151/2011."]);
D("l24","lav",[SC],"Un luogo di lavoro «a basso rischio di incendio» (DM 3/9/2021) deve avere affollamento complessivo:",["Non superiore a 100 occupanti.","Non superiore a 300 occupanti.","Non superiore a 50 occupanti."]);
D("l25","lav",[SC],"Un luogo di lavoro «a basso rischio di incendio» (DM 3/9/2021) deve avere superficie lorda complessiva:",["Non superiore a 1000 m².","Non superiore a 400 m².","Non superiore a 5000 m²."]);
D("l26","lav",[SC],"Un luogo di lavoro «a basso rischio di incendio» (DM 3/9/2021) deve avere piani situati a quota:",["Compresa tra −5 m e 24 m.","Compresa tra −1 m e 12 m.","Compresa tra −10 m e 32 m."]);
D("l27","lav",[SC],"Nei luoghi di lavoro «a basso rischio di incendio» (DM 3/9/2021) la quantità di materiali combustibili si considera significativa se:",["qf > 900 MJ/m².","qf > 200 MJ/m².","qf > 1200 MJ/m²."]);
D("l28","lav",[SC],"Un luogo di lavoro «a basso rischio di incendio» (DM 3/9/2021) è ubicato in attività:",["Non soggette ai controlli e non dotate di specifica regola tecnica verticale.","Soggette ai controlli di categoria A.","Soggette ai controlli ma con meno di 10 lavoratori."]);
D("l29","lav",[SC],"Per i luoghi di lavoro non soggetti ai controlli, senza regola tecnica verticale e non a basso rischio, il DM 3/9/2021 prevede:",["L'applicazione del Codice (DM 3 agosto 2015).","L'applicazione del DM 10 marzo 1998.","Nessun criterio di progettazione."]);
D("p40","proc",[SC],"La differenza tra falso materiale e falso ideologico è che:",["Nel falso materiale il documento è contraffatto o alterato; nel falso ideologico il documento è autentico ma contiene dichiarazioni menzognere.","Il falso materiale riguarda i privati, quello ideologico i pubblici ufficiali.","Sono sinonimi."]);
D("p41","proc",[SC],"Secondo la lezione, la normazione di prevenzione incendi si sviluppa su due binari:",["Tecnico, per dare sicurezza antincendio, e amministrativo, per dare evidenza pubblica della conformità.","Nazionale e regionale.","Civile e penale."]);
D("p42","proc",[SC],"Prima del DPR 151/2011 l'elenco delle attività soggette era contenuto:",["Nel DM 16 febbraio 1982.","Nel DM 10 marzo 1998.","Nel DPR 37/1998."]);
D("p43","proc",[SC],"Il DPR 151/2011 è entrato in vigore il:",["7 ottobre 2011.","1° agosto 2011.","27 novembre 2012."]);
D("p44","proc",[SC],"Secondo la lezione, la SCIA di prevenzione incendi è:",["Un atto privato con cui il responsabile si «auto-autorizza» ad esercire l'attività.","Un provvedimento rilasciato dal Comando dopo il sopralluogo.","Una richiesta di parere sul progetto."]);
D("p45","proc",[SC],"Il DPR 151/2011 concentra le verifiche dei Comandi sulle attività a rischio più elevato secondo il principio di:",["Proporzionalità dell'azione amministrativa.","Rotazione degli incarichi.","Silenzio-assenso."]);
D("p46","proc",[SC],"Con il DPR 151/2011, la SCIA va presentata:",["Per le attività di categoria A, B e C.","Solo per le attività di categoria A.","Solo per le attività di categoria C."]);
D("p47","proc",[SC],"Tra le innovazioni del DM 7 agosto 2012 c'è l'introduzione del concetto di:",["Modifica delle attività esistenti rilevante ai fini della sicurezza antincendio, con variazione delle condizioni di sicurezza.","Nulla osta provvisorio.","Certificato di prevenzione incendi a validità triennale."]);
D("p48","proc",[SC],"Tra i procedimenti disciplinati dal DM 7 agosto 2012 rientrano:",["Valutazione progetto, SCIA, rinnovo periodico, deroga, NOF, verifiche in corso d'opera e voltura.","Solo valutazione progetto e SCIA.","Solo il rinnovo periodico."]);

// Blocco 5 – Reazione al fuoco (Pecile, 02/10/2026).
const PE = "Lezione Pecile 02/10/2026 – Reazione al fuoco";
D("r10","s1",[PE],"Secondo il DM 30/11/1983, la reazione al fuoco è:",["Il grado di partecipazione di un materiale combustibile al fuoco al quale è sottoposto.","L'attitudine di un elemento a conservare stabilità, tenuta e isolamento sotto incendio.","La quantità di calore rilasciata per unità di superficie."]);
D("r11","s1",[PE],"Secondo il DM 30/11/1983, il «comportamento al fuoco» è:",["L'insieme di trasformazioni fisiche e chimiche di un materiale o elemento da costruzione sottoposto all'azione del fuoco.","Il tempo di resistenza di una struttura portante.","La velocità di propagazione della fiamma."]);
D("r12","s1",[PE],"Nella classificazione italiana di reazione al fuoco, i materiali di classe 0:",["Sono non combustibili.","Sono i più combustibili.","Sono i mobili imbottiti migliori."]);
D("r13","s1",[PE],"Nella classificazione italiana, le classi da 1 a 5 indicano materiali:",["Combustibili, con partecipazione alla combustione crescente al crescere della classe.","Non combustibili.","Combustibili, con partecipazione decrescente al crescere della classe."]);
D("r14","s1",[PE],"In un mobile imbottito, quale componente non può mai mancare?",["L'imbottitura.","Il rivestimento.","La struttura."]);
D("r15","s1",[PE],"Per i mobili imbottiti la classe migliore è:",["1 IM.","3 IM.","0 IM."]);
D("r16","s1",[PE],"Ai fini della classificazione dei mobili imbottiti sono ininfluenti:",["I materiali del fusto o del supporto, il colore e il disegno del tessuto di rivestimento.","Il tipo di imbottitura.","Il tipo di rivestimento."]);
D("r17","s1",[PE],"La norma UNI 9175 (mobili imbottiti) si applica anche a:",["Materassi, sommier, guanciali, poltrone-letto e divani-letto.","Tendaggi e sipari.","Pavimenti tessili."]);
D("r18","s1",[PE],"Il decreto italiano sulla classificazione di reazione al fuoco e l'omologazione dei materiali è:",["Il DM 26 giugno 1984, modificato con DM 3 settembre 2001.","Il DM 16 febbraio 2007.","Il DM 9 marzo 2007."]);
D("r19","s1",[PE],"I metodi di prova italiani di reazione al fuoco forniscono informazioni sul comportamento dei materiali:",["Nella fase di innesco e nella fase di prima propagazione dell'incendio.","Nella fase di incendio generalizzato.","Nella fase di raffreddamento."]);
D("r20","s1",[PE],"La prova di non combustibilità dei materiali da costruzione è definita dalla norma:",["UNI ISO 1182.","UNI 9175.","UNI 9174."]);
D("r21","s1",[PE],"La norma UNI 9174 riguarda la reazione al fuoco dei materiali:",["Sottoposti all'azione di una fiamma d'innesco in presenza di calore radiante.","Sospesi, investiti da una piccola fiamma su entrambe le facce.","Imbottiti, sottoposti a una piccola fiamma."]);
D("r22","s1",[PE],"La norma UNI 8456 riguarda la reazione al fuoco dei materiali:",["Sospesi e suscettibili di essere investiti da una piccola fiamma su entrambe le facce.","Che possono essere investiti da una piccola fiamma su una sola faccia.","Da pavimento, con pannello radiante."]);
D("r23","s1",[PE],"Il «tempo di post-combustione» è:",["Il tempo tra l'allontanamento della fiamma pilota dalla provetta e l'estinzione della fiamma.","Il tempo tra l'estinzione della fiamma e la scomparsa dell'incandescenza.","Il tempo necessario all'innesco della provetta."]);
D("r24","s1",[PE],"Il «tempo di post-incandescenza» è:",["Il tempo tra l'estinzione della fiamma e la completa scomparsa dell'incandescenza.","Il tempo tra l'allontanamento della fiamma pilota e l'estinzione della fiamma.","La durata totale della prova."]);
D("r25","s1",[PE],"Il «gocciolamento» è:",["La tendenza di un materiale a lasciar cadere gocce o parti distaccate durante o dopo l'azione della sorgente di calore.","La produzione di fumo durante la prova.","La perdita di massa del provino."]);
D("r26","s1",[PE],"Secondo la UNI 9177, un materiale con categorie (I – I) nelle due prove è di classe:",["1.","2.","0."]);
D("r27","s1",[PE],"Secondo la UNI 9177, un materiale con categorie (IV – IV) nelle due prove è di classe:",["5.","4.","3."]);
D("r28","s1",[PE],"Nei materiali non combustibili sono considerati ininfluenti gli strati di finitura di vernici o pitture di spessore:",["Non superiore a 0,6 mm.","Non superiore a 2 mm.","Non superiore a 6 mm."]);
D("r29","s1",[PE],"Secondo il DM 14 gennaio 1985 sono di classe 0, tra gli altri:",["I materiali isolanti a base di fibre minerali privi di leganti organici.","I pannelli di legno trattati con vernici ignifughe.","Le materie plastiche autoestinguenti."]);
D("r30","s1",[PE],"L'omologazione di un materiale ai fini della reazione al fuoco è:",["Il provvedimento del Ministero dell'interno che autorizza la riproduzione del prototipo per l'uso in attività soggette alle norme di prevenzione incendi.","Il rapporto di prova rilasciato dal laboratorio.","La dichiarazione del produttore."]);
D("r31","s1",[PE],"Nel DM 26/6/1984 la «certificazione» è:",["Il rapporto con cui si certifica la classe di reazione al fuoco del campione sottoposto ad esame.","Il provvedimento che autorizza la riproduzione del prototipo.","Il marchio apposto sul materiale."]);
D("r32","s1",[PE],"Il marchio di conformità apposto dal produttore sul materiale omologato riporta:",["Nome del produttore, anno di produzione, classe di reazione al fuoco, estremi dell'omologazione.","Solo la classe di reazione al fuoco.","Il nome del laboratorio di prova e la data della prova."]);
D("r33","s1",[PE],"I prodotti vernicianti ignifughi applicati su materiali legnosi (DM 6 marzo 1992), per l'impiego in attività soggette:",["Devono essere omologati.","Devono solo avere la marcatura CE.","Non richiedono alcuna certificazione."]);
D("r34","s1",[PE],"Il sistema di classificazione europeo di reazione al fuoco dei prodotti da costruzione è stato recepito con:",["Il DM 10 marzo 2005.","Il DM 26 giugno 1984.","Il DM 16 febbraio 2007."]);
D("r35","s1",[PE],"Il DM 15 marzo 2005 stabilisce:",["I requisiti di reazione al fuoco dei prodotti da costruzione nelle attività con regole tecniche, indicando le classi europee corrispondenti a quelle italiane.","I metodi di prova per i mobili imbottiti.","Le classi di resistenza al fuoco degli elementi costruttivi."]);
D("r36","s1",[PE],"Nel sistema europeo di reazione al fuoco, FIGRA indica:",["La velocità di crescita dell'incendio.","La produzione totale di fumo.","La propagazione laterale della fiamma."]);
D("r37","s1",[PE],"Nel sistema europeo di reazione al fuoco, SMOGRA indica:",["La velocità di crescita dei fumi.","Il rilascio totale di calore.","Il potenziale calorifico lordo."]);
D("r38","s1",[PE],"La prova europea «Single Burning Item» (EN 13823) si applica:",["Ai prodotti da costruzione esclusi i pavimenti.","Solo ai pavimenti.","Ai mobili imbottiti."]);
D("r39","s1",[PE],"La prova europea del pannello radiante (EN ISO 9239-1) riguarda:",["I pavimenti.","I soffitti.","I prodotti isolanti lineari."]);
D("r40","s1",[PE],"Secondo il DM 15/3/2005, per impiego a pavimento alla classe italiana 1 corrisponde, tra le altre, la classe europea:",["Bfl-s1.","Dfl-s2.","Efl."]);
D("r41","s1",[PE],"Secondo il DM 15/3/2005, per impiego a parete, quale classe europea corrisponde alla classe italiana 1?",["B-s2,d0.","C-s3,d2.","D-s1,d0."]);
D("r42","s1",[PE],"Nel capitolo S.1 del Codice la reazione al fuoco è strutturata in:",["Quattro livelli di prestazione, definiti in funzione del contributo all'incendio.","Due livelli di prestazione.","Sei classi da 0 a 5."]);
D("r43","s1",[PE],"Nel capitolo S.1 del Codice, le prestazioni di reazione al fuoco richieste sono migliori:",["Nei percorsi di esodo rispetto agli altri locali.","Nei depositi rispetto ai percorsi di esodo.","Nei locali tecnici rispetto alle vie d'esodo."]);
D("r44","s1",[PE],"Nel Codice, il gruppo di materiali GM0 comprende:",["Tutti i materiali di classe 0 italiana o di classe A1 europea.","I materiali di classe 1 italiana.","Tutti i materiali non classificati."]);
D("r45","s1",[PE],"Nel Codice, il gruppo di materiali GM4 comprende:",["Tutti i materiali non compresi nei gruppi GM0, GM1, GM2 e GM3.","I materiali incombustibili.","I soli mobili imbottiti di classe 1 IM."]);
D("r46","s1",[PE],"Nel Codice, le soluzioni conformi di reazione al fuoco si riferiscono a:",["Cinque gruppi di materiali, da GM0 a GM4.","Tre gruppi di materiali, da GM1 a GM3.","Sette euroclassi, da A1 a F."]);
D("r47","s1",[PE],"Nel capitolo S.1, indipendentemente dalle soluzioni conformi adottate, materiali del gruppo GM4 a parete o pavimento sono ammessi:",["Per il 5% della superficie lorda interna delle vie d'esodo o dei locali.","Per il 25% della superficie lorda interna.","In nessun caso."]);
D("r48","s1",[PE],"Secondo il Codice, NON è richiesta la verifica dei requisiti di reazione al fuoco per:",["I materiali stoccati o oggetto di processi produttivi (beni in deposito, in vendita, in esposizione).","I rivestimenti delle vie d'esodo.","I controsoffitti dei locali con pubblico."]);
D("r49","s1",[PE],"Secondo il Codice, non è richiesta la verifica di reazione al fuoco per i materiali protetti con separazioni di classe almeno:",["K 30 o EI 30.","EI 120.","E 15."]);
D("r50","s1",[PE],"Nel capitolo S.1 del Codice, le soluzioni alternative sono ammesse:",["Per tutti i livelli di prestazione.","Solo per il livello di prestazione I.","Mai."]);
D("r51","s1",[PE],"La reazione al fuoco si riferisce al comportamento dei materiali:",["Nelle effettive condizioni finali di applicazione.","Solo allo stato di fornitura, indipendentemente dalla posa.","Solo dopo invecchiamento accelerato."]);
D("r52","s1",[PE],"Rispetto al sistema italiano, il sistema europeo di classificazione di reazione al fuoco:",["È organizzato in classi principali e classi aggiuntive, con molte più combinazioni possibili.","Ha un numero minore di classi.","Non considera la produzione di fumo."]);

// Blocco 6 – Codice G.2, valutazione del rischio d'incendio (Pecorella, 02/10/2026).
const PV = "Lezione Pecorella 02/10/2026 – Valutazione del rischio";
D("g40","codg",[PV],"Ai sensi dell'art. 17 del D.Lgs. 81/08, la valutazione di tutti i rischi con l'elaborazione del relativo documento:",["È un obbligo del datore di lavoro non delegabile.","Può essere delegata al RSPP.","Può essere delegata al medico competente."]);
D("g41","codg",[PV],"Ai sensi dell'art. 29 del D.Lgs. 81/08, il datore di lavoro effettua la valutazione dei rischi:",["In collaborazione con il RSPP e il medico competente, previa consultazione del rappresentante dei lavoratori per la sicurezza.","Da solo, senza alcuna consultazione.","Su delega dell'organo di vigilanza."]);
D("g42","codg",[PV],"La valutazione dei rischi (art. 29 D.Lgs. 81/08) deve essere immediatamente rielaborata:",["In occasione di modifiche del processo produttivo o dell'organizzazione del lavoro significative per la salute e sicurezza.","Ogni anno, in ogni caso.","Solo su richiesta dei Vigili del fuoco."]);
D("g43","codg",[PV],"Il documento di valutazione dei rischi deve essere custodito:",["Presso l'unità produttiva alla quale si riferisce la valutazione.","Presso il Comando dei Vigili del fuoco.","Presso lo studio del consulente."]);
D("g44","codg",[PV],"Nel Minicodice (DM 3/9/2021), a differenza del Codice, nella valutazione del rischio di incendio:",["Non si definiscono i profili di rischio, perché il «basso rischio» è individuato a priori e le misure sono indicate direttamente nella strategia antincendio.","Si definiscono quattro profili di rischio.","Non è richiesta alcuna valutazione del rischio."]);
D("g45","codg",[PV],"Nel Codice, se sono disponibili pertinenti regole tecniche verticali, la valutazione del rischio d'incendio del progettista:",["È limitata agli aspetti peculiari della specifica attività trattata.","Non è più necessaria.","Deve essere svolta con metodi quantitativi."]);
D("g46","codg",[PV],"Secondo il par. G.2.6.1 del Codice, per la valutazione del rischio d'incendio il progettista impiega:",["Uno dei metodi di regola dell'arte, in relazione alla complessità dell'attività.","Obbligatoriamente un metodo quantitativo.","Esclusivamente il metodo indicato dal Comando."]);
D("g47","codg",[PV],"Rispetto alla valutazione del rischio d'incendio, l'attribuzione dei profili di rischio:",["È un'azione successiva: confondere le due cose è un errore.","La precede sempre.","La sostituisce."]);
D("g48","codg",[PV],"La valutazione del rischio d'incendio è un'analisi della specifica attività finalizzata a individuare:",["Le più severe e credibili ipotesi d'incendio e le relative conseguenze per occupanti, beni e ambiente.","Lo scenario d'incendio più frequente.","Il costo delle misure antincendio."]);
D("g49","codg",[PV],"Le norme di riferimento per la gestione del rischio e le relative tecniche di valutazione sono:",["UNI ISO 31000 e UNI ISO 31010.","UNI 10779 e UNI 9795.","UNI EN 1838 e UNI 9494."]);
D("g50","codg",[PV],"I metodi qualitativi di identificazione del rischio:",["Non usano espressioni matematiche e danno un giudizio qualitativo, ad esempio verificando la conformità alle norme.","Si basano sulla stima matematica della probabilità e del danno.","Sono detti anche metodi degli indici o delle matrici."]);
D("g51","codg",[PV],"I metodi semi-quantitativi di valutazione del rischio sono detti anche:",["Metodi degli indici o delle matrici.","Metodi probabilistici puri.","Metodi di conformità normativa."]);
D("g52","codg",[PV],"L'uso dei metodi quantitativi di valutazione del rischio è in genere limitato:",["A fattori di rischio rilevanti e a condizioni di pericolo multiple e complesse.","Alle attività a basso rischio.","Alle attività non soggette."]);
D("g53","codg",[PV],"La tecnica «What-if» consiste in:",["Uno studio sistematico di squadra con domande del tipo «cosa accadrebbe se…» per identificare i pericoli.","Una lista di controllo basata sull'esperienza.","Un'analisi dei ratei di guasto dei componenti."]);
D("g54","codg",[PV],"La sigla HazOp indica:",["L'analisi dei pericoli e di operabilità (Hazard and Operability Analysis), svolta da un gruppo multidisciplinare con approccio strutturato.","L'analisi dell'affidabilità umana.","L'albero degli eventi."]);
D("g55","codg",[PV],"La sigla FMEA indica:",["L'analisi dei modi di guasto e dei loro effetti (Failure Modes and Effects Analysis).","L'analisi dei pericoli di operabilità.","La frequenza media degli eventi attesi."]);
D("g56","codg",[PV],"La Human Reliability Analysis (HRA) serve a:",["Valutare l'influenza dell'errore umano sul sistema, identificando i possibili errori e stimandone la probabilità.","Calcolare il carico d'incendio.","Valutare l'affidabilità degli impianti sprinkler."]);
D("g57","codg",[PV],"Nel modello di Rasmussen, gli errori dovuti a disattenzione sono detti:",["Skill based (basati sulle abilità).","Rule based (basati su regole).","Knowledge based (basati sulla conoscenza)."]);
D("g58","codg",[PV],"Nel modello di Rasmussen, gli errori dovuti alla scelta di procedure non adeguate alla situazione sono detti:",["Rule based (basati su regole).","Skill based (basati sulle abilità).","Knowledge based (basati sulla conoscenza)."]);
D("g59","codg",[PV],"Nel modello di Rasmussen, gli errori dovuti a mancanza di conoscenze di fronte a situazioni nuove o impreviste sono detti:",["Knowledge based (basati sulla conoscenza).","Skill based (basati sulle abilità).","Rule based (basati su regole)."]);
D("g60","codg",[PV],"Il diagramma Bow-Tie (papillon) pone al centro:",["L'evento incidentale primario (top event), con a sinistra cause e barriere preventive e a destra conseguenze e barriere mitigative.","Il costo delle misure di sicurezza.","La curva di isorischio."]);
D("g61","codg",[PV],"Le curve F-N rappresentano:",["La frequenza cumulata delle conseguenze lesive attese in rapporto alla loro magnitudo, spesso espressa come numero di fatalità.","La relazione tra carico d'incendio e classe di resistenza al fuoco.","Il tempo di esodo in funzione dell'affollamento."]);
D("g62","codg",[PV],"Con il metodo Ericson si calcolano due indici numerici di rischio:",["Per il fabbricato (RF) e per il contenuto, cioè persone e cose (RC).","Per la vita (Rvita) e per l'ambiente (Rambiente).","Per la frequenza (f) e per la magnitudo (N)."]);
D("g63","codg",[PV],"La sigla ALARP indica un livello di rischio:",["Tanto basso quanto ragionevolmente realizzabile (As Low As Reasonably Practicable).","Pari a zero.","Massimo ammissibile per legge."]);
D("g64","codg",[PV],"Secondo la teoria dell'accettabilità del rischio, la sicurezza richiede:",["Un appropriato equilibrio tra costi, rischi e benefici, non l'eliminazione di tutti i rischi.","L'eliminazione di tutti i rischi.","Che il rischio sia sempre trasferito all'assicurazione."]);
D("g65","codg",[PV],"Il trattamento del rischio è:",["Un processo ciclico: si selezionano le opzioni, si attuano, se ne valuta l'efficacia e si decide se il rischio residuo è accettabile.","Una fase unica svolta una sola volta.","La semplice assicurazione del rischio."]);
D("g66","codg",[PV],"Il monitoraggio e la revisione nel processo di gestione del rischio sono noti anche come:",["Riesame periodico.","Analisi preliminare.","Trattamento del rischio."]);
D("g67","codg",[PV],"Quale dei seguenti NON è uno scopo del riesame periodico del rischio?",["Eliminare la necessità della formazione del personale.","Identificare nuovi rischi emergenti.","Rilevare modifiche nel contesto interno ed esterno."]);
D("g68","codg",[PV],"Nel processo di gestione del rischio, la comunicazione e consultazione con le parti interessate:",["Dovrebbe interessare tutte le fasi del processo.","Riguarda solo la fase finale.","Riguarda solo le parti interne all'azienda."]);
D("g69","codg",[PV],"Secondo i dati statistici mostrati nella lezione, gli interventi dovuti a evidenti errori umani sono circa:",["Il 29% del totale.","Il 5% del totale.","Il 70% del totale."]);
D("g70","codg",[PV],"Tra le competenze non tecniche (non-technical skill) che incidono sull'errore umano rientrano:",["Consapevolezza situazionale, capacità decisionale, comunicazione, lavoro in gruppo, gestione dello stress.","Conoscenza delle norme UNI e capacità di calcolo strutturale.","Uso dei software di modellazione."]);

// Blocco 7 – Resistenza al fuoco, capitolo S.2 (lezione Udine 05/10/2026).
const RF = "Lezione 05/10/2026 – Resistenza al fuoco (S.2)";
D("x10","s2",[RF],"Secondo il par. S.2.1, la finalità della resistenza al fuoco è garantire:",["La capacità portante delle strutture e la capacità di compartimentazione, per un tempo minimo necessario al raggiungimento degli obiettivi di sicurezza.","Che i materiali di rivestimento non partecipino all'incendio.","L'assenza di fumo nelle vie d'esodo."]);
D("x11","s2",[RF],"Nella tabella S.2-1, il livello di prestazione I di resistenza al fuoco corrisponde a:",["Assenza di conseguenze esterne per collasso strutturale.","Mantenimento dei requisiti per un periodo sufficiente all'evacuazione degli occupanti.","Mantenimento della totale funzionalità della costruzione dopo l'incendio."]);
D("x12","s2",[RF],"Nella tabella S.2-1, il livello di prestazione II corrisponde a:",["Mantenimento dei requisiti di resistenza al fuoco per un periodo sufficiente all'evacuazione degli occupanti in luogo sicuro all'esterno della costruzione.","Mantenimento dei requisiti per un periodo congruo con la durata dell'incendio.","Assenza di conseguenze esterne per collasso strutturale."]);
D("x13","s2",[RF],"Nella tabella S.2-1, il livello di prestazione III corrisponde a:",["Mantenimento dei requisiti di resistenza al fuoco per un periodo congruo con la durata dell'incendio.","Limitato danneggiamento della costruzione dopo la fine dell'incendio.","Assenza di conseguenze esterne per collasso strutturale."]);
D("x14","s2",[RF],"Nella tabella S.2-1, il livello di prestazione V corrisponde a:",["Mantenimento della totale funzionalità della costruzione dopo la fine dell'incendio.","Limitato danneggiamento della costruzione dopo la fine dell'incendio.","Mantenimento dei requisiti per il tempo dell'evacuazione."]);
D("x15","s2",[RF],"Secondo la tabella S.2-2, i livelli di prestazione IV e V di resistenza al fuoco si attribuiscono:",["Su specifica richiesta del committente o se previsti da capitolati o richiesti dall'autorità per opere destinate ad attività di particolare importanza.","Automaticamente a tutte le attività con Rvita D1.","Alle opere a un solo piano."]);
D("x16","s2",[RF],"Secondo la tabella S.2-2, il livello di prestazione III si attribuisce:",["Alle opere da costruzione non ricomprese negli altri criteri di attribuzione.","Solo agli ospedali.","Solo su richiesta del committente."]);
D("x17","s2",[RF],"Tra le condizioni per attribuire il livello I di resistenza al fuoco c'è che l'opera sia:",["Non adibita ad attività che comportino presenza di occupanti, salvo presenza occasionale e di breve durata di personale addetto.","Con densità di affollamento ≤ 0,7 persone/m².","Con piani a quota compresa tra −10 m e 32 m."]);
D("x18","s2",[RF],"Tra le condizioni per attribuire il livello II di resistenza al fuoco c'è una densità di affollamento:",["Non superiore a 0,2 persone/m².","Non superiore a 0,7 persone/m².","Non superiore a 1,2 persone/m²."]);
D("x19","s2",[RF],"Tra le condizioni per attribuire il livello II di resistenza al fuoco ci sono piani situati a quota compresa:",["Tra −5 m e 12 m.","Tra −5 m e 24 m.","Tra −1 m e 32 m."]);
D("x20","s2",[RF],"Tra le condizioni per il livello II di resistenza al fuoco, il profilo di rischio Rvita deve essere compreso in:",["A1, A2, A3, A4.","A1, B1, C1.","D1 e D2."]);
D("x21","s2",[RF],"Secondo la tabella G.3 del Codice, un'opera da costruzione non vincolata e non strategica ha:",["Rbeni = 1.","Rbeni = 2.","Rbeni = 4."]);
D("x22","s2",[RF],"Secondo il Codice, un'opera da costruzione sia vincolata (per arte o storia) sia strategica ha:",["Rbeni = 4.","Rbeni = 3.","Rbeni = 2."]);
D("x23","s2",[RF],"Nella soluzione conforme per il livello di prestazione I di resistenza al fuoco:",["Si interpone una distanza di separazione su spazio a cielo libero e non è richiesta alcuna prestazione minima di capacità portante.","Si richiede una classe minima di resistenza al fuoco pari a 30.","Si applica la tabella S.2-3 in funzione del carico d'incendio."]);
D("x24","s2",[RF],"Nella soluzione conforme per il livello I di resistenza al fuoco, la distanza di separazione su spazio a cielo libero:",["Non deve essere inferiore alla massima altezza della costruzione.","Deve essere almeno di 10 m.","Non è richiesta."]);
D("x25","s2",[RF],"Nella soluzione conforme per il livello di prestazione II, la classe minima di resistenza al fuoco deve essere:",["Pari almeno a 30, o inferiore se consentita dal livello III per il qf,d del compartimento.","Pari almeno a 60.","Pari almeno a 120."]);
D("x26","s2",[RF],"Secondo la tabella S.2-3, con un carico d'incendio specifico di progetto qf,d ≤ 600 MJ/m² la classe minima di resistenza al fuoco è:",["45.","60.","30."]);
D("x27","s2",[RF],"Secondo la tabella S.2-3, con qf,d ≤ 900 MJ/m² la classe minima di resistenza al fuoco è:",["60.","90.","45."]);
D("x28","s2",[RF],"Secondo la tabella S.2-3, con qf,d ≤ 300 MJ/m² la classe minima di resistenza al fuoco è:",["15.","30.","Nessun requisito."]);
D("x29","s2",[RF],"Secondo la tabella S.2-3, con qf,d > 2400 MJ/m² la classe minima di resistenza al fuoco è:",["240.","180.","360."]);
D("x30","s2",[RF],"Secondo la tabella S.2-3, con qf,d ≤ 1200 MJ/m² la classe minima di resistenza al fuoco è:",["90.","120.","60."]);
D("x31","s2",[RF],"Nelle soluzioni conformi per il livello IV di resistenza al fuoco, la massima inflessione degli elementi caricati verticalmente (travi, solai) rispetto alla luce L è limitata a:",["δv,max/L = 1/100.","δv,max/L = 1/250.","δv,max/L = 1/500."]);
D("x32","s2",[RF],"Nella soluzione alternativa per il livello II di resistenza al fuoco, la capacità portante va garantita con un margine di sicurezza tmarg:",["≥ 100% di RSET e comunque ≥ 15 minuti.","≥ 50% di RSET e comunque ≥ 5 minuti.","≥ 200% di ASET."]);
D("x33","s2",[RF],"La verifica delle prestazioni di resistenza al fuoco con «incendi convenzionali di progetto» si basa su:",["Curve nominali d'incendio.","Curve naturali d'incendio ricavate dagli scenari del capitolo M.2.","Prove in scala reale."]);
D("x34","s2",[RF],"La curva nominale standard d'incendio del Codice (ISO 834) è:",["θg = 20 + 345 log10(8t + 1).","θg = 1080 (1 − 0,325 e^−0,167t − 0,675 e^−2,5t) + 20.","θg = 660 (1 − 0,687 e^−0,32t − 0,313 e^−3,8t) + 20."]);
D("x35","s2",[RF],"La curva nominale degli idrocarburi si usa:",["In caso di incendi di quantità rilevanti di idrocarburi o sostanze con equivalente velocità di rilascio termico, per la sola capacità portante.","Per le strutture esterne al compartimento.","Per tutti gli edifici civili."]);
D("x36","s2",[RF],"La curva nominale esterna si usa:",["Per strutture poste all'esterno, coinvolte da incendi sviluppatisi all'interno del compartimento.","Per incendi di idrocarburi.","Per le gallerie stradali."]);
D("x37","s2",[RF],"Le curve nominali d'incendio vanno applicate:",["A un compartimento dell'edificio alla volta, salvo il caso degli edifici multipiano con elementi orizzontali di separazione adeguati.","A tutto l'edificio contemporaneamente.","Solo ai compartimenti con qf,d > 600 MJ/m²."]);
D("x38","s2",[RF],"I valori del carico d'incendio specifico di progetto e le caratteristiche del compartimento adottati nel progetto:",["Costituiscono un vincolo d'esercizio per le attività da svolgere nella costruzione.","Sono indicativi e possono essere superati in esercizio.","Valgono solo per la fase di cantiere."]);
D("x39","s2",[RF],"Le curve naturali d'incendio (S.2.6) possono essere determinate con:",["Modelli sperimentali, modelli numerici semplificati dell'Eurocodice UNI EN 1991-1-2, modelli numerici avanzati.","Solo con la curva ISO 834.","Solo con prove su prototipi."]);
D("x40","s2",[RF],"Nella determinazione delle curve naturali d'incendio, il carico d'incendio specifico di progetto si calcola ponendo:",["Pari a 1 i coefficienti δni relativi alle misure antincendio che si intende modellare.","Pari a 0 tutti i coefficienti δ.","Pari a 2 il coefficiente δq1."]);
D("x41","s2",[RF],"Un elemento strutturale «secondario» deve essere verificato in modo che il suo cedimento non comprometta, tra l'altro:",["La capacità portante degli altri elementi, l'efficacia della compartimentazione, i sistemi di protezione attiva, l'esodo e la sicurezza dei soccorritori.","Solo l'estetica della costruzione.","Solo gli impianti tecnologici."]);
D("x42","s2",[RF],"Le «strutture vulnerabili in condizioni di incendio» (S.2.8.3) sono, ad esempio:",["Tensostrutture, strutture pressostatiche, coperture geodetiche, strutture in lega di alluminio, allestimenti temporanei in tubo e giunto.","Strutture in cemento armato ordinario.","Murature portanti in laterizio."]);
D("x43","s2",[RF],"Le strutture vulnerabili in condizioni di incendio si ritengono preferibilmente idonee:",["Solo per costruzioni per cui sono richiesti i livelli di prestazione I o II.","Per qualsiasi livello di prestazione.","Solo per il livello di prestazione V."]);
D("x44","s2",[RF],"Il carico d'incendio specifico di progetto è dato da:",["qf,d = δq1 · δq2 · δn · qf.","qf,d = qf / (δq1 · δq2).","qf,d = qf + δn."]);
D("x45","s2",[RF],"Il fattore δq1 tiene conto del rischio d'incendio in relazione:",["Alla dimensione (superficie lorda) del compartimento.","Al tipo di attività svolta nel compartimento.","Alle misure antincendio presenti."]);
D("x46","s2",[RF],"Il fattore δq2 tiene conto del rischio d'incendio in relazione:",["Al tipo di attività svolta nel compartimento.","Alla superficie del compartimento.","Alle misure antincendio presenti."]);
D("x47","s2",[RF],"Il fattore δn tiene conto:",["Delle differenti misure antincendio presenti nel compartimento.","Della superficie del compartimento.","Del tipo di materiali combustibili."]);
D("x48","s2",[RF],"Secondo la tabella S.2-6, per un compartimento con superficie lorda A < 500 m² il fattore δq1 vale:",["1,00.","1,20.","0,80."]);
D("x49","s2",[RF],"Secondo la tabella S.2-6, per un compartimento con superficie A ≥ 10000 m² il fattore δq1 vale:",["2,00.","1,80.","1,60."]);
D("x50","s2",[RF],"Secondo la tabella S.2-7, per aree a basso rischio d'incendio (classe I) il fattore δq2 vale:",["0,80.","1,00.","1,20."]);
D("x51","s2",[RF],"Secondo la tabella S.2-7, per aree ad alto rischio d'incendio (classe III) il fattore δq2 vale:",["1,20.","1,00.","1,40."]);
D("x52","s2",[RF],"Secondo la tabella S.2-8, con rivelazione e allarme di livello di prestazione III il coefficiente δn9 vale:",["0,85.","0,90.","0,54."]);
D("x53","s2",[RF],"Secondo la tabella S.2-8, con controllo dell'incendio di livello IV tramite sistema automatico ad acqua o schiuma e rete idranti con protezione interna, il coefficiente δn3 vale:",["0,54.","0,90.","0,81."]);
D("x54","s2",[RF],"Secondo la tabella S.2-8, per la GSA di livello II il coefficiente δn7 = 0,90 si applica a condizione che:",["Gli addetti antincendio garantiscano la presenza continuativa durante le 24 ore.","L'attività sia aperta al pubblico.","Sia presente un impianto sprinkler."]);
D("x55","s2",[RF],"Nel calcolo del carico d'incendio, il fattore di partecipazione alla combustione mi vale:",["0,80 per legno e materiali cellulosici, 1,00 per tutti gli altri materiali combustibili.","1,00 per il legno e 0,80 per le plastiche.","0,50 per tutti i materiali."]);
D("x56","s2",[RF],"Nel calcolo del carico d'incendio, il fattore di limitazione ψi vale 0 per:",["Materiali in contenitori appositamente progettati per resistere al fuoco, almeno EI 15.","Materiali in contenitori non combustibili non progettati per resistere al fuoco.","Bombolette spray e barattoli di vetro."]);
D("x57","s2",[RF],"Nel calcolo del carico d'incendio, il fattore ψi vale 0,85 per:",["Materiali in contenitori non combustibili che conservano la loro integrità durante l'incendio, ma non progettati per resistere al fuoco (es. fusti metallici).","Materiali in armadi resistenti al fuoco.","Materiali sfusi."]);
D("x58","s2",[RF],"Il potere calorifico inferiore Hi dei materiali, nel calcolo del carico d'incendio, può essere determinato:",["Sperimentalmente secondo UNI EN ISO 1716, dal prospetto E3 della UNI EN 1991-1-2 o dalla letteratura tecnica.","Solo con la dichiarazione del responsabile dell'attività.","Solo dalla tabella S.2-3."]);
D("x59","s2",[RF],"Se il carico d'incendio qf si determina con valutazione statistica, si fa riferimento a valori con probabilità di superamento:",["Inferiore al 20% (frattile 80%).","Inferiore al 50%.","Inferiore al 5%."]);
D("x60","s2",[RF],"Per calcolare il frattile 80% partendo da valori medi di letteratura, per attività con variabilità limitata del mobilio (abitazioni, alberghi, uffici, scuole) il coefficiente moltiplicativo va scelto tra:",["1,20 e 1,50.","1,20 e 1,75.","1,50 e 2,00."]);
D("x61","s2",[RF],"Per attività con maggiore variabilità del mobilio o delle merci (centri commerciali, attività industriali) il coefficiente moltiplicativo per il frattile 80% va scelto tra:",["1,20 e 1,75.","1,20 e 1,50.","1,00 e 1,20."]);
D("x62","s2",[RF],"Secondo la tabella S.2-10 (UNI EN 1991-1-2), il frattile 80% della densità di carico d'incendio per gli uffici è:",["511 MJ/m².","948 MJ/m².","1824 MJ/m²."]);
D("x63","s2",[RF],"Secondo la tabella S.2-10, l'attività con il carico d'incendio medio più elevato tra quelle elencate è:",["Biblioteche (1500 MJ/m² medio).","Uffici.","Centri commerciali."]);
D("x64","s2",[RF],"Per determinare il contributo al carico d'incendio delle strutture in legno (S.2.9.2), la classe iniziale determinata senza gli elementi lignei:",["Non può essere inferiore a 15 minuti.","Non può essere inferiore a 60 minuti.","Può essere nulla."]);
D("x65","s2",[RF],"Secondo la tabella S.2-11, la velocità di carbonizzazione del legno lamellare incollato di conifera (densità ≥ 290 kg/m³) è:",["0,70 mm/min.","0,55 mm/min.","1,00 mm/min."]);
D("x66","s2",[RF],"Le prestazioni di resistenza al fuoco di prodotti ed elementi costruttivi possono essere determinate in base ai risultati di:",["Prove, calcoli, confronti con tabelle.","Solo prove di laboratorio.","Solo calcoli secondo gli Eurocodici."]);
D("x67","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera R indica:",["La capacità portante.","La tenuta.","L'irraggiamento."]);
D("x68","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera E indica:",["La tenuta: capacità di impedire il passaggio di fumi e gas caldi.","L'isolamento termico.","La capacità portante."]);
D("x69","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera I indica:",["L'isolamento: capacità di limitare il passaggio di calore; senza pedice si intende I2.","L'irraggiamento.","L'integrità meccanica."]);
D("x70","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera W indica:",["L'irraggiamento: capacità di limitare l'irraggiamento termico dalla superficie non esposta.","La tenuta al fumo.","La capacità portante."]);
D("x71","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera M indica:",["L'azione meccanica: capacità di resistere all'impatto di altri elementi senza perdere i requisiti.","Il materiale incombustibile.","La massa dell'elemento."]);
D("x72","s2",[RF],"Nel simbolo di classificazione di resistenza al fuoco, la lettera C indica:",["Il dispositivo automatico di chiusura di un varco.","La capacità portante.","La continuità di corrente."]);
D("x73","s2",[RF],"Il requisito di tenuta al fumo Sa indica:",["Tenuta al passaggio di gas o fumi garantita a temperatura ambiente.","Tenuta garantita sia a temperatura ambiente che a 200 °C.","Tenuta garantita fino a 600 °C."]);
D("x74","s2",[RF],"Il requisito di tenuta al fumo Sm (o S200) indica:",["Tenuta al passaggio di gas o fumi garantita sia a temperatura ambiente che a 200 °C.","Tenuta garantita solo a temperatura ambiente.","Tenuta per 200 minuti."]);
D("x75","s2",[RF],"Nel simbolo di classificazione, la lettera K indica:",["La capacità di protezione al fuoco di rivestimenti a parete o soffitto.","La continuità di corrente dei cavi.","La resistenza all'incendio della fuliggine."]);
D("x76","s2",[RF],"Nel simbolo di classificazione, la lettera G indica:",["La resistenza all'incendio della fuliggine dei condotti di passaggio fumi.","La capacità di protezione dei rivestimenti.","La funzionalità degli evacuatori naturali."]);
D("x77","s2",[RF],"Nel simbolo di classificazione, le lettere P o PH indicano:",["La continuità di corrente o capacità di segnalazione di un cavo in condizioni d'incendio.","La capacità portante.","La funzionalità degli evacuatori di fumo."]);
D("x78","s2",[RF],"Nel simbolo di classificazione, le lettere F e B indicano:",["La funzionalità degli evacuatori di fumo e calore, rispettivamente motorizzati e naturali.","La tenuta al fumo di porte e barriere.","La durata della stabilità delle barriere al fumo."]);
D("x79","s2",[RF],"Alla classificazione REI-M di un prodotto per un dato tempo corrisponde automaticamente:",["Anche la classificazione REI, RE e R per lo stesso periodo.","Solo la classificazione R.","Nessun'altra classificazione."]);
D("x80","s2",[RF],"Al requisito I di un prodotto per un dato tempo corrisponde automaticamente:",["Anche il requisito W per lo stesso periodo.","Anche il requisito M.","Anche il requisito R."]);
D("x81","s2",[RF],"Ai fini della resistenza al fuoco, gli elementi costruttivi e i prodotti non marcati CE possono essere classificati:",["Con qualsiasi classe discreta tra 15 e 360 minuti.","Solo con le classi 30, 60, 90, 120.","Solo con classi multiple di 30."]);
D("x82","s2",[RF],"Un elemento strutturale classificato REI 60-M ricomprende anche le classi:",["REI 45-M, REI 30-M, REI 20-M e REI 15-M.","REI 90-M.","Nessuna classe inferiore."]);
D("x83","s2",[RF],"Le porte a tenuta di fumo sono classificate secondo:",["EN 13501-2 ed EN 1634-3, con classificazione S200 o Sa.","EN 1634-1, con classificazione EI.","EN 1366-2."]);
D("x84","s2",[RF],"Nella classificazione delle porte, l'aggiunta del simbolo «C» indica che:",["Il prodotto soddisfa anche il criterio della chiusura automatica (prova pass/fail).","La porta è in classe di reazione al fuoco C.","La porta ha capacità portante."]);
D("x85","s2",[RF],"Nella classificazione delle condotte di ventilazione e delle serrande, le indicazioni «(i→o)», «(o→i)», «(i↔o)» indicano:",["Se l'elemento rispetta i requisiti per incendio dall'interno, dall'esterno o da entrambi.","L'orientamento verticale od orizzontale.","Le classi di perdita."]);
D("x86","s2",[RF],"Nella classificazione delle serrande e condotte, i simboli «ve» e «ho» indicano:",["L'adeguatezza all'uso verticale od orizzontale.","Il verso dell'incendio.","Il tipo di attivazione automatica o manuale."]);
D("x87","s2",[RF],"Nella classificazione delle barriere al fumo, il suffisso «A» indica:",["Un periodo qualsiasi superiore a 120 minuti.","L'attivazione automatica.","La classe di reazione al fuoco A."]);
D("x88","s2",[RF],"Il DM 9 marzo 2007 riguarda:",["Le prestazioni di resistenza al fuoco delle costruzioni nelle attività soggette al controllo del CNVVF.","La classificazione di resistenza al fuoco di prodotti ed elementi costruttivi.","La reazione al fuoco dei materiali."]);
D("x89","s2",[RF],"Il DM 16 febbraio 2007 riguarda:",["La classificazione di resistenza al fuoco di prodotti ed elementi costruttivi di opere da costruzione.","Le prestazioni di resistenza al fuoco delle costruzioni.","Le attività soggette ai controlli."]);
D("x90","s2",[RF],"Secondo la lezione, per la resistenza al fuoco il DM 9/3/2007 serve a determinare la prestazione da richiedere, mentre il DM 16/2/2007 serve a:",["Verificare la prestazione posseduta (metodo sperimentale, tabellare, analitico).","Calcolare il carico d'incendio.","Scegliere la curva d'incendio."]);
D("x91","s2",[RF],"Le tabelle per la classificazione di resistenza al fuoco (S.2.15) si possono usare:",["Solo per elementi per cui è richiesta resistenza al fuoco rispetto alla curva standard e alle azioni meccaniche previste.","Per qualsiasi curva d'incendio, anche naturale.","Estrapolando liberamente i valori."]);
D("x92","s2",[RF],"I valori delle tabelle di classificazione di resistenza al fuoco (S.2.15):",["Non consentono estrapolazioni o interpolazioni né modifiche delle condizioni di utilizzo.","Possono essere interpolati liberamente.","Valgono per qualsiasi altezza di parete."]);
D("x93","s2",[RF],"Le tabelle S.2-40 e seguenti per murature non portanti valgono con un'altezza della parete tra i solai (o tra elementi di irrigidimento):",["Non superiore a 4 m.","Non superiore a 6 m.","Non superiore a 3 m."]);
D("x94","s2",[RF],"Secondo la tabella S.2-40, una muratura non portante in laterizio con foratura > 55% e intonaco normale garantisce EI 60 con spessore minimo:",["150 mm.","120 mm.","200 mm."]);
D("x95","s2",[RF],"I metodi di calcolo per la classificazione di resistenza al fuoco richiamati dal Codice sono:",["Quelli degli Eurocodici (EN 1991-1-2, EN 1992-1-2, … EN 1999-1-2) con le appendici nazionali.","Solo metodi sperimentali.","Quelli del DM 30/11/1983."]);
D("x96","s2",[RF],"Il rapporto di classificazione di resistenza al fuoco è:",["Il documento redatto dal laboratorio di prova secondo la EN 13501 che attesta la classe dell'elemento, sulla base di uno o più rapporti di prova.","Il certificato del professionista antincendio.","La dichiarazione del produttore."]);
D("x97","s2",[RF],"In caso di variazioni del prodotto classificato non previste dal campo di diretta applicazione, il produttore deve predisporre:",["Un fascicolo tecnico, da conservare e rendere disponibile al professionista e alla DCPST.","Una nuova omologazione ministeriale.","Una semplice autocertificazione."]);
D("x98","s2",[RF],"I controsoffitti privi di intrinseca resistenza al fuoco (membrane protettive) conformi ai requisiti previsti per il «seminaturale» ricevono il simbolo aggiuntivo:",["«sn».","«S».","«C»."]);
D("x99","s2",[RF],"Nel calcolo del carico d'incendio specifico di progetto di un compartimento multipiano con scale aperte e solai adeguati, si possono considerare:",["Carichi d'incendio specifici distinti per piano, pur essendo un unico compartimento.","Solo il carico del piano terra.","Un unico carico riferito alla somma delle superfici di tutti i piani."]);

// Blocco 8 – Compartimentazione, capitolo S.3 (D'Odorico, 07/10/2026).
const CO = "Lezione D'Odorico 07/10/2026 – Compartimentazione (S.3)";
D("k10","s3",[CO],"Secondo il G.1.8, lo «spazio a cielo libero» è:",["Un luogo esterno alle opere da costruzione non delimitato superiormente.","Uno spazio scoperto superiormente grigliato.","Un cortile interno di superficie inferiore a 50 m²."]);
D("k11","s3",[CO],"Secondo il G.1.8, lo «spazio scoperto» è:",["Uno spazio con caratteristiche tali da contrastare temporaneamente la propagazione dell'incendio tra le opere da costruzione che lo delimitano.","Un compartimento antincendio senza copertura.","Qualsiasi area esterna all'attività."]);
D("k12","s3",[CO],"Se in un'attività non è prevista alcuna compartimentazione:",["Si intende che il compartimento coincida con l'intera opera da costruzione.","L'attività non può essere esercita.","Ogni locale è un compartimento autonomo."]);
D("k13","s3",[CO],"Secondo il G.1.8, il «filtro» è:",["Un compartimento antincendio nel quale la probabilità di avvio e sviluppo dell'incendio è resa trascurabile.","Un dispositivo che trattiene i fumi nelle condotte.","Un'apertura di ventilazione permanente."]);
D("k14","s3",[CO],"La locuzione «a prova di fumo» indica:",["La capacità di un compartimento di limitare l'ingresso di fumo generato da incendio che si sviluppi in compartimenti comunicanti.","Un locale privo di materiali combustibili.","Una porta classificata EI 120."]);
D("k15","s3",[CO],"Secondo il G.1.8, «di tipo esterno» indica:",["Una porzione dell'attività esterna all'opera da costruzione, con caratteristiche tali da contrastare temporaneamente la propagazione dell'incendio proveniente dall'opera.","Un locale con almeno una parete su spazio scoperto.","Un compartimento con uscita diretta su strada."]);
D("k16","s3",[CO],"L'«intercapedine antincendio» è:",["Un vano di distacco per aerazione, ventilazione o smaltimento dei fumi, delimitato superiormente da spazio scoperto e lateralmente da muri perimetrali e terrapieno di pari resistenza al fuoco.","Un'intercapedine tra due pareti REI riempita di lana minerale.","Lo spazio tra controsoffitto e solaio."]);
D("k17","s3",[CO],"Nel capitolo S.3, la compartimentazione è realizzata mediante:",["Compartimenti antincendio all'interno della stessa opera e interposizione di distanze di separazione tra opere o altri bersagli combustibili.","Solo impianti di spegnimento automatico.","Solo porte tagliafuoco."]);
D("k18","s3",[CO],"Nella tabella S.3-1, il livello di prestazione III di compartimentazione contrasta per un periodo congruo con la durata dell'incendio:",["La propagazione dell'incendio verso altre attività e la propagazione dell'incendio e dei fumi freddi all'interno della stessa attività.","Solo la propagazione verso altre attività.","Solo la propagazione dei fumi caldi."]);
D("k19","s3",[CO],"Nella tabella S.3-2, il livello di prestazione I di compartimentazione:",["Non è ammesso nelle attività soggette.","È ammesso nelle attività di categoria A.","È il livello normalmente attribuito."]);
D("k20","s3",[CO],"Nella tabella S.3-2, il livello di prestazione II di compartimentazione si attribuisce:",["Alle attività non ricomprese negli altri criteri di attribuzione.","Solo alle attività con Rvita D1 o D2.","Alle attività con elevato affollamento."]);
D("k21","s3",[CO],"Il livello di prestazione III di compartimentazione si può applicare in particolare ove ci siano compartimenti con Rvita:",["D1, D2, Cii2, Cii3, Ciii2, Ciii3, per proteggere occupanti che dormono o ricevono cure mediche.","A1 e A2.","B1, B2, B3."]);
D("k22","s3",[CO],"Il livello di prestazione I della compartimentazione:",["Non richiede l'applicazione di soluzioni progettuali.","Richiede compartimenti a prova di fumo.","Richiede distanze di separazione di almeno 10 m."]);
D("k23","s3",[CO],"Le soluzioni conformi per il livello di prestazione III di compartimentazione:",["Applicano quelle del livello II, impiegando elementi a tenuta di fumo (Sa) per i compartimenti.","Richiedono elementi EI 120 in ogni caso.","Richiedono impianto sprinkler."]);
D("k24","s3",[CO],"Lo spazio scoperto deve avere una superficie lorda minima libera in pianta, in m², non inferiore a:",["Quella ottenuta moltiplicando per 3 l'altezza in metri della parete più bassa che lo delimita.","50 m².","L'altezza della parete più alta al quadrato."]);
D("k25","s3",[CO],"Nello spazio scoperto la distanza fra le strutture verticali che lo delimitano deve essere:",["≥ 3,50 m.","≥ 2,00 m.","≥ 5,00 m."]);
D("k26","s3",[CO],"Se lo spazio scoperto è superiormente grigliato, il rapporto tra superficie utile e superficie lorda della griglia deve essere:",["≥ 75%.","≥ 50%.","≥ 25%."]);
D("k27","s3",[CO],"Se le pareti dello spazio scoperto hanno strutture aggettanti o rientranti, lo spazio è ancora scoperto se il rapporto fra sporgenza (o rientranza) e relativa altezza di impostazione è:",["≤ 1/2.","≤ 1/4.","≤ 1."]);
D("k28","s3",[CO],"Un compartimento a prova di fumo può essere ottenuto, tra l'altro, con:",["Un sistema di pressione differenziale secondo UNI EN 12101-6.","Una porta EI 30 senza dispositivo di chiusura.","Un rivestimento in classe A1."]);
D("k29","s3",[CO],"Il filtro deve avere classe di resistenza al fuoco:",["≥ 30 minuti.","≥ 60 minuti.","≥ 120 minuti."]);
D("k30","s3",[CO],"Il filtro deve essere munito di due o più chiusure dei varchi almeno:",["E 30-Sa.","EI 60.","REI 120."]);
D("k31","s3",[CO],"Nel filtro il carico d'incendio specifico deve essere:",["qf ≤ 50 MJ/m².","qf ≤ 200 MJ/m².","qf ≤ 100 MJ/m²."]);
D("k32","s3",[CO],"Il filtro a prova di fumo può essere mantenuto in sovrappressione in emergenza ad almeno:",["30 Pa.","10 Pa.","50 Pa."]);
D("k33","s3",[CO],"Il filtro a prova di fumo dotato di camino per lo smaltimento dei fumi deve avere sezione del camino:",["≥ 0,10 m².","≥ 1 m².","≥ 0,50 m²."]);
D("k34","s3",[CO],"Il filtro a prova di fumo aerato direttamente verso l'esterno deve avere aperture di superficie utile complessiva:",["≥ 1 m², permanentemente aperte o con chiusure apribili automaticamente in caso d'incendio, escluso l'uso di condotti.","≥ 0,10 m².","≥ 3 m²."]);
D("k35","s3",[CO],"Per i varchi del filtro a prova di fumo è ammesso l'impiego di chiusure:",["E 30.","E 15.","Senza classificazione."]);
D("k36","s3",[CO],"Le porte tagliafuoco devono essere contrassegnate su entrambi i lati con il segnale:",["UNI EN ISO 7010-F007 «Porta tagliafuoco tenere chiusa» o «a chiusura automatica».","UNI EN ISO 7010-E001 «Uscita di emergenza».","UNI EN ISO 7010-W021 «Materiale infiammabile»."]);
D("k37","s3",[CO],"Facciate continue, facciate ventilate e coperture:",["Non devono pregiudicare l'efficacia della compartimentazione di piano o di qualsiasi altra compartimentazione dell'edificio.","Sono sempre escluse dalle verifiche antincendio.","Devono essere in classe A1."]);
D("k38","s3",[CO],"Secondo il S.3.6.1, devono essere inseriti in compartimenti distinti:",["Ciascun piano interrato e fuori terra di attività multipiano, aree con diverso profilo di rischio, altre attività nella stessa opera.","Solo i piani interrati.","Solo i locali con carico d'incendio superiore a 600 MJ/m²."]);
D("k39","s3",[CO],"Nella tabella S.3-6, la massima superficie lorda dei compartimenti è ridotta del 50% quando:",["Il compartimento ha Rambiente significativo.","Il compartimento è a piano terra.","È presente un impianto sprinkler."]);
D("k40","s3",[CO],"Nella tabella S.3-6, per Rvita A1 a quota ≤ 12 m la superficie lorda del compartimento:",["Non ha limitazione.","Non può superare 4000 m².","Non può superare 16000 m²."]);
D("k41","s3",[CO],"Nella tabella S.3-6, per Rvita A4 la massima superficie del compartimento a quota ≤ 12 m è:",["16000 m²; non è ammesso a quote superiori o in interrato.","Senza limitazione.","2000 m²."]);
D("k42","s3",[CO],"Secondo la tabella S.3-7, per Rvita A1, A2, A3, B1, B2, B3, E1, E2, Cii1, Cii2, Ciii1, Ciii2 i piani a quota > −1 m e ≤ 6 m:",["Possono essere inseriti in uno o più compartimenti multipiano senza prescrizioni aggiuntive.","Devono sempre essere compartimenti di piano.","Richiedono IRAI di livello IV."]);
D("k43","s3",[CO],"Secondo la tabella S.3-7, per i compartimenti multipiano a quota > 12 m e ≤ 32 m il dislivello massimo tra i piani inseriti è:",["≤ 7 m.","≤ 12 m.","≤ 3,5 m."]);
D("k44","s3",[CO],"La classe di resistenza al fuoco minima di ogni compartimento si determina:",["Secondo il capitolo S.2.","Secondo il capitolo S.4.","Sempre pari a EI 60."]);
D("k45","s3",[CO],"Se il carico d'incendio specifico di progetto non impone una classe minima di resistenza al fuoco:",["Non è richiesto il compartimento, salvo che sia prescritta altrimenti una classe minima.","Il compartimento deve comunque essere EI 120.","Si applica la classe EI 30."]);
D("k46","s3",[CO],"Per il filtro o per la scala d'esodo protetta è prescritta una classe minima di resistenza al fuoco pari a:",["30.","60.","15."]);
D("k47","s3",[CO],"Tra compartimenti adiacenti afferenti a diversi responsabili di attività, gli elementi di separazione devono avere resistenza al fuoco non inferiore a:",["EI 60.","EI 30.","EI 120."]);
D("k48","s3",[CO],"Le chiusure dei varchi di comunicazione tra compartimenti devono:",["Avere analoga classe di resistenza al fuoco ed essere munite di dispositivo di autochiusura o mantenute permanentemente chiuse.","Avere classe inferiore di 15 minuti rispetto alla parete.","Essere sempre aperte per agevolare l'esodo."]);
D("k49","s3",[CO],"Le chiusure dei varchi tra compartimenti e vie d'esodo di una stessa attività dovrebbero essere almeno:",["A tenuta (E) e a tenuta di fumi freddi (Sa); non è normalmente richiesto l'isolamento (I) e l'irraggiamento (W).","EI 120-Sm.","REI 60."]);
D("k50","s3",[CO],"Le porte tagliafuoco lungo le principali vie di passaggio degli occupanti dovrebbero preferibilmente essere munite di:",["Fermo elettromagnetico in apertura asservito all'IRAI.","Serratura a chiave.","Molla di richiamo senza fermo."]);
D("k51","s3",[CO],"Nella tabella S.3-9, il simbolo S (tenuta di fumo) si impiega per:",["Il contenimento di fumi e gas freddi.","Il contenimento di fumi caldi e fiamme.","Limitare la propagazione per contatto."]);
D("k52","s3",[CO],"Nella tabella S.3-9, il requisito I (isolamento) si impiega per:",["Limitare la propagazione dell'incendio per contatto tra materiale combustibile e la faccia non esposta dell'elemento.","Contenere i fumi freddi.","Resistere ad azioni meccaniche accidentali."]);
D("k53","s3",[CO],"Per l'attraversamento di un compartimento con tubazioni in PVC si impiegano tipicamente:",["Sistemi sigillanti resistenti al fuoco, ad esempio collari o sacchetti intumescenti.","Semplici guaine in plastica.","Nessun accorgimento, se il tubo è vuoto."]);
D("k54","s3",[CO],"Per garantire la continuità della compartimentazione nelle canalizzazioni aerauliche si usano:",["Serrande tagliafuoco o canalizzazioni resistenti al fuoco.","Griglie di ventilazione.","Filtri antipolvere."]);
D("k55","s3",[CO],"La distanza di separazione (S.3.8) con procedura tabellare limita l'irraggiamento termico sul bersaglio al valore soglia:",["Esoglia = 12,6 kW/m².","Esoglia = 33 kW/m².","Esoglia = 2,5 kW/m²."]);
D("k56","s3",[CO],"Il valore di 12,6 kW/m² per la distanza di separazione è scelto perché:",["È il valore limite convenzionale entro il quale non avviene innesco del legno in aria stazionaria.","È la soglia di danno per le strutture in acciaio.","È l'irraggiamento solare estivo."]);
D("k57","s3",[CO],"Nel calcolo della distanza di separazione il progettista verifica almeno le seguenti sorgenti e bersagli:",["Opere da costruzione e depositi di materiali combustibili, anche in spazio a cielo libero.","Solo gli edifici confinanti.","Solo i depositi di liquidi infiammabili."]);
D("k58","s3",[CO],"Se il carico d'incendio dei compartimenti o dei depositi è qf < 600 MJ/m², si considera soluzione conforme anche:",["L'interposizione di spazio scoperto tra sorgente e bersaglio.","L'assenza di qualsiasi separazione.","Una parete EI 15."]);
D("k59","s3",[CO],"Secondo il S.3.9, nella stessa opera da costruzione la coesistenza di più attività, anche di responsabili diversi:",["È generalmente ammessa.","Non è mai ammessa.","È ammessa solo con deroga."]);
D("k60","s3",[CO],"In presenza di comunicazioni tra attività di responsabili diversi, i compartimenti con Rvita D1 o D2:",["Devono essere a prova di fumo proveniente dalle altre attività.","Devono essere privi di comunicazioni.","Non richiedono misure aggiuntive."]);
D("k61","s3",[CO],"Nel metodo della distanza di separazione, gli «elementi radianti» sono:",["Le aperture e i rivestimenti combustibili della facciata della sorgente da cui esce l'energia radiante (finestre, porte, vetrate…).","Le pareti REI della facciata.","I bersagli colpiti dall'irraggiamento."]);
D("k62","s3",[CO],"La percentuale di foratura pi di una piastra radiante è:",["Il rapporto tra la superficie degli elementi radianti nella piastra e la superficie della piastra; non può essere inferiore a 0,2.","Il rapporto tra superficie della piastra e altezza dell'edificio.","Sempre pari a 1."]);
D("k63","s3",[CO],"Se la sorgente non ha pareti laterali (es. tettoia o deposito all'aperto), la percentuale di foratura pi si assume pari a:",["1.","0,2.","0,5."]);
D("k64","s3",[CO],"Nella procedura tabellare la distanza di separazione per la i-esima piastra radiante si calcola come:",["di = αi · pi + βi.","di = Hi / pi.","di = 12,6 · pi."]);
D("k65","s3",[CO],"Nella procedura tabellare, se il compartimento retrostante la piastra radiante ha controllo dell'incendio di livello IV:",["La distanza di separazione può essere dimezzata.","La distanza di separazione raddoppia.","Non serve alcuna distanza."]);
D("k66","s3",[CO],"Nella procedura analitica, la distanza di separazione è adeguata se:",["F2-1 · E1 · εf < Esoglia.","E1 > Esoglia.","di > Hmax."]);
D("k67","s3",[CO],"Nella procedura tabellare, la distanza di separazione d tra sorgente e bersaglio è assunta pari:",["Al massimo dei valori di per tutte le piastre radianti del piano radiante.","Alla media dei valori di.","Al minimo dei valori di."]);
D("k68","s3",[CO],"Nella determinazione del piano radiante possono essere omessi:",["Gli elementi aggettanti incombustibili, come sbalzi aperti, balconi, sporti di gronda.","Le finestre.","I rivestimenti di facciata combustibili."]);

// Blocco 9 – Esodo S.4 (presentazione esodo con soluzioni conformi; PRESEN2 esodo e FSE).
const ES = "Presentazione Esodo con soluzioni conformi (S.4)";
const EF = "Presentazione PRESEN2 – Esodo e FSE";
D("y10","s4",[ES],"Il «sistema d'esodo» è:",["L'insieme delle misure di salvaguardia della vita che consentono agli occupanti di raggiungere un luogo sicuro o permanere al sicuro, autonomamente o con assistenza, prima che l'incendio determini condizioni incapacitanti.","Il solo insieme delle scale di emergenza.","L'impianto di illuminazione di sicurezza."]);
D("y11","s4",[ES],"Il «luogo sicuro» è:",["Un luogo in cui è permanentemente trascurabile il rischio d'incendio per gli occupanti che vi stazionano o vi transitano.","Un luogo in cui il rischio è temporaneamente trascurabile.","Qualsiasi compartimento diverso da quello dell'incendio."]);
D("y12","s4",[ES],"Nel luogo sicuro, l'irraggiamento massimo sugli occupanti deve essere:",["2,5 kW/m².","12,6 kW/m².","1,0 kW/m²."]);
D("y13","s4",[ES],"Il luogo sicuro va contrassegnato con il segnale:",["UNI EN ISO 7010-E007.","UNI EN ISO 7010-E024.","UNI EN ISO 7010-M001."]);
D("y14","s4",[ES],"Relativamente a un compartimento, si considera luogo sicuro temporaneo:",["Qualsiasi altro compartimento o spazio scoperto attraversabile per raggiungere il luogo sicuro senza rientrare nel compartimento in esame.","Solo la pubblica via.","Il vano scala non protetto."]);
D("y15","s4",[ES],"Una via d'esodo orizzontale ha pendenza:",["Non superiore al 5%.","Non superiore all'8%.","Non superiore al 12%."]);
D("y16","s4",[ES],"Per gli occupanti con disabilità motorie che si muovono in autonomia, la pendenza massima delle rampe è:",["8%.","5%.","12%."]);
D("y17","s4",[ES],"Le rampe con pendenza superiore al 12%:",["Si impiegano per l'esodo solo eccezionalmente.","Sono vie d'esodo ordinarie.","Sono vie d'esodo orizzontali."]);
D("y18","s4",[ES],"Quale dei seguenti NON è considerato via d'esodo?",["Gli ascensori e le scale portatili.","Le scale protette.","Le rampe con pendenza tra il 5% e il 12%."]);
D("y19","s4",[ES],"La porzione di facciata su cui è collocata una via d'esodo esterna deve avere classe almeno:",["EI 30, oppure E 30 se la via d'esodo è realizzata con materiali e strutture incombustibili.","EI 120.","REI 60."]);
D("y20","s4",[ES],"La porzione di facciata protetta per una via d'esodo esterna si ottiene con un offset dalla proiezione del piano di calpestio pari a:",["1,80 m.","2,50 m.","1,00 m."]);
D("y21","s4",[ES],"In alternativa, la via d'esodo esterna deve essere distaccata dall'opera, da aperture di smaltimento o di evacuazione di fumi e calore, di almeno:",["2,50 m.","1,80 m.","5,00 m."]);
D("y22","s4",[ES],"Le vie d'esodo esterne devono essere soggette a un irraggiamento:",["Inferiore a 2,5 kW/m² e non investite dagli effetti dell'incendio.","Inferiore a 12,6 kW/m².","Qualsiasi, se in acciaio."]);
D("y23","s4",[ES],"Le «vie d'esodo senza protezione» sono:",["Tutte quelle che non possono essere classificate come protette, a prova di fumo o esterne.","Le vie d'esodo senza illuminazione di sicurezza.","Le vie d'esodo all'aperto."]);
D("y24","s4",[ES],"Le scale alla marinara sono ammesse:",["Solo a servizio di locali con basso affollamento ed esclusiva presenza di personale specificamente formato (es. locali impianti).","In tutte le attività con meno di 50 occupanti.","Mai."]);
D("y25","s4",[ES],"Le modalità di gestione di scale e marciapiedi mobili usati per l'esodo sono:",["Fermata e mantenimento in posizione, mantenimento del moto, fermata e inversione del moto.","Solo la fermata immediata.","Solo il mantenimento del moto."]);
D("y26","s4",[ES],"Il «percorso d'esodo» è:",["La parte della via d'esodo dall'uscita dei locali dedicati all'attività fino all'uscita finale (corridoi, scale, rampe, atri…).","L'intero tragitto dal posto dell'occupante al luogo sicuro.","La sola scala d'emergenza."]);
D("y27","s4",[ES],"Le porte lungo le vie d'esodo devono aprirsi:",["Su aree piane orizzontali di profondità almeno pari alla larghezza complessiva del varco.","Sempre verso l'interno del locale.","Su gradini, per guadagnare spazio."]);
D("y28","s4",[ES],"Per le porte ad apertura manuale lungo le vie d'esodo si impiegano, in funzione dell'ambito e degli occupanti, dispositivi secondo:",["UNI EN 179 o UNI EN 1125 (tipo A o B).","UNI EN 1838.","UNI EN 12101-6."]);
D("y29","s4",[ES],"I tornelli e le porte ad azionamento automatico lungo le vie d'esodo sono ammessi:",["Se non costituiscono intralcio all'esodo in emergenza, in assenza di alimentazione elettrica o in caso di guasto.","Sempre.","Mai."]);
D("y30","s4",[ES],"Le uscite finali devono essere contrassegnate sul lato verso luogo sicuro con il segnale:",["UNI EN ISO 7010-M001 «Uscita di emergenza, lasciare libero il passaggio».","UNI EN ISO 7010-F007.","UNI EN ISO 7010-E007."]);
D("y31","s4",[ES],"Le planimetrie per l'emergenza vanno realizzate secondo:",["UNI ISO 23601.","UNI EN 1838.","UNI 9795."]);
D("y32","s4",[ES],"Se un'attività civile condivide vie d'esodo con altre attività, in assenza di accorgimenti gestionali, pianificazione d'emergenza e allarme condivisi, le vie d'esodo devono essere:",["A prova di fumo.","Esterne.","Protette con porte EI 30."]);
D("y33","s4",[ES],"La «protezione sul posto» come modalità d'esodo prevede:",["La protezione degli occupanti nell'ambito in cui si trovano.","Lo spostamento contemporaneo di tutti gli occupanti.","L'evacuazione per piani successivi."]);
D("y34","s4",[ES],"L'«esodo orizzontale progressivo» è tipico di:",["Ospedali e strutture sanitarie.","Edifici residenziali.","Attività all'aperto."]);
D("y35","s4",[ES],"L'«esodo per fasi» è tipico di:",["Edifici di grande altezza, multisale, centri commerciali, grandi uffici.","Piccole attività a un solo piano.","Abitazioni monofamiliari."]);
D("y36","s4",[ES],"In caso di esodo per fasi, l'attività deve essere sorvegliata da:",["IRAI di livello III con sistema EVAC, con GSA di livello II e ciascun piano in compartimento autonomo (compartimentazione livello III).","Solo estintori.","IRAI di livello I."]);
D("y37","s4",[ES],"L'esodo per fasi è ammesso:",["Solo per piani a quota ≥ −5 m.","Solo per piani interrati.","Per qualsiasi quota."]);
D("y38","s4",[ES],"L'affollamento massimo di ciascun locale si determina:",["Moltiplicando la densità di affollamento per la superficie lorda (tab. S.4-12), con i criteri della tab. S.4-13, da RTV, da norme o da dichiarazione del responsabile.","Contando i posti a sedere del solo piano terra.","Dividendo la superficie per 10."]);
D("y39","s4",[ES],"Il responsabile dell'attività può dichiarare un affollamento inferiore a quello determinato:",["Impegnandosi a rispettarlo per ogni ambito e in ogni condizione d'esercizio.","Mai.","Solo per le attività all'aperto."]);
D("y40","s4",[ES],"Le vie d'esodo verticali che collegano compartimenti devono essere protette con classe non inferiore a 30 e chiusure almeno:",["E 30-Sa.","EI 60.","E 15."]);
D("y41","s4",[ES],"Per edifici con piani a quota inferiore a −5 m, le vie d'esodo interrate, se non a prova di fumo:",["Devono essere in compartimento distinto dalle vie d'esodo fuori terra.","Possono proseguire liberamente verso i piani fuori terra.","Devono essere esterne."]);
D("y42","s4",[ES],"Le vie d'esodo da ambiti aperti al pubblico:",["Non devono attraversare ambiti non aperti al pubblico, salvo se esclusivamente dedicati all'esodo.","Possono attraversare qualsiasi ambito.","Devono attraversare i depositi."]);
D("y43","s4",[ES],"In emergenza gli occupanti tendono solitamente a:",["Uscire percorrendo in senso inverso la via d'ingresso.","Usare sempre l'uscita di emergenza più vicina.","Restare nel locale."]);
D("y44","s4",[ES],"Due vie d'esodo orizzontali sono indipendenti se:",["L'angolo formato dai percorsi rettilinei è ≥ 45° oppure sono separate da elementi resistenti al fuoco a tutta altezza (almeno EI 30).","Hanno larghezza superiore a 1,20 m.","Sono entrambe illuminate."]);
D("y45","s4",[ES],"Due vie d'esodo verticali non protette nello stesso compartimento sono indipendenti se, tra l'altro:",["Ciascuna è impiegata da non più di 100 occupanti e nessun piano servito è a quota inferiore a −1 m.","Sono larghe almeno 1,80 m.","Servono più di tre piani."]);
D("y46","s4",[ES],"Il «corridoio cieco» è:",["Una porzione di via d'esodo da cui è possibile l'esodo in un'unica direzione.","Un corridoio senza finestre.","Un corridoio senza illuminazione di sicurezza."]);
D("y47","s4",[ES],"La lunghezza di corridoio cieco si misura fino a:",["Un punto in cui diventa possibile l'esodo in più di una direzione, oppure un luogo sicuro.","La prima porta.","La scala più vicina."]);
D("y48","s4",[ES],"La lunghezza delle scale nei corridoi ciechi si misura con il metodo del filo teso; negli edifici civili, per un singolo piano, è pari a circa:",["12,50 m.","5 m.","25 m."]);
D("y49","s4",[ES],"La «lunghezza d'esodo» è la distanza da percorrere:",["Dal punto in cui si trova l'occupante fino a un luogo sicuro temporaneo o a un luogo sicuro.","Dall'uscita del locale all'uscita finale.","Dall'ingresso dell'edificio al punto più lontano."]);
D("y50","s4",[ES],"Nella misura delle lunghezze d'esodo con il metodo del filo teso:",["Non si tiene conto degli arredi mobili.","Si tiene conto di tutti gli arredi.","Si misura in linea d'aria."]);
D("y51","s4",[ES],"Non è richiesta la verifica della massima lunghezza d'esodo per:",["Vie d'esodo verticali con caratteristiche di filtro e vie d'esodo esterne.","Vie d'esodo senza protezione.","Corridoi ciechi."]);
D("y52","s4",[ES],"L'altezza minima delle vie d'esodo è:",["2 m.","2,10 m.","2,40 m."]);
D("y53","s4",[ES],"La larghezza di una via d'esodo si misura:",["Come minima, dal piano di calpestio fino a 2 m di altezza, deducendo gli elementi sporgenti.","A metà altezza.","Al livello del pavimento."]);
D("y54","s4",[ES],"Nelle attività con elevato affollamento (> 0,7 persone/m²), ciascuna via d'esodo orizzontale:",["Non deve presentare riduzioni di larghezza da monte a valle nella direzione dell'esodo.","Deve essere esterna.","Deve essere larga almeno 3 m."]);
D("y55","s4",[ES],"Nella verifica di ridondanza delle vie d'esodo:",["Si rende indisponibile una via d'esodo alla volta e si verifica che le restanti siano sufficienti.","Si rendono indisponibili tutte le vie d'esodo tranne una.","Si raddoppiano le larghezze."]);
D("y56","s4",[ES],"Le vie d'esodo a prova di fumo con caratteristiche di filtro, nella verifica di ridondanza:",["Sono considerate sempre disponibili.","Sono le prime da rendere indisponibili.","Devono essere raddoppiate."]);
D("y57","s4",[ES],"Nella verifica di ridondanza, le vie d'esodo non indipendenti tra loro:",["Devono essere rese contemporaneamente indisponibili.","Vanno considerate sempre disponibili.","Non vanno considerate."]);
D("y58","s4",[ES],"La larghezza minima di una via d'esodo orizzontale si calcola come:",["LO = LU · nO, con LU larghezza unitaria (tab. S.4-29) e nO numero di occupanti che la impiegano nelle condizioni più gravose.","LO = nO / LU.","LO = 1,20 m in ogni caso."]);
D("y59","s4",[ES],"La «larghezza unitaria» di una via d'esodo è:",["La larghezza in millimetri necessaria all'esodo di un singolo occupante, in funzione di Rvita.","La larghezza di una porta standard.","La larghezza di un modulo di uscita di 60 cm."]);
D("y60","s4",[ES],"Con esodo simultaneo, le vie d'esodo verticali devono consentire:",["L'evacuazione contemporanea di tutti gli occupanti da tutti i piani serviti.","L'evacuazione di un piano alla volta.","L'evacuazione dei soli due piani più affollati."]);
D("y61","s4",[ES],"Con esodo per fasi, il numero di occupanti nV per dimensionare la via d'esodo verticale considera:",["I due piani, anche non consecutivi, con maggiore affollamento.","Tutti i piani serviti.","Solo il piano di primo innesco."]);
D("y62","s4",[ES],"Se almeno due vie d'esodo convergenti verso la stessa uscita finale sono impiegate da più di 50 occupanti ciascuna, la distanza tra uscita finale e sbarco delle vie d'esodo deve essere:",["Non inferiore a 2 m.","Non inferiore a 5 m.","Non inferiore a 1 m."]);
D("y63","s4",[ES],"Per scale e marciapiedi mobili impiegati in moto in emergenza, la capacità di trasporto teorica:",["Si riduce del 50%.","Si raddoppia.","Si considera pari a quella teorica."]);
D("y64","s4",[ES],"La larghezza del gradino di scale e marciapiedi mobili d'esodo deve essere non inferiore a:",["800 mm.","600 mm.","1200 mm."]);
D("y65","s4",[ES],"In presenza di requisiti antincendio aggiuntivi, le lunghezze d'esodo e di corridoio cieco possono essere incrementate del fattore δm, che non può superare:",["36%.","50%.","15%."]);
D("y66","s4",[ES],"Nei piani con presenza non occasionale di occupanti non in grado di raggiungere autonomamente un luogo sicuro, si adotta almeno:",["Spazio calmo, esodo orizzontale progressivo o esodo orizzontale verso luogo sicuro.","Un ascensore ordinario.","Una scala alla marinara."]);
D("y67","s4",[ES],"Lo «spazio calmo» è:",["Un luogo sicuro temporaneo dove gli occupanti attendono e ricevono assistenza per completare l'esodo.","Un locale insonorizzato.","Il luogo di raccolta all'esterno."]);
D("y68","s4",[ES],"Lo spazio calmo deve essere contrassegnato con il segnale:",["UNI EN ISO 7010-E024.","UNI EN ISO 7010-E007.","UNI EN ISO 7010-F007."]);
D("y69","s4",[ES],"Lo spazio calmo deve essere dotato, tra l'altro, di:",["Un sistema di comunicazione bidirezionale per segnalare la presenza e chiedere assistenza.","Un impianto sprinkler dedicato.","Un estintore a CO2."]);
D("y70","s4",[ES],"Per l'esodo orizzontale progressivo, ciascun compartimento deve avere vie d'esodo adeguate ai propri occupanti maggiorati:",["Del 50% del massimo numero di occupanti che lo impiegano per l'esodo orizzontale progressivo.","Del 100%.","Del 10%."]);
D("y71","s4",[ES],"Per le attività con Rvita D1 e D2 sono richiesti, tra l'altro:",["Un ascensore antincendio dimensionato anche per occupanti non deambulanti e vie d'esodo adatte alla movimentazione di letti e barelle.","Solo scale alla marinara.","Esodo simultaneo di tutti gli occupanti."]);
D("y72","s4",[ES],"Non sono considerate attività all'aperto quelle svolte:",["Su terrazze con vie d'esodo all'interno di opere da costruzione.","In piazze delimitate.","In parchi recintati."]);
D("y73","s4",[ES],"Nelle attività all'aperto lo spazio calmo può essere:",["Uno spazio a cielo libero con caratteristiche di luogo sicuro, delimitato, contiguo a una via d'esodo e raggiungibile dai soccorritori.","Un qualsiasi gazebo.","Un veicolo parcheggiato."]);
D("m10","fse",[EF],"Nel metodo prestazionale per l'esodo, RSET si calcola come:",["tdet + ta + tpre + ttra.","ASET − tpre.","ttra / tdet."]);
D("m11","fse",[EF],"Nel modello idraulico dell'esodo, il tempo di movimento ttra si calcola come:",["ttra = P / Fc, con P numero di persone e Fc portata d'esodo.","ttra = Fc / P.","ttra = S · D."]);
D("m12","fse",[EF],"Nel modello idraulico, la portata specifica d'esodo Fs è:",["Fs = S · D, velocità per densità di affollamento.","Fs = P / We.","Fs = We · S."]);
D("m13","fse",[EF],"Nel modello idraulico, per densità D < 0,54 persone/m² la velocità d'esodo S:",["È costante, pari a k.","Si annulla.","Cresce con la densità."]);
D("m14","fse",[EF],"Nell'analisi semplificata dell'Annesso H della ISO/TR 16738, RSET è:",["Il massimo tra RSET1 (ultimi a muoversi) e RSET2 (primi a muoversi più tempo di coda).","La somma di RSET1 e RSET2.","Il minimo tra RSET1 e RSET2."]);
