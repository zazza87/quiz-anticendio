D("m15","fse",[EF],"Il sistema d'esodo progettato con metodo prestazionale non è verificato se:",["ASET < RSET.","ASET > RSET.","ASET = 2 · RSET."]);
D("m16","fse",[EF],"Rispetto ai modelli idraulici, i modelli di esodo agent-based:",["Considerano ciascuna persona come particella autonoma, con scelte di percorso in relazione all'ambiente e agli altri.","Considerano la folla come un fluido continuo.","Non richiedono simulazioni al calcolatore."]);
D("m17","fse",[EF],"Per il calcolo di ASET si possono usare modelli fluidodinamici a zone (es. CFAST) o di campo; il criterio più cautelativo è:",["Zero exposure (nessuna esposizione degli occupanti ai prodotti dell'incendio).","Esposizione massima ammessa per 30 minuti.","Esposizione alla sola temperatura."]);

// Blocco 10 – GSA capitolo S.5 (Pecorella, 12/10/2026).
const GS = "Lezione Pecorella 12/10/2026 – GSA (S.5)";
D("a10","s5",[GS],"Secondo il G.1.10, la GSA è una misura finalizzata alla gestione dell'attività in sicurezza, in esercizio e in emergenza, attraverso un'organizzazione che prevede:",["Ruoli, compiti, responsabilità e procedure.","Solo impianti di protezione attiva.","Solo la formazione del personale."]);
D("a11","s5",[GS],"La GSA si sviluppa:",["Per tutta la vita dell'attività, dalla concezione progettuale fino alla dismissione.","Solo durante la fase di emergenza.","Solo nella fase di progettazione."]);
D("a12","s5",[GS],"I livelli di prestazione della GSA sono:",["Tre: I base, II avanzato, III avanzato per attività complesse.","Quattro: da I a IV.","Due: base e avanzato."]);
D("a13","s5",[GS],"Nella progettazione della GSA, il responsabile dell'attività:",["Acquisisce dalla progettazione indicazioni, limitazioni e modalità d'esercizio ammesse per gestire la sicurezza e garantire il funzionamento dei sistemi.","Definisce le misure antincendio che minimizzano il rischio.","Riceve dal progettista il certificato di prevenzione incendi."]);
D("a14","s5",[GS],"Nella progettazione della GSA, il progettista:",["Definisce e documenta, sin dal principio, il modello di gestione della sicurezza antincendio.","Gestisce la squadra di emergenza.","Esegue le prove di evacuazione."]);
D("a15","s5",[GS],"Nelle soluzioni conformi per il livello I di GSA, la GSA in esercizio comprende, tra l'altro:",["Registro dei controlli, controllo e manutenzione degli impianti, preparazione all'emergenza, revisione periodica.","Centro di gestione delle emergenze e unità gestionale GSA.","Solo il piano di emergenza esterno."]);
D("a16","s5",[GS],"Il «piano per il mantenimento del livello di sicurezza antincendio» è richiesto:",["Dal livello di prestazione II di GSA.","Solo dal livello I.","In nessun livello."]);
D("a17","s5",[GS],"L'«unità gestionale GSA» è prevista nelle soluzioni conformi per il livello:",["III di GSA.","I di GSA.","II di GSA."]);
D("a18","s5",[GS],"Nel livello III di GSA, il coordinatore degli addetti del servizio antincendio, tra l'altro:",["Programma la turnazione degli addetti e segnala al coordinatore dell'unità gestionale le necessità di modifica delle procedure.","Progetta gli impianti antincendio.","Firma l'asseverazione per il rinnovo."]);
D("a19","s5",[GS],"Il coordinatore degli addetti del servizio antincendio:",["Coordina operativamente gli interventi degli addetti, la messa in sicurezza degli impianti e si interfaccia con le squadre di soccorso.","Redige la valutazione del rischio.","Esegue la manutenzione degli impianti."]);
D("a20","s5",[GS],"Secondo il S.5.4.2, è possibile applicare volontariamente all'attività:",["Un sistema di gestione della salute e sicurezza sul lavoro (SGSSL), ad esempio secondo linee guida UNI INAIL o UNI ISO 45001.","Una norma di reazione al fuoco.","Una deroga semplificata."]);
D("a21","s5",[GS],"Il registro dei controlli è previsto, per i datori di lavoro, anche:",["Dall'art. 71, comma 9, del D.Lgs. 81/08.","Dall'art. 16 del D.Lgs. 139/06.","Dal DPR 151/2011."]);
D("a22","s5",[GS],"Sul registro dei controlli si annotano anche:",["Le attività di informazione, formazione e addestramento e le prove di evacuazione.","I nominativi dei clienti.","Le fatture dei manutentori."]);
D("a23","s5",[GS],"Il piano per il mantenimento del livello di sicurezza antincendio deve prevedere, tra l'altro:",["Le procedure per manutenzioni e modifiche, con individuazione dei pericoli, misure, responsabilità e azioni successive.","Il calcolo del carico d'incendio.","La scelta delle classi di reazione al fuoco."]);
D("a24","s5",[GS],"Il manuale di uso e manutenzione degli impianti antincendio:",["È predisposto secondo la regolamentazione o la normativa tecnica ed è fornito al responsabile dell'attività.","È redatto dal Comando dei VVF.","Non è obbligatorio."]);
D("a25","s5",[GS],"In prossimità degli accessi di ciascun piano devono essere esposte:",["Planimetrie del sistema d'esodo e dell'ubicazione delle attrezzature antincendio, e istruzioni di comportamento in emergenza.","Le schede di sicurezza delle sostanze.","Il certificato di prevenzione incendi."]);
D("a26","s5",[GS],"La frequenza delle prove di attuazione del piano di emergenza deve tenere conto:",["Della complessità dell'attività e dell'eventuale sostituzione del personale.","Solo del numero di estintori.","Solo della stagione."]);
D("a27","s5",[GS],"Nel livello I di GSA, la preparazione all'emergenza può limitarsi:",["All'informazione al personale e agli occupanti sui comportamenti da tenere.","Alla sola esposizione delle planimetrie.","Alla nomina dell'unità gestionale."]);
D("a28","s5",[GS],"In attività con promiscuità strutturale, impiantistica o di vie d'esodo, la pianificazione d'emergenza:",["Deve tenere conto delle interferenze con le attività limitrofe e delle parti comuni.","Può ignorare le altre attività.","È affidata al Comune."]);
D("a29","s5",[GS],"Nelle piccole attività con profili di rischio A1, A2, A3, B1, B2, B3, C1, C2 il centro di gestione delle emergenze:",["Può essere in un locale ad uso non esclusivo (portineria, reception, centralino).","Deve essere un compartimento ad uso esclusivo.","Non è mai previsto."]);
D("a30","s5",[GS],"Nelle attività diverse da quelle piccole, il centro di gestione delle emergenze deve essere:",["Un locale ad uso esclusivo, costituente compartimento, con accesso dall'esterno anche tramite percorso protetto, segnalato.","Un ufficio qualsiasi.","Un locale interrato senza finestre."]);
D("a31","s5",[GS],"Il centro di gestione delle emergenze deve disporre almeno di:",["Informazioni per la gestione dell'emergenza, strumenti di comunicazione, centrali di controllo degli impianti o ripetizione degli allarmi.","Un impianto sprinkler dedicato.","Un'autopompa."]);
D("a32","s5",[GS],"Il coordinatore dell'unità gestionale GSA, in emergenza:",["Prende i provvedimenti, anche di interruzione delle attività, in caso di pericolo grave e immediato e coordina il centro di gestione delle emergenze.","Esegue lo spegnimento personalmente.","Attende l'arrivo dei VVF senza intervenire."]);
D("a33","s5",[GS],"I documenti della GSA devono essere revisionati:",["Periodicamente a cadenza stabilita e comunque in caso di modifiche dell'attività.","Solo ogni dieci anni.","Solo dopo un incendio."]);
D("a34","s5",[GS],"In un'attività non lavorativa, la gestione della sicurezza in emergenza comprende:",["Attivazione dei soccorsi pubblici, esodo degli occupanti, messa in sicurezza di apparecchiature e impianti.","La nomina degli addetti antincendio.","La formazione obbligatoria di 8 ore."]);
D("a35","s5",[GS],"Nelle soluzioni conformi per il livello I di GSA, il responsabile dell'attività predispone, attua e verifica il piano d'emergenza:",["Solo se si tratta di attività lavorativa.","In ogni caso.","Mai."]);

// Blocco 11 – Sicurezza antincendio e gestione emergenze nei luoghi di lavoro (Gucciardi, 12/10/2026).
const GU = "Lezione Gucciardi 12/10/2026 – Luoghi di lavoro (art. 46 D.Lgs. 81/08)";
D("l30","lav",[GU],"Ai sensi dell'art. 46, comma 4, D.Lgs. 81/08, fino all'adozione dei decreti attuativi si applicavano i criteri:",["Del DM 10 marzo 1998.","Del DM 3 agosto 2015.","Del DPR 151/2011."]);
D("l31","lav",[GU],"Ai sensi dell'art. 46, comma 5, D.Lgs. 81/08, presso ogni Direzione regionale dei VVF sono istituiti:",["Nuclei specialistici per l'attività di assistenza alle aziende.","Comitati tecnici regionali per gli incidenti rilevanti.","Uffici per il rilascio del CPI."]);
D("l32","lav",[GU],"Gli organismi interni all'azienda per la verifica dell'applicazione delle norme antinfortunistiche sono:",["Datore di lavoro, RSPP, RLS, medico competente.","ASL, INAIL, VVF.","Prefetto e Sindaco."]);
D("l33","lav",[GU],"Al personale VVF incaricato di visite tecniche, verifiche e controlli è consentito, tra l'altro:",["L'accesso alle attività anche durante l'esercizio, l'acquisizione di documenti e il prelievo di campioni.","Solo l'accesso previo appuntamento scritto di 30 giorni.","Solo l'esame dei documenti in ufficio."]);
D("l34","lav",[GU],"Il CNVVF esercita la vigilanza sull'applicazione della normativa di prevenzione incendi:",["Con i poteri di polizia amministrativa e giudiziaria.","Solo con poteri consultivi.","Solo su richiesta del Prefetto."]);
D("l35","lav",[GU],"Se rileva condizioni di rischio o inosservanze, il CNVVF:",["Adotta i provvedimenti d'urgenza per la messa in sicurezza e comunica l'esito a interessati, Sindaco, Prefetto e altre autorità.","Si limita a una nota informale.","Sospende direttamente la licenza commerciale."]);
D("l36","lav",[GU],"Chi, titolare di attività soggetta al CPI, omette di richiederne il rilascio o il rinnovo è punito, per attività con prodotti infiammabili, incendiabili o esplodenti:",["Con l'arresto sino a un anno o l'ammenda da 258 a 2.582 euro.","Con una sanzione amministrativa da 100 euro.","Con la reclusione da 3 a 10 anni."]);
D("l37","lav",[GU],"Chi nelle certificazioni e dichiarazioni per il rilascio o il rinnovo del CPI attesta fatti non rispondenti al vero è punito:",["Con la reclusione da tre mesi a tre anni e la multa da 103 a 516 euro.","Con la sola sospensione dall'albo.","Con l'ammenda da 50 euro."]);
D("l38","lav",[GU],"Per carenze dei requisiti di sicurezza sanzionate con arresto o ammenda, il Comando procede ai sensi:",["Del D.Lgs. 758/1994, con prescrizioni, termini di adeguamento e ammissione al pagamento che estingue il reato.","Della Legge 241/1990.","Del DPR 160/2010."]);
D("l39","lav",[GU],"Tra le misure generali di tutela (art. 15 D.Lgs. 81/08) c'è:",["La priorità delle misure di protezione collettiva rispetto a quelle individuali.","La priorità dei DPI rispetto alle misure collettive.","L'esclusione dei lavoratori dalla consultazione."]);
D("l40","lav",[GU],"Il servizio di prevenzione e protezione (SPP):",["Ha funzioni di supporto tecnico, non operative; il RSPP è scelto dal solo datore di lavoro.","Ha funzioni di vigilanza esterna.","È nominato dall'ASL."]);
D("l41","lav",[GU],"I lavoratori designati come addetti alla lotta antincendio, all'evacuazione e al primo soccorso:",["Non possono rifiutare la designazione se non per giustificato motivo.","Possono sempre rifiutare.","Sono scelti dai colleghi."]);
D("l42","lav",[GU],"Secondo il «Decreto GSA», il piano di emergenza è obbligatorio, tra l'altro, nei luoghi di lavoro:",["Con almeno 10 lavoratori, aperti al pubblico con più di 50 persone presenti contemporaneamente, o soggetti al DPR 151/2011.","Con almeno 50 lavoratori.","Solo se soggetti al DPR 151/2011."]);
D("l43","lav",[GU],"Nei luoghi di lavoro non obbligati al piano di emergenza, il datore di lavoro:",["Deve comunque adottare misure organizzative e gestionali da attuare in caso d'incendio.","Non ha alcun obbligo.","Deve rivolgersi al Comando VVF."]);
D("l44","lav",[GU],"Il piano di emergenza contiene, tra l'altro:",["Le azioni dei lavoratori in caso d'incendio, le procedure di evacuazione, le disposizioni per chiamare i VVF e le misure per le persone con esigenze speciali.","Il calcolo del carico d'incendio.","Il progetto degli impianti."]);
D("l45","lav",[GU],"Il numero complessivo di personale designato alla gestione delle emergenze deve essere congruo:",["In relazione alle turnazioni e alle assenze ordinariamente prevedibili.","Pari al 50% dei lavoratori.","Pari a uno per piano."]);
D("l46","lav",[GU],"Le planimetrie del piano di emergenza riportano almeno, tra l'altro:",["Vie d'esodo, compartimentazioni, attrezzature antincendio, allarmi e centrale, interruttore elettrico generale e valvole di intercettazione.","Solo la posizione degli estintori.","Solo le uscite di emergenza."]);
D("l47","lav",[GU],"Le planimetrie del piano di emergenza devono indicare, tra l'altro:",["I soli ascensori utilizzabili in caso d'incendio.","Tutti gli ascensori, tutti utilizzabili.","Nessun ascensore."]);
D("l48","lav",[GU],"Secondo il DM 2 settembre 2021 (Allegato I), le esercitazioni antincendio si svolgono con cadenza almeno:",["Annuale.","Semestrale.","Biennale."]);
D("l49","lav",[GU],"Il piano di emergenza va aggiornato:",["A ogni modifica che possa alterare le misure di prevenzione e protezione, informando i lavoratori e coinvolgendo gli addetti.","Ogni cinque anni.","Solo dopo un incendio."]);
D("l50","lav",[GU],"Secondo il DM 2/9/2021, per le persone con ridotte capacità sensoriali la diffusione dell'allarme può avvenire tramite:",["Dispositivi sensoriali (luci, scritte luminose, vibrazione) e messaggi da altoparlanti, ad esempio con sistema EVAC.","Solo sirene acustiche.","Solo comunicazione verbale."]);
D("l51","lav",[GU],"La Circolare n. 4 del 1° marzo 2002 riguarda:",["Linee guida per la valutazione della sicurezza antincendio nei luoghi di lavoro con persone disabili.","Il rinnovo del CPI.","Le distanze di sicurezza."]);
D("l52","lav",[GU],"L'«emergenza» è:",["Ogni situazione anomala che presenti un pericolo potenziale o in atto.","Solo l'incendio in atto.","Solo l'evacuazione totale."]);
D("l53","lav",[GU],"Il piano di emergenza integra:",["Il documento di valutazione dei rischi (DVR).","Il certificato di prevenzione incendi.","Il progetto antincendio."]);
D("l54","lav",[GU],"Il datore di lavoro predispone il piano di emergenza:",["Con la collaborazione del RSPP, mantenendolo aggiornato.","Delegandolo interamente al medico competente.","Su indicazione dell'INAIL."]);

// Blocco 12 – Controllo dell'incendio S.6: reti idranti UNI 10779 e sprinkler UNI EN 12845 (Montanari).
const MO = "Lezione Montanari – Impianti di protezione attiva (S.6)";
D("h10","s6",[MO],"La norma di riferimento per la progettazione, installazione ed esercizio delle reti di idranti è:",["UNI 10779.","UNI EN 12845.","UNI 9795."]);
D("h11","s6",[MO],"La norma europea di riferimento per i sistemi automatici a sprinkler è:",["UNI EN 12845.","UNI 10779.","UNI EN 671-2."]);
D("h12","s6",[MO],"La norma UNI 11292 riguarda:",["I locali destinati ad ospitare i gruppi di pompaggio antincendio.","Le valvole di intercettazione antincendio.","Le reti di idranti a secco."]);
D("h13","s6",[MO],"Le reti di idranti a secco sono trattate dalla:",["UNI/TS 11559.","UNI 11443.","UNI EN 14384."]);
D("h14","s6",[MO],"Le valvole di intercettazione antincendio devono essere conformi alla:",["UNI 11443, con indicazione chiaramente visibile dello stato di apertura/chiusura.","UNI EN 12259-2.","UNI 804."]);
D("h15","s6",[MO],"Secondo la UNI 11443, le valvole di intercettazione devono avere un attuatore per ridurre lo sforzo di apertura a partire da:",["DN 125 compreso.","DN 50.","DN 300."]);
D("h16","s6",[MO],"Secondo la UNI 10779, la rete di idranti è costituita da tubazioni fisse ad uso esclusivo:",["Preferibilmente chiuse ad anello.","Sempre a pettine aperto.","Collegate all'impianto idrico sanitario."]);
D("h17","s6",[MO],"Nelle reti all'aperto, ogni punto dell'area protetta deve distare dall'idrante a colonna (soprasuolo o sottosuolo) più vicino al massimo:",["45 m.","30 m.","60 m."]);
D("h18","s6",[MO],"Nelle aree protette con idranti a muro o naspi, ogni punto deve distare dall'apparecchio più vicino al massimo:",["30 m.","45 m.","20 m."]);
D("h19","s6",[MO],"Secondo la UNI 10779, l'installazione incassata delle tubazioni è consentita:",["Per stacchi che collegano al massimo 2 presidi.","Per qualsiasi tratto di rete.","Mai."]);
D("h20","s6",[MO],"Nella verifica analitica dei sostegni delle tubazioni, il singolo sostegno va verificato per un carico pari a:",["5 volte il peso della tubazione piena d'acqua, più un carico aggiuntivo.","2 volte il peso della tubazione vuota.","Il solo peso dell'acqua contenuta."]);
D("h21","s6",[MO],"La quota minima di interramento delle tubazioni della rete idranti (filo superiore del tubo) è:",["0,80 m, o sistemi equivalenti contro il gelo e i danni.","0,30 m.","1,50 m."]);
D("h22","s6",[MO],"Il sottopasso di edifici con tubazioni interrate della rete idranti:",["È vietato quando non è possibile garantire ispezionabilità o interventi senza demolizioni.","È sempre consentito.","È obbligatorio per le reti ad anello."]);
D("h23","s6",[MO],"Le tubazioni in polietilene nelle reti idranti secondo la UNI 10779:",["Non sono ammesse per i circuiti fuori terra a vista.","Sono preferite per i tratti fuori terra.","Sono vietate anche interrate."]);
D("h24","s6",[MO],"L'attacco di mandata per autopompa VVF è costituito da uno o più attacchi:",["≥ DN 70, ciascuno sezionabile se più di uno.","DN 25.","DN 45."]);
D("h25","s6",[MO],"Per le reti con soli idranti a muro o naspi, l'attacco per autopompa deve avere almeno:",["1 attacco DN 70.","3 attacchi DN 70.","Nessun attacco."]);
D("h26","s6",[MO],"Per reti di idranti con protezione esterna, l'attacco per autopompa deve avere almeno:",["2 attacchi DN 70 su tubazione ≥ DN 80.","1 attacco DN 45.","4 attacchi DN 25."]);
D("h27","s6",[MO],"L'attacco per autopompa VVF:",["Non è un'apparecchiatura soggetta a marcatura CE: è un insieme di componenti conformi alle rispettive norme, assemblati secondo UNI 10779.","È un prodotto con marcatura CE obbligatoria.","È fornito dal Comando VVF."]);
D("h28","s6",[MO],"Nell'attacco per autopompa, la valvola di ritegno deve essere orientata:",["Verso l'impianto, per consentire l'immissione dell'acqua.","Verso l'esterno.","Indifferentemente."]);
D("h29","s6",[MO],"Gli attacchi per autopompa «in linea»:",["Non sono più previsti dalla revisione 2007 della UNI 10779.","Sono gli unici ammessi.","Sono richiesti per le reti a secco."]);
D("h30","s6",[MO],"I naspi sono conformi alla norma:",["UNI EN 671-1.","UNI EN 671-2.","UNI EN 14384."]);
D("h31","s6",[MO],"Gli idranti a muro sono conformi alla norma:",["UNI EN 671-2.","UNI EN 671-1.","UNI EN 14339."]);
D("h32","s6",[MO],"Gli idranti a colonna soprasuolo sono conformi alla norma:",["UNI EN 14384.","UNI EN 14339.","UNI 11423."]);
D("h33","s6",[MO],"Gli idranti sottosuolo sono conformi alla norma:",["UNI EN 14339.","UNI EN 14384.","UNI EN 671-2."]);
D("h34","s6",[MO],"La portata Q erogata da un presidio antincendio con coefficiente di efflusso K alla pressione P è:",["Q = K · √P.","Q = K · P².","Q = P / K."]);
D("h35","s6",[MO],"Il coefficiente di efflusso K di un presidio antincendio:",["Deve essere dichiarato dal fabbricante; a parità di pressione, a K più elevato corrisponde maggiore portata.","È uguale per tutti gli idranti.","Si ricava solo dalla pressione statica."]);
D("h36","s6",[MO],"In prossimità dell'ultimo idrante o naspo di ogni diramazione aperta con 2 o più apparecchi deve essere installato:",["Un attacco per manometro di prova con valvola porta manometro.","Un estintore a polvere.","Un attacco per autopompa."]);
D("h37","s6",[MO],"Secondo la UNI 10779, per il livello di pericolosità 1 la protezione interna prevede:",["2 idranti da 120 l/min oppure 4 naspi da 35 l/min, a 0,2 MPa, per almeno 30 minuti.","4 idranti da 120 l/min per 120 minuti.","6 naspi da 60 l/min per 60 minuti."]);
D("h38","s6",[MO],"Secondo la UNI 10779, per il livello di pericolosità 2 la protezione esterna prevede:",["4 attacchi DN 70 da 300 l/min, a 0,3 MPa, per almeno 60 minuti.","2 attacchi DN 45 per 30 minuti.","6 attacchi DN 70 a 0,4 MPa per 120 minuti."]);
D("h39","s6",[MO],"Secondo la UNI 10779, per il livello di pericolosità 3 la protezione interna prevede:",["4 idranti da 120 l/min oppure 6 naspi da 60 l/min.","2 idranti da 120 l/min.","3 naspi da 35 l/min."]);
D("h40","s6",[MO],"Nelle attività di livello di pericolosità 3 protette anche da impianti automatici di spegnimento, la durata di scarica può essere ridotta a:",["90 minuti, con un massimo di 4 bocche DN 70 anziché 6.","30 minuti.","60 minuti con 2 bocche DN 70."]);
D("h41","s6",[MO],"In compartimenti di superficie superiore a 4000 m² senza protezione esterna, il numero di presidi interni contemporaneamente attivi:",["Deve essere raddoppiato.","Può essere dimezzato.","Resta invariato."]);
D("h42","s6",[MO],"Tra protezione interna ed esterna della rete idranti:",["Non esiste contemporaneità.","Si considera sempre il funzionamento contemporaneo.","La protezione esterna sostituisce sempre quella interna."]);
D("h43","s6",[MO],"Per i livelli di pericolosità 2 e 3 senza protezione esterna deve essere previsto almeno un idrante UNI 70 per il rabbocco dei mezzi VVF con portata di almeno:",["300 l/min per 60 minuti.","120 l/min per 30 minuti.","600 l/min per 120 minuti."]);
D("h44","s6",[MO],"Nel dimensionamento della rete idranti, la velocità dell'acqua nelle tubazioni non deve superare:",["10 m/s.","3 m/s.","20 m/s."]);
D("h45","s6",[MO],"Le perdite di carico distribuite nella rete idranti si calcolano con la formula di:",["Hazen-Williams, con perdite concentrate trasformate in lunghezze equivalenti.","Bernoulli semplificata.","Darcy senza coefficienti."]);
D("h46","s6",[MO],"Nella formula di Hazen-Williams, il coefficiente di scabrezza C = 140 si usa per:",["Acciaio inox, rame, ghisa rivestita.","Acciaio nero vecchio.","Tubazioni in cemento."]);
D("h47","s6",[MO],"Secondo la UNI 10779, la pressione nominale dei componenti della rete non deve essere inferiore a:",["1,2 MPa.","0,6 MPa.","2,5 MPa."]);
D("h48","s6",[MO],"Secondo la UNI 10779, le condizioni di funzionamento dell'impianto previste dal progetto restano sotto la responsabilità:",["Del responsabile del sistema, anche se esiste un servizio di manutenzione esterno.","Del manutentore.","Del progettista per tutta la vita dell'impianto."]);
D("h49","s6",[MO],"Un impianto sprinkler è progettato per:",["Rilevare l'incendio ed estinguerlo nello stadio iniziale, oppure controllarlo finché l'estinzione sia completata con altri mezzi.","Evacuare il fumo.","Segnalare l'incendio senza erogare acqua."]);
D("h50","s6",[MO],"Le classi di pericolo della UNI EN 12845 sono:",["LH, OH, HHP, HHS.","A, B, C, D.","Livelli 1, 2, 3."]);
D("h51","s6",[MO],"Nella UNI EN 12845, la sigla HHS indica:",["Le aree di deposito (storage) ad alto pericolo, suddivise in categorie da I a IV.","Le attività di produzione ad alto pericolo.","Le aree a pericolo lieve."]);
D("h52","s6",[MO],"Il colore rosso del bulbo di uno sprinkler indica una temperatura di intervento di:",["68 °C.","57 °C.","93 °C."]);
D("h53","s6",[MO],"Il colore arancio del bulbo di uno sprinkler indica una temperatura di intervento di:",["57 °C.","79 °C.","141 °C."]);
D("h54","s6",[MO],"Il fattore RTI di uno sprinkler indica:",["La velocità di risposta dell'elemento termosensibile.","La portata erogata.","La temperatura di intervento."]);
D("h55","s6",[MO],"Un impianto sprinkler a secco si installa:",["Quando la temperatura dell'area non può essere garantita oltre i 4 °C.","Nei locali con temperatura sempre superiore a 20 °C.","Solo negli uffici."]);
D("h56","s6",[MO],"In un impianto sprinkler a secco, l'acqua deve arrivare all'erogatore più remoto entro:",["1 minuto; altrimenti serve un acceleratore.","5 minuti.","10 secondi."]);
D("h57","s6",[MO],"Un impianto sprinkler «alternato»:",["È caricato con aria o gas inerte d'inverno e con acqua d'estate.","Alterna sprinkler aperti e chiusi.","Usa alternativamente acqua e schiuma."]);
D("h58","s6",[MO],"Un sistema a preallarme a singolo interblocco si usa tipicamente per:",["Evitare scariche accidentali dove sarebbero molto dannose (es. sale elaboratori).","Proteggere depositi all'aperto.","Sostituire un impianto a umido nei parcheggi."]);
D("h59","s6",[MO],"Il sistema a preallarme a doppio interblocco è tipico della protezione di:",["Freezer o vani corsa ascensore, dove una scarica accidentale sarebbe critica.","Uffici.","Parcheggi all'aperto."]);
D("h60","s6",[MO],"La massima pressione di esercizio di un impianto sprinkler (salvo edifici di grande altezza) è:",["12 bar.","6 bar.","20 bar."]);
D("h61","s6",[MO],"Secondo la UNI EN 12845, le alimentazioni idriche singole sono ammesse:",["Per impianti LH e OH, salvo diverse disposizioni.","Per tutti gli impianti HHS.","Mai."]);
D("h62","s6",[MO],"Secondo la UNI EN 12845, il serbatoio a pressione come alimentazione è ammesso:",["Solo per LH e OH1.","Per tutte le classi.","Solo per HHP."]);
D("h63","s6",[MO],"Secondo la UNI EN 12845, i pozzi come alimentazione idrica:",["Non sono previsti.","Sono la soluzione preferita.","Sono ammessi solo per HHS."]);
D("h64","s6",[MO],"Secondo la UNI EN 12845, le pompe da preferire sono:",["Pompe centrifughe ad asse orizzontale installate sottobattente.","Pompe sommerse.","Pompe ad asse verticale soprabattente."]);
D("h65","s6",[MO],"Secondo la UNI EN 12845, un'installazione si considera sottobattente anche con asse pompa sopra il livello minimo se, tra l'altro:",["Almeno 2/3 del volume effettivo della vasca è al di sopra dell'asse della pompa.","La vasca è interrata.","La pompa è sommersa."]);
D("h66","s6",[MO],"Per evitare la cavitazione della pompa deve risultare:",["NPSH disponibile > NPSH richiesto.","NPSH richiesto > NPSH disponibile.","NPSH disponibile = 0."]);
D("h67","s6",[MO],"Con alimentazione idrica comune a sprinkler e idranti (alimentazione combinata), la UNI EN 12845 richiede tra l'altro:",["Calcolo idraulico integrale con la massima contemporaneità e durata pari alla maggiore tra i due impianti.","La durata minore tra i due impianti.","Che gli idranti abbiano priorità sugli sprinkler."]);
D("h68","s6",[MO],"Per le vasche a capacità ridotta con rincalzo (UNI EN 12845) occorrono:",["Almeno due valvole di rincalzo, posizionate lontano dalla turbolenza dell'aspirazione, e la possibilità di testare la portata.","Una sola valvola manuale.","Nessun requisito particolare."]);
D("h69","s6",[MO],"Per i depositi all'aperto non protetti da sprinkler, la merce deve distare dall'edificio protetto almeno:",["10 m o 1,5 volte l'altezza del materiale depositato.","3 m.","1 m."]);
D("h70","s6",[MO],"La UNI EN 12845, per la pompa elettrica, NON richiede:",["Il gruppo elettrogeno di alimentazione, purché l'alimentazione elettrica sia garantita in ogni tempo.","La derivazione a monte dell'interruttore generale.","Il quadro di controllo della pompa."]);

// Blocco 13 – Circolare DCPREV prot. 15002 del 22/07/2026 (G.2.7, norme o documenti tecnici europei/internazionali).
const C15 = "Circolare DCPREV 15002 del 22/07/2026 – Applicazione G.2.7";
D("g80","codg",[C15],"Secondo il par. G.2.7 e la Tabella G.2-1 del Codice, l'applicazione di norme o documenti tecnici europei o internazionali deve essere attuata:",["Nella sua completezza, con soluzioni, configurazioni e componenti richiamati, evidenziandone l'idoneità in relazione ai profili di rischio.","Solo per le parti più convenienti.","Solo previa deroga del Comando."]);
D("g81","codg",[C15],"Quale dei seguenti è citato dal Codice come esempio di organizzazione che emette norme riconosciute a livello internazionale?",["NFPA.","CEI.","UNI."]);
D("g82","codg",[C15],"Secondo la circolare 15002/2026, tra norme europee ed extra UE il G.2.7:",["Dà pari possibilità di scelta, anche se quelle europee sono in genere più agevoli per la qualifica dei prodotti (marcatura CE, classificazioni armonizzate).","Ammette solo norme europee.","Ammette solo norme NFPA."]);
D("g83","codg",[C15],"Per le attività di categoria B e C, chi applica il G.2.7 con norme diverse dalle soluzioni conformi deve motivare la scelta:",["Per inadeguatezza dei metodi delle soluzioni conformi o per conseguire livelli di sicurezza più elevati.","Solo per ridurre i costi.","Senza alcuna motivazione."]);
D("g84","codg",[C15],"Secondo la circolare 15002/2026, il ricorso al G.2.7 con norme o documenti tecnici alternativi trova maggiore applicazione:",["Nella protezione attiva (strategie S.6, S.7, S.8), essendo la protezione passiva da decenni armonizzata a livello europeo.","Nella reazione al fuoco.","Nella resistenza al fuoco."]);
D("g85","codg",[C15],"Per i sistemi automatici a sprinkler, la soluzione conforme è la UNI EN 12845; un esempio di soluzione alternativa è:",["NFPA 13.","UNI 9795.","UNI 10779."]);
D("g86","codg",[C15],"La UNI EN 12845-2 (sistemi ESFR e CMSA), pubblicata nel 2025:",["Non è ancora annoverabile come soluzione conforme, perché successiva all'ultima revisione del Codice.","È già una soluzione conforme del Codice.","Sostituisce la UNI 10779."]);
D("g87","codg",[C15],"La serie UNI EN 15004-1 sui sistemi a estinguenti gassosi:",["Esclude dal suo campo di applicazione i sistemi a CO2.","Riguarda solo i sistemi a CO2.","Riguarda i sistemi a polvere."]);
D("g88","codg",[C15],"La soluzione conforme per i sistemi IRAI è la UNI 9795; un esempio di soluzione alternativa è:",["NFPA 72.","NFPA 13.","UNI EN 12845."]);
D("g89","codg",[C15],"La soluzione conforme per i sistemi ad acqua nebulizzata (water mist) è:",["UNI EN 14972-1.","UNI EN 12416-2.","UNI 9494-1."]);
D("g90","codg",[C15],"La soluzione conforme per i sistemi di evacuazione naturale di fumo e calore (SENFC) è:",["UNI 9494-1.","UNI 9494-2.","UNI EN 12845."]);
D("g91","codg",[C15],"La soluzione conforme per i sistemi di evacuazione forzata di fumo e calore (SEFFC) è:",["UNI 9494-2.","UNI 9494-1.","UNI 11292."]);
D("g92","codg",[C15],"Per la ventilazione forzata orizzontale di fumo e calore nei parcheggi, un esempio di soluzione alternativa è:",["UNI CEN/TS 12101-11 o NFPA 88A.","UNI 10779.","UNI EN 14972-1."]);
D("g93","codg",[C15],"La soluzione conforme per i sistemi di diffusione dei messaggi di emergenza ad altoparlante (EVAC) nel capitolo S.7 è:",["UNI 11988 (ex UNI ISO 7240-19) o UNI CEN/TS 54-32.","UNI 9795.","NFPA 13."]);
D("g94","codg",[C15],"Per la UNI EN 54-13 (compatibilità e connettività dei componenti IRAI):",["Non è possibile applicare soluzioni alternative: vale solo con le norme della serie EN 54.","Si può usare la NFPA 13 come alternativa.","È una norma facoltativa."]);
D("g95","codg",[C15],"La soluzione conforme per i sistemi di estinzione a polvere è:",["UNI EN 12416-2.","UNI EN 15004-1.","UNI EN 16750."]);
D("g96","codg",[C15],"La soluzione conforme per i sistemi a riduzione di ossigeno è:",["UNI EN 16750.","UNI EN 15276-2.","UNI 11512."]);
D("g97","codg",[C15],"La documentazione allegata all'istanza di valutazione del progetto che applica il G.2.7 deve indicare la finalità, scegliendo tra:",["Verifica delle soluzioni alternative (G.2.6.5.2) e verifica del livello di prestazione delle misure (G.2.6.4).","Deroga e NOF.","Rinnovo e voltura."]);

// Blocco 14 – DM 20 dicembre 2012 (Decreto impianti), parte seconda.
const DI = "Presentazione DM 20/12/2012 – Decreto impianti";
D("p50","proc",[DI],"Il DM 20 dicembre 2012 è entrato in vigore il:",["4 aprile 2013.","3 gennaio 2013.","7 ottobre 2011."]);
D("p51","proc",[DI],"Il DM 20/12/2012 si applica agli impianti di protezione attiva installati nelle attività soggette:",["Qualora previsti da specifiche regole tecniche o richiesti dai Comandi nell'ambito dei procedimenti di prevenzione incendi.","In ogni caso, anche se non previsti.","Solo negli edifici pubblici."]);
D("p52","proc",[DI],"Secondo il DM 20/12/2012, ove non diversamente definito, una «modifica sostanziale» di un impianto è:",["Il cambio della tipologia dell'impianto o l'estensione della sua dimensione tipica oltre il 50% dell'originale.","Qualsiasi sostituzione di componenti.","L'estensione oltre il 10% dell'originale."]);
D("p53","proc",[DI],"Per un impianto di rivelazione esistente con 20 rivelatori, un ampliamento a 31 rivelatori:",["È una modifica sostanziale, perché supera il 50% della dimensione tipica.","Non è una modifica sostanziale.","È sempre una nuova installazione da approvare in deroga."]);
D("p54","proc",[DI],"Per gli impianti sprinkler, la «dimensione tipica» considerata dal DM 20/12/2012 è:",["Il numero di erogatori.","La portata della pompa.","La superficie del compartimento."]);
D("p55","proc",[DI],"Per gli impianti di estinzione speciali (gas, schiuma, polvere), la «dimensione tipica» è:",["La quantità di agente estinguente.","Il numero di ugelli.","Il volume del locale."]);
D("p56","proc",[DI],"Per i sistemi di evacuazione naturale di fumo e calore, la «dimensione tipica» è:",["La superficie utile totale di evacuazione.","La portata volumetrica aspirata.","Il numero di evacuatori."]);
D("p57","proc",[DI],"Il DM 20/12/2012 NON si applica, tra l'altro, a:",["Attività soggette al D.Lgs. 105/2015 (incidenti rilevanti) e distributori stradali di GPL e metano.","Uffici e scuole.","Autorimesse."]);
D("p58","proc",[DI],"Secondo il DM 20/12/2012, al termine dell'installazione la ditta installatrice consegna al titolare:",["La documentazione di legge, quella prevista dalla regola dell'arte e il manuale di uso e manutenzione in italiano, anche per lavori su impianti esistenti.","Il solo certificato di collaudo.","Il certificato di prevenzione incendi."]);
D("p59","proc",[DI],"Per le attività non regolamentate, la necessità della rete idranti, il livello di pericolosità e le caratteristiche dell'alimentazione idrica:",["Sono stabiliti dal progettista nella valutazione del rischio d'incendio.","Sono fissati dal Comando.","Sono sempre di livello 3."]);
D("p60","proc",[DI],"Secondo il DM 20/12/2012, gli impianti sprinkler si progettano secondo:",["La UNI EN 12845 o altre norme di organismi internazionalmente riconosciuti nel settore antincendio.","Solo la UNI 10779.","Solo la NFPA 13."]);
D("p61","proc",[DI],"Per un impianto non ricadente nel DM 37/08 eseguito dopo il 4/4/2013, ai fini della SCIA si presenta:",["Il mod. PIN 2.4 DICH. IMP. a firma dell'impresa installatrice.","Il mod. PIN 2.5 CERT. IMP. a firma del professionista antincendio.","La dichiarazione di conformità ex art. 7 DM 37/08."]);
D("p62","proc",[DI],"Per un impianto non ricadente nel DM 37/08 eseguito prima del 4/4/2013 e privo di dichiarazione, si presenta:",["Il mod. PIN 2.5 CERT. IMP. a firma del professionista antincendio.","Il mod. PIN 2.4 DICH. IMP.","Nessuna documentazione."]);

// Blocco 15 – Impianti di spegnimento a gas secondo UNI EN 15004 (Milan).
const GA = "Presentazione Milan – Impianti di spegnimento a gas (UNI EN 15004)";
D("h80","s6",[GA],"L'agente estinguente IG-541 è una miscela di:",["Azoto 52%, argon 40%, anidride carbonica 8%.","Azoto 50% e argon 50%.","Solo argon."]);
D("h81","s6",[GA],"L'agente estinguente IG-01 è:",["Argon.","Azoto.","Una miscela azoto-argon al 50%."]);
D("h82","s6",[GA],"L'agente estinguente IG-100 è:",["Azoto.","Argon.","Anidride carbonica."]);
D("h83","s6",[GA],"L'agente estinguente IG-55 è:",["Una miscela di azoto 50% e argon 50%.","Azoto puro.","Argon puro."]);
D("h84","s6",[GA],"Gli agenti estinguenti a gas inerte (IG-01, IG-55, IG-100, IG-541) hanno:",["Potenziale di riduzione dell'ozono (ODP) e di riscaldamento globale (GWP) pari a zero.","ODP elevato.","GWP superiore a quello dell'Halon 1301."]);
D("h85","s6",[GA],"Il fluido FK-5-1-12, rispetto agli HFC, ha:",["GWP pari a 1 e vita in atmosfera di pochi giorni.","GWP di circa 3800.","ODP pari a 12."]);
D("h86","s6",[GA],"La norma UNI EN 15004 riguarda sistemi a saturazione totale che usano gas:",["Non elettricamente conduttivi, che non lasciano residui, con efficienza e sicurezza validate da ente terzo; esclusa la CO2.","Inclusi i sistemi a CO2.","Per la soppressione delle esplosioni."]);
D("h87","s6",[GA],"La «concentrazione di progetto» di un sistema a gas è:",["La concentrazione di spegnimento maggiorata di un fattore di sicurezza (+30%).","La concentrazione minima di spegnimento senza fattori di sicurezza.","La concentrazione raggiunta dopo lo scarico di tutto l'estinguente."]);
D("h88","s6",[GA],"Il «tempo di mantenimento» (hold time) è:",["Il periodo in cui la concentrazione raggiunta resta superiore a quella di spegnimento per il rischio considerato.","Il tempo di scarica degli ugelli.","Il tempo tra allarme e scarica."]);
D("h89","s6",[GA],"Il «volume netto» da proteggere è:",["Il volume racchiuso dagli elementi costruttivi, escluso il volume degli elementi costruttivi impermeabili al suo interno.","Il volume lordo del locale.","Il volume dei soli arredi."]);
D("h90","s6",[GA],"Il NOAEL indica:",["La massima concentrazione a cui non sono stati osservati effetti avversi tossicologici o fisiologici.","La minima concentrazione con effetti avversi osservati.","La concentrazione di spegnimento."]);
D("h91","s6",[GA],"Il LOAEL indica:",["La concentrazione minima alla quale è stato osservato un effetto tossicologico o fisiologico nocivo.","La massima concentrazione senza effetti.","La concentrazione di progetto."]);
D("h92","s6",[GA],"Gli agenti chimici fluorurati (chemical agent), esposti all'incendio:",["Si decompongono producendo fluoruro di idrogeno.","Non si decompongono in alcun caso.","Producono solo vapore d'acqua."]);
D("h93","s6",[GA],"Per i sistemi a gas, i calcoli idraulici si eseguono:",["Alla temperatura nominale di 20 °C, con software validato da ente terzo.","A temperatura ambiente qualsiasi, a mano.","A 0 °C."]);
D("h94","s6",[GA],"I collettori delle bombole di un impianto a gas devono essere collaudati idraulicamente a una pressione pari a:",["1,5 volte la pressione di esercizio.","2 volte la pressione di esercizio.","La pressione di esercizio."]);
D("h95","s6",[GA],"Secondo la presentazione, un impianto a CO2 rispetto ai gas chimici e inerti:",["Non è utilizzabile in aree occupate.","È il più indicato per aree normalmente occupate.","Non richiede ricollaudo delle bombole."]);
D("h96","s6",[GA],"Un'«area non occupabile» ai fini dei sistemi a gas è:",["Un ambiente in cui nessun essere umano può essere presente per ragioni dimensionali o impedimenti fisici fissi.","Un ambiente occupato solo di notte.","Un ufficio chiuso a chiave."]);
D("h97","s6",[GA],"Ogni cambiamento del volume, delle condizioni operative o del contenuto del locale protetto da un sistema a gas:",["Può modificare la concentrazione di progetto originale.","Non ha effetti sull'impianto.","Richiede solo l'aggiornamento della segnaletica."]);

// Blocco 16 – Controllo di fumi e calore S.8 (Varuzza, Marzola – 19/10/2026).
const VA = "Lezione Varuzza 19/10/2026 – Controllo fumo e calore forzato";
const MZ = "Lezioni Marzola 19/10/2026 – Smaltimento ed ENFC";
D("k80","s8",[MZ],"Lo smaltimento di fumo e calore d'emergenza (livello di prestazione II di S.8) serve a:",["Estrarre fumo sufficiente a consentire alle squadre di soccorso di operare.","Garantire uno strato libero da fumo per l'esodo degli occupanti.","Evitare qualsiasi danno ai beni."]);
D("k81","s8",[MZ],"Il sistema di evacuazione di fumo e calore (livello di prestazione III di S.8):",["Dà tempo agli occupanti di mettersi in salvo, ritarda il flashover, previene danni strutturali e protegge i beni.","Serve solo alle squadre di soccorso.","Sostituisce l'impianto sprinkler."]);
D("k82","s8",[MZ],"Un SENFC ha la funzione di:",["Mantenere uno strato libero da fumo a un'altezza definita, per il tempo previsto dal progetto.","Spegnere l'incendio.","Pressurizzare le vie d'esodo."]);
D("k83","s8",[MZ],"Nelle soluzioni conformi per il livello II di S.8, la superficie utile delle aperture di smaltimento è espressa come frazione della superficie lorda A del compartimento, ad esempio:",["A/40 oppure A/25, in funzione del carico d'incendio.","A/10 in ogni caso.","A/100 in ogni caso."]);
D("k84","s8",[MZ, VA],"Una soluzione alternativa «qualificata» per lo smaltimento di fumo e calore d'emergenza con aperture naturali è descritta:",["Nell'Appendice G della UNI 9494-1.","Nell'Appendice H della UNI 9494-2.","Nella UNI 10779."]);
D("k85","s8",[VA],"Una soluzione alternativa per lo smaltimento di fumo e calore d'emergenza con sistemi meccanici è descritta:",["Nell'Appendice H della UNI 9494-2.","Nell'Appendice G della UNI 9494-1.","Nella UNI EN 12845."]);
D("k86","s8",[MZ],"La UNI 9494-1 riguarda:",["Progettazione e installazione dei sistemi di evacuazione naturale di fumo e calore (SENFC).","I sistemi di evacuazione forzata.","Il controllo iniziale e la manutenzione."]);
D("k87","s8",[MZ],"La UNI 9494-3 riguarda:",["Il controllo iniziale e la manutenzione dei sistemi di evacuazione di fumo e calore.","La progettazione dei sistemi naturali.","I metodi ingegneristici."]);
D("k88","s8",[VA, MZ],"La UNI/TS 9494-4:2025 riguarda:",["I metodi ingegneristici (approccio prestazionale) per la progettazione dei sistemi di controllo di fumo e calore.","La manutenzione degli ENFC.","Le barriere al fumo."]);
D("k89","s8",[MZ],"La UNI 9494-1 si applica, in generale, ad ambienti con superficie:",["Maggiore di 600 m²; non si applica ad ambienti a rischio di esplosione.","Minore di 100 m².","Qualsiasi, anche a rischio di esplosione."]);
D("k90","s8",[MZ],"In ambienti con altezza inferiore a 3 m, un SENFC:",["Non può garantire lo strato libero da fumo.","Funziona meglio che in ambienti alti.","Non richiede aperture di afflusso aria."]);
D("k91","s8",[MZ],"Ogni ENFC deve essere munito di un dispositivo di azionamento individuale termosensibile tarato, salvo diverse indicazioni, a:",["68 °C.","57 °C.","93 °C."]);
D("k92","s8",[MZ],"Gli ENFC devono essere conformi alla norma:",["UNI EN 12101-2.","UNI EN 12101-1.","UNI EN 12845."]);
D("k93","s8",[MZ],"Le barriere al fumo per suddividere i compartimenti a soffitto devono essere conformi alla:",["UNI EN 12101-1.","UNI EN 12101-2.","UNI EN 54-1."]);
D("k94","s8",[MZ],"Gli ENFC danno il miglior risultato quando sono posti:",["In copertura.","In facciata, vicino al pavimento.","Nei cavedi impiantistici."]);
D("k95","s8",[MZ],"Le aperture per l'afflusso di aria fresca di un SENFC devono avere lo spigolo superiore:",["Almeno 1 m sotto il limite inferiore dello strato di fumo (0,5 m con aperture larghe al massimo 1,25 m).","Sopra lo strato di fumo.","A contatto con il soffitto."]);
D("k96","s8",[MZ],"L'apertura delle prese d'aria di afflusso di un SENFC deve essere:",["Automatica e contemporanea all'attivazione del SENFC.","Manuale, dopo 15 minuti.","Sempre chiusa."]);
D("k97","s8",[MZ],"Il progetto di un SENFC secondo UNI 9494-1 può essere redatto:",["Da un tecnico abilitato, non necessariamente iscritto negli elenchi del Ministero dell'interno.","Solo da un professionista antincendio.","Solo dal produttore degli ENFC."]);
D("k98","s8",[MZ],"Per un SENFC l'installatore rilascia:",["La dichiarazione di corretta installazione e funzionamento (PIN 2.4 DICH. IMP.) con il manuale d'uso e manutenzione secondo UNI 9494-3.","Il certificato di prevenzione incendi.","Solo la fattura."]);
D("k99","s8",[MZ],"Per gli ENFC, il produttore fornisce secondo il Regolamento CPR:",["La dichiarazione di prestazione (DoP).","L'omologazione ministeriale.","Il certificato REI."]);
D("ka0","s8",[VA],"Per i sistemi di ventilazione orizzontale forzata del fumo (SVOF), in assenza di norme nazionali, il Codice indica come riferimento:",["La (pr)CEN/TS 12101-11.","La UNI 9494-1.","La UNI EN 12845."]);
D("ka1","s8",[VA],"Se si applica integralmente la UNI CEN/TS 12101-11 per un sistema di ventilazione orizzontale in autorimessa:",["Le condizioni di tenibilità si considerano soddisfatte e si è in soluzione conforme.","Occorre sempre un'analisi CFD.","Si è sempre in deroga."]);
D("ka2","s8",[VA],"Secondo la lezione, la UNI CEN/TS 12101-11 è applicabile, in modalità conforme, a locali:",["Più bassi di 3 m.","Più alti di 10 m.","Di qualsiasi altezza."]);
D("ka3","s8",[VA],"Gli scopi dei sistemi di controllo del fumo nelle autorimesse secondo la CEN/TS 12101-11 includono:",["Fornire un accesso sufficientemente libero dal fumo ai VVF e assisterli nello smaltimento del fumo.","Garantire l'esodo degli occupanti senza alcun fumo.","Raffreddare le auto incendiate."]);
D("ka4","s8",[VA],"Nei sistemi a jet fan secondo l'Appendice B della CEN/TS 12101-11, le aperture di afflusso e di espulsione:",["Dovrebbero essere su pareti opposte.","Devono essere sulla stessa parete.","Non sono necessarie."]);
D("ka5","s8",[VA],"Un sistema a pressione differenziale per un vano scala (UNI EN 12101-13) deve garantire con le porte chiuse una sovrappressione di circa:",["30 Pa.","5 Pa.","300 Pa."]);
D("ka6","s8",[VA],"Con le porte aperte per l'esodo, un sistema a pressione differenziale deve garantire un controflusso d'aria di circa:",["1–2 m/s.","0,1 m/s.","10 m/s."]);
D("ka7","s8",[VA],"Nella verifica prestazionale dell'esempio di albergo, ASET è definito secondo la ISO 13571 come:",["Il più piccolo degli ASET calcolati con i diversi modelli di incapacitazione.","La media degli ASET calcolati.","Il più grande degli ASET calcolati."]);
D("ka8","s8",[VA],"Il quadro di comando e controllo (QCC) di un sistema di controllo del fumo deve essere:",["Alimentato da impianto elettrico di emergenza separato e protetto, in luogo protetto e facilmente accessibile ai soccorritori.","Alimentato dalla rete ordinaria senza protezioni.","Installato all'interno del compartimento da proteggere."]);

// Blocco 17 – Capitoli S.9 Operatività antincendio e S.10 Impianti tecnologici (Pecorella, 21/10/2026).
const OP = "Lezione Pecorella 21/10/2026 – S.9 e S.10";
D("o10","s9",[OP],"Lo scopo dell'operatività antincendio (S.9) è:",["Agevolare gli interventi di soccorso dei Vigili del fuoco, garantendo condizioni per operare in modo efficace, tempestivo e sicuro.","Gestire l'esodo degli occupanti.","Ridurre il carico d'incendio."]);
D("o11","s9",[OP],"La pronta disponibilità di agenti estinguenti per le squadre dei VVF è richiesta:",["Dal livello di prestazione III in poi.","Solo per il livello II.","Mai."]);
D("o12","s9",[OP],"Nella soluzione conforme per il livello II di S.9, i mezzi di soccorso devono poter avvicinarsi agli accessi per soccorritori dell'attività a distanza:",["≤ 50 m.","≤ 100 m.","≤ 500 m."]);
D("o13","s9",[OP],"Se l'attività è progettata per i livelli I o II di resistenza al fuoco, la distanza di avvicinamento dei mezzi di soccorso deve comunque essere:",["Inferiore alla massima altezza dell'opera da costruzione, con apposito cartello segnaletico.","Superiore a 50 m.","Pari a 10 m."]);
D("o14","s9",[OP],"Nella soluzione conforme per il livello III di S.9, in assenza di protezione esterna della rete idranti deve essere disponibile un idrante raggiungibile con un percorso massimo di:",["500 m dai confini dell'attività, con erogazione di almeno 300 l/min per almeno 60 minuti.","50 m, con 120 l/min.","1000 m, con 600 l/min."]);
D("o15","s9",[OP],"Nel livello III di S.9, in assenza di protezione interna della rete idranti, nelle attività a più piani fuori terra o interrati deve essere prevista:",["La colonna a secco.","Una scala alla marinara.","Un ascensore antincendio."]);
D("o16","s9",[OP],"Nel livello III di S.9, gli organi di intercettazione, controllo e arresto degli impianti tecnologici rilevanti ai fini dell'incendio devono essere:",["In posizione segnalata e facilmente raggiungibile durante l'incendio, con posizione e logiche considerate nella GSA.","Chiusi a chiave e non segnalati.","Solo nel locale tecnico interrato."]);
D("o17","s9",[OP],"Nel livello IV di S.9 deve essere assicurata almeno una tra:",["Accostabilità dell'autoscala a tutti i piani, percorsi di accesso ai piani almeno protetti, ascensore secondo tabella S.9-3.","Solo un estintore per piano.","Solo l'illuminazione di sicurezza."]);
D("o18","s9",[OP],"Nelle attività con massima quota dei piani superiore a 54 m, per l'accesso dei soccorritori dall'alto:",["Almeno una scala d'esodo deve condurre anche al piano di copertura, se praticabile.","Serve una piazzola per elicotteri.","Non è richiesto nulla."]);
D("o19","s9",[OP],"Il DM 3 agosto 2015 è entrato in vigore il:",["18 novembre 2015.","3 agosto 2015.","20 ottobre 2019."]);
D("t10","s10",[OP],"Tra gli obiettivi di sicurezza degli impianti tecnologici e di servizio (S.10) c'è:",["Essere disattivabili o altrimenti gestibili a seguito di incendio.","Funzionare sempre anche durante l'incendio.","Essere installati solo all'esterno."]);
D("t11","s10",[OP],"Nel capitolo S.10 le soluzioni alternative sono ammesse:",["Solo per le prescrizioni aggiuntive del paragrafo S.10.6.","Per tutte le prescrizioni.","Mai."]);
D("t12","s10",[OP],"Gli apparecchi di manovra dei quadri elettrici devono riportare chiare indicazioni dei circuiti e, ove opportuno, la dicitura:",["«Non manovrare in caso d'incendio».","«Uscita di emergenza».","«Vietato fumare»."]);
D("t13","s10",[OP],"I quadri elettrici installati in ambienti aperti al pubblico devono essere protetti almeno:",["Con una porta frontale con chiusura a chiave.","Con un vetro trasparente.","Con una tenda ignifuga."]);
D("t14","s10",[OP],"I quadri elettrici possono essere installati lungo le vie d'esodo:",["A condizione che non costituiscano ostacolo al deflusso degli occupanti.","Mai.","Solo se in classe REI 120."]);
D("t15","s10",[OP],"Per la ricarica dei veicoli elettrici, un utile riferimento indicato nel S.10 è:",["La circolare DCPST n. 2 del 5 novembre 2018 (linee guida).","Il DM 37/2008.","La UNI 10779."]);
D("t16","s10",[OP],"Per gli impianti fotovoltaici su coperture e facciate, tra i riferimenti indicati nel S.10 c'è:",["La guida DCPST n. 1324 del 7 febbraio 2012 (e successive).","La circolare n. 4 del 2002.","Il DM 26/6/1984."]);
D("t17","s10",[OP],"Il capitolo S.10 prevede, per tutte le attività:",["Una valutazione del rischio dovuto ai fulmini.","L'installazione obbligatoria del parafulmine.","Il collaudo annuale degli impianti elettrici da parte dei VVF."]);
D("t18","s10",[OP],"Gli impianti di sollevamento non specificamente progettati per funzionare in caso d'incendio devono:",["Avere accorgimenti gestionali, organizzativi e tecnici che ne impediscano l'uso in emergenza.","Essere usati per l'evacuazione delle persone con disabilità.","Restare sempre in funzione."]);
D("t19","s10",[OP],"Le condutture principali dei gas combustibili a valle del punto di consegna, quando raggiungono un'opera da costruzione, devono essere installate:",["A vista ed all'esterno dell'opera servita; all'interno solo con valutazione del rischio ATEX (V.2).","Sempre sottotraccia.","Nei vani scala."]);
D("t20","s10",[OP],"Nei brevi attraversamenti di locali, le tubazioni del gas devono essere poste in guaina:",["Di classe A1, aerata alle due estremità verso l'esterno e con diametro superiore di almeno 20 mm.","In PVC sigillata.","Di qualsiasi materiale."]);
D("t21","s10",[OP],"Per evitare la dispersione di combustibili liquidi, il bacino di contenimento deve avere volume:",["Pari alla capacità complessiva dei serbatoi.","Pari al 10% della capacità.","Pari alla metà della capacità."]);
D("t22","s10",[OP],"Gli impianti di gas medicali di un compartimento devono essere derivati:",["Direttamente dalla rete di distribuzione primaria, non da un altro compartimento.","Dal compartimento adiacente.","Da bombole mobili."]);
D("t23","s10",[OP],"Gli impianti di condizionamento e ventilazione, tra l'altro, devono:",["Evitare il ricircolo dei prodotti della combustione e non propagare fumi o fiamme.","Ricircolare l'aria per diluire i fumi.","Restare attivi durante l'incendio in ogni caso."]);
D("t24","s10",[OP],"Dove gli occupanti possono essere esposti ai gas refrigeranti dovrebbero essere impiegati gas classificati secondo ISO 817:",["A1 (non infiammabili) o A2L (debolmente infiammabili) a bassa tossicità.","B3 (alta tossicità e infiammabilità).","Qualsiasi classe."]);
D("t25","s10",[OP],"I cavi elettrici dei circuiti ai fini della sicurezza antincendio dovrebbero essere realizzati con materiali che:",["Riducono al minimo l'emissione di fumo e la produzione di gas acidi e corrosivi.","Hanno elevata emissione di fumo.","Sono privi di isolamento."]);

// Blocco 18 – Rivelazione ed allarme S.7, esempio RTV V.5 (Comelit, 23/10/2026).
const IR = "Lezione Comelit 23/10/2026 – S.7 e RTV V.5";
D("i10","s7",[IR],"Nella UNI EN 54-1, la funzione A di un IRAI è:",["La rivelazione automatica dell'incendio.","La centrale di controllo e segnalazione.","L'alimentazione di sicurezza."]);
D("i11","s7",[IR],"Nella UNI EN 54-1, la funzione B di un IRAI è:",["La centrale di controllo e segnalazione.","La rivelazione manuale.","Il dispositivo di allarme incendio."]);
D("i12","s7",[IR],"Nella UNI EN 54-1, la funzione C di un IRAI è:",["Il dispositivo di allarme incendio (sirene, pannelli ottico-acustici…).","La trasmissione dell'allarme.","La stazione di ricevimento dei guasti."]);
D("i13","s7",[IR],"Nella UNI EN 54-1, la funzione D di un IRAI è:",["La segnalazione manuale (pulsante con elemento frangibile).","La rivelazione automatica.","Il comando del sistema automatico antincendio."]);
D("i14","s7",[IR],"Nella UNI EN 54-1, la funzione L di un IRAI è:",["L'apparecchiatura di alimentazione.","La linea di rivelazione ad anello.","Il comando delle serrande."]);
D("i15","s7",[IR],"Nella UNI EN 54-1, la funzione G di un IRAI è:",["Il comando del sistema automatico antincendio.","La segnalazione manuale.","La stazione di ricevimento allarme."]);
D("i16","s7",[IR],"Nella UNI EN 54-1, le funzioni M e P riguardano:",["La centrale di allarme vocale (EVAC) e gli altoparlanti.","La trasmissione dei guasti.","L'alimentazione di riserva."]);
D("i17","s7",[IR],"Le funzioni A, B, C, D e L di un IRAI devono sempre essere presenti, tranne:",["La funzione A, che può mancare nei sistemi fissi di sola segnalazione manuale.","La funzione B, se l'impianto è piccolo.","La funzione L, se c'è rete pubblica."]);
D("i18","s7",[IR],"L'alimentazione di un IRAI secondo UNI EN 54-4 deve essere:",["Doppia: principale da rete pubblica con linea riservata e di riserva da batterie o da rete di sicurezza indipendente.","Singola da rete pubblica.","Solo a batterie."]);
D("i19","s7",[IR],"Il livello di prestazione I di S.7 prevede che:",["La rivelazione e l'allarme siano demandati agli occupanti.","La rivelazione sia automatica in tutta l'attività.","Sia presente un sistema EVAC."]);
D("i20","s7",[IR],"Tra i criteri per il livello I di S.7 c'è una densità di affollamento:",["≤ 0,2 persone/m².","≤ 0,7 persone/m².","≤ 1,2 persone/m²."]);
D("i21","s7",[IR],"Tra i criteri per il livello I di S.7, la superficie lorda di ciascun compartimento deve essere:",["≤ 4000 m².","≤ 1000 m².","≤ 16000 m²."]);
D("i22","s7",[IR],"Il livello II di S.7 prevede:",["Segnalazione manuale e sistema d'allarme su tutta l'attività.","Rivelazione automatica su tutta l'attività.","Nessuna funzione."]);
D("i23","s7",[IR],"Tra i criteri per il livello II di S.7, i piani dell'attività devono essere a quota compresa tra:",["−10 m e 54 m.","−5 m e 12 m.","−1 m e 24 m."]);
D("i24","s7",[IR],"Il livello III di S.7 si attribuisce:",["Alle attività non ricomprese negli altri criteri di attribuzione.","Solo agli ospedali.","Solo alle attività all'aperto."]);
D("i25","s7",[IR],"Il livello IV di S.7 prevede:",["Rivelazione automatica, segnalazione manuale e sistema d'allarme su tutta l'attività, con avvio automatico dei sistemi di protezione attiva.","Solo segnalazione manuale.","Rivelazione automatica solo in alcune aree."]);
D("i26","s7",[IR],"Nel livello IV di S.7, per elevati affollamenti o geometrie complesse è previsto:",["Un sistema EVAC secondo UNI 11988 o UNI CEN/TS 54-32.","Un sistema sprinkler.","Un sistema a pressione differenziale."]);
D("i27","s7",[IR],"Le condizioni per attribuire il livello I di S.7 sono di tipo «AND», cioè:",["Devono essere verificate tutte contemporaneamente.","Basta che ne sia verificata una.","Sono facoltative."]);
D("i28","s7",[IR],"Secondo la UNI 9795, devono essere sorvegliati, tra l'altro:",["Vani tecnici per ascensori, cunicoli e cavedi per cavi, condotti di condizionamento, spazi nascosti sopra controsoffitti e sotto pavimenti sopraelevati.","Solo i locali con presenza di persone.","Solo le vie d'esodo."]);
D("i29","s7",[IR],"Secondo la UNI 9795, possono non essere sorvegliati direttamente, se privi di combustibili e cavi non indispensabili:",["Piccoli locali per servizi igienici.","I locali tecnici.","I depositi."]);
D("i30","s7",[IR],"Secondo la UNI 9795, una zona di rivelazione non deve comprendere:",["Più di un piano, esclusi vani scala e ascensori.","Più di un locale.","Più di 5 rivelatori."]);
D("i31","s7",[IR],"Secondo la UNI 9795, una zona può comprendere al massimo 10 locali attigui con superficie complessiva fino a:",["600 m², con accessi sul medesimo disimpegno.","1000 m².","2000 m²."]);
D("i32","s7",[IR],"Secondo la UNI 9795, una zona può comprendere fino a 20 locali attigui con superficie massima di 1000 m² se:",["Ci sono ripetitori ottici fuori dai singoli accessi.","Sono tutti uffici.","Hanno rivelatori di calore."]);
D("i33","s7",[IR],"Secondo la UNI 9795, se una linea di rivelazione serve più zone o più di 32 punti, deve essere:",["Ad anello chiuso con isolatori, in modo che un cortocircuito o un'interruzione non impediscano l'allarme per più di una zona.","Radiale aperta.","Senza isolatori."]);
D("i34","s7",[IR],"I rivelatori installati in spazi nascosti (non visibili) devono:",["Appartenere a zone distinte e avere un ripetitore ottico visibile.","Essere collegati alla stessa zona del locale.","Essere solo di calore."]);
D("i35","s7",[IR],"Secondo la UNI 9795, il raggio di copertura dei rivelatori puntiformi di fumo in ambienti con altezza fino a 12 m è:",["6,5 m.","4,5 m.","10 m."]);
D("i36","s7",[IR],"Secondo la UNI 9795, il raggio di copertura dei rivelatori puntiformi di calore (h ≤ 7,5 m) è:",["4,5 m.","6,5 m.","3 m."]);
D("i37","s7",[IR],"I rivelatori puntiformi di calore di classe A1 (intervento 58 °C) si usano in locali alti al massimo:",["7,5 m.","12 m.","4 m."]);
D("i38","s7",[IR],"La distanza tra i rivelatori puntiformi e le pareti del locale deve essere, in genere:",["Maggiore di 0,5 m.","Inferiore a 0,1 m.","Maggiore di 3 m."]);
D("i39","s7",[IR],"Nei controsoffitti e pavimenti sopraelevati non ventilati alti meno di 1,5 m, il raggio di copertura massimo dei rivelatori di fumo diventa:",["4,5 m.","6,5 m.","1,5 m."]);
D("i40","s7",[IR],"Controsoffitti e pavimenti sopraelevati alti fino a 1,5 m possono non essere sorvegliati se, tra l'altro:",["Sono rivestiti o costituiti con materiali di classe A2/A2fl e non contengono cavi di sistemi di emergenza (salvo resistenti almeno PH30).","Contengono cavi di potenza.","Sono in legno."]);
D("i41","s7",[IR],"I rivelatori di fumo ad aspirazione (ASD) sono disciplinati dalla norma:",["UNI EN 54-20.","UNI EN 54-7.","UNI EN 54-5."]);
D("i42","s7",[IR],"Nei rivelatori di fumo ad aspirazione, la classe A indica:",["Sistemi ad alta sensibilità (es. CED, camere bianche, magazzini molto alti).","Sistemi a sensibilità normale, equivalenti ai puntiformi.","Sistemi per ambienti esterni."]);
D("i43","s7",[IR],"Nei rivelatori di fumo ad aspirazione, la classe C indica:",["Sistemi a sensibilità normale, equivalenti ai rivelatori puntiformi di fumo.","Sistemi ad alta sensibilità.","Sistemi a sensibilità aumentata."]);
D("i44","s7",[IR],"Per i sistemi ASD in locali con altezza superiore a 20 m:",["Occorrono più livelli intermedi di rivelazione e una prova specifica.","Basta un solo livello di tubazioni.","Non sono ammessi."]);
D("i45","s7",[IR],"Nell'esempio della lezione, un albergo con 126 posti letto e altezza di circa 33 m, secondo la RTV V.5, richiede IRAI di livello:",["IV, con sistema EVAC.","II.","III senza EVAC."]);
D("i46","s7",[IR],"Secondo la UNI 9795, lo scopo dei sistemi di rivelazione è:",["Favorire un tempestivo esodo, attivare i piani di intervento e i sistemi di protezione contro l'incendio.","Spegnere l'incendio.","Sostituire la squadra antincendio."]);

// Blocco 19 – Impianti elettrici, V.1 aree a rischio specifico, V.2 atmosfere esplosive (Carbonaro, Mod. 4.14-4.15).
const CB = "Lezione Carbonaro – Mod. 4.14-4.15 Impianti elettrici, V.1 e V.2";
D("t30","s10",[CB],"Secondo il Codice (G.1.14), la presunzione di regola dell'arte è riconosciuta, di prassi:",["Alle norme adottate da enti di normazione nazionali, europei o internazionali.","Solo alle circolari ministeriali.","Solo ai manuali dei produttori."]);
D("t31","s10",[CB],"Secondo il Codice, per illuminazione di sicurezza, IRAI e sistemi usati per l'esodo l'alimentazione di sicurezza deve avere interruzione breve e autonomia:",["Interruzione ≤ 0,5 s e autonomia > 30 minuti.","Interruzione ≤ 15 s e autonomia > 120 minuti.","Interruzione ≤ 60 s e autonomia > 10 minuti."]);
D("t32","s10",[CB],"Secondo il Codice, per i sistemi di controllo o estinzione dell'incendio e gli ascensori di soccorso l'alimentazione di sicurezza deve avere:",["Interruzione media ≤ 15 s e autonomia > 120 minuti.","Interruzione ≤ 0,5 s e autonomia > 30 minuti.","Nessun requisito."]);
D("t33","s10",[CB],"Secondo la UNI EN 1838, un apparecchio di illuminazione di sicurezza va posto vicino a ogni porta di uscita a una distanza:",["Inferiore a 2 m.","Inferiore a 10 m.","Inferiore a 5 m."]);
D("t34","s10",[CB],"Secondo la UNI EN 1838, vicino a ogni dispositivo antincendio e punto di pronto soccorso l'illuminamento verticale minimo è:",["5 lx.","1 lx.","50 lx."]);
D("t35","s10",[CB],"Nella CEI 64-8, la classificazione BD4 indica luoghi con:",["Alta densità di affollamento e difficoltà di esodo (es. edifici di grande altezza aperti al pubblico).","Bassa densità di affollamento e facile esodo.","Materiali combustibili in deposito."]);
D("t36","s10",[CB],"Nella CEI 64-8, la classificazione CA2 indica:",["Fabbricati costruiti prevalentemente in materiali combustibili.","Luoghi con alta densità di affollamento.","Luoghi con rischio di esplosione."]);
D("t37","s10",[CB],"La classificazione di reazione al fuoco dei cavi elettrici secondo il Regolamento CPR è riportata, per i luoghi di impiego, nella:",["CEI-UNEL 35016.","UNI 9795.","UNI EN 1838."]);
D("t38","s10",[CB],"Secondo la CEI-UNEL 35016, nei luoghi ad alto rischio come stazioni, metropolitane e gallerie si richiedono cavi in classe:",["B2ca-s1a, d1, a1 (prestazioni elevate).","Eca.","Fca."]);
D("t39","s10",[CB],"Secondo la CEI-UNEL 35016, la classe Eca si usa:",["Dove non esiste rischio d'incendio e pericolo per persone o cose.","Negli ospedali.","Nelle gallerie."]);
D("t40","s10",[CB],"Il DM 37/2008 si applica agli impianti al servizio degli edifici e, se connessi a reti di distribuzione:",["A partire dal punto di consegna della fornitura.","Dalla centrale di produzione.","Solo all'interno delle singole unità."]);
D("t41","s10",[CB],"Il DM 37/2008, all'art. 1, lettera g), comprende:",["Gli impianti di protezione antincendio.","Gli impianti di sollevamento.","Gli impianti radiotelevisivi."]);
D("v10","atex",[CB],"Un'«area a rischio specifico» (V.1) è:",["Un ambito dell'attività con rischio d'incendio sostanzialmente differente da quello tipico dell'attività.","Qualsiasi locale con più di 10 persone.","Ogni compartimento interrato."]);
D("v11","atex",[CB],"Tra i criteri del V.1 per individuare le aree a rischio specifico c'è:",["Aree con carico d'incendio qf > 1200 MJ/m², non occupate o con presenza occasionale e breve di personale.","Aree con qf < 600 MJ/m².","Aree con affollamento superiore a 0,7 persone/m²."]);
D("v12","atex",[CB],"L'elenco dei criteri del capitolo V.1 per individuare le aree a rischio specifico è:",["Non esaustivo.","Tassativo.","Valido solo per le attività di categoria C."]);
D("v13","atex",[CB],"Per valutare le aree a rischio specifico vanno considerate almeno, tra l'altro:",["Le schede di sicurezza delle sostanze e le specifiche e i manuali dei fabbricanti di impianti e attrezzature.","Le fatture di acquisto.","Le planimetrie catastali."]);
D("v14","atex",[CB],"Per le aree a rischio specifico è più sicuro:",["Isolarle con classe di resistenza al fuoco maggiore o con distanza di separazione e ubicarle fuori terra o poco interrate.","Ubicarle ai piani più interrati.","Collegarle direttamente alle vie d'esodo."]);
D("v15","atex",[CB],"Un'«atmosfera esplosiva» è:",["Una miscela con l'aria, a condizioni atmosferiche, di sostanze infiammabili (gas, vapori, nebbie, polveri) in cui dopo l'accensione la combustione si propaga a tutta la miscela incombusta.","Una miscela di gas inerti.","Qualsiasi ambiente con temperatura superiore a 40 °C."]);
D("v16","atex",[CB],"Nel rischio per atmosfere esplosive (V.2), l'ordine di priorità decrescente degli obiettivi è:",["Prevenire la formazione di atmosfere esplosive, evitare le sorgenti di accensione, attenuare i danni dell'esplosione.","Attenuare i danni, evitare l'accensione, prevenire la formazione.","Evitare l'accensione, attenuare i danni, prevenire la formazione."]);
D("v17","atex",[CB],"La zona 0 (gas) è un luogo in cui l'atmosfera esplosiva:",["È presente in permanenza, per lunghi periodi o frequentemente.","È probabile occasionalmente durante il funzionamento normale.","È improbabile e persiste per breve periodo."]);
D("v18","atex",[CB],"La zona 1 (gas) è un luogo in cui l'atmosfera esplosiva:",["È probabile che si presenti occasionalmente durante il funzionamento normale.","È sempre presente.","Non si presenta mai."]);
D("v19","atex",[CB],"La zona 2 (gas) è un luogo in cui l'atmosfera esplosiva:",["È improbabile durante il normale funzionamento e, se si presenta, persiste per breve periodo.","È presente frequentemente.","È presente per lunghi periodi."]);
D("v20","atex",[CB],"Le zone 20, 21 e 22 riguardano atmosfere esplosive dovute a:",["Polveri combustibili.","Gas e vapori.","Nebbie di olio."]);
D("v21","atex",[CB],"Le zone NE (negligible extent) sono luoghi in cui:",["Il volume dell'atmosfera esplosiva è di estensione trascurabile; generalmente non sono pericolose.","L'atmosfera esplosiva è sempre presente.","Si trovano solo polveri."]);
D("v22","atex",[CB],"Le sorgenti di accensione nelle norme ATEX sono elencate nella:",["UNI EN 1127-1.","UNI EN 12845.","UNI 9795."]);
D("v23","atex",[CB],"Il livello di protezione contro le esplosioni è considerato adeguato quando, perché l'atmosfera esplosiva sia innescata:",["Devono fallire tre mezzi di protezione indipendenti.","Basta il fallimento di un mezzo di protezione.","Devono fallire due mezzi di protezione."]);
D("v24","atex",[CB],"Tra le misure preventive contro le esplosioni c'è:",["L'inertizzazione per ridurre la concentrazione di ossigeno sotto il limite LOC.","Lo sfogo dell'esplosione.","Gli apparecchi resistenti alle esplosioni."]);
D("v25","atex",[CB],"Tra le misure protettive contro le esplosioni c'è:",["Lo sfogo dell'esplosione di gas o polveri e gli apparecchi di isolamento o soppressione.","La riduzione del numero di sorgenti di emissione.","La formazione dei lavoratori."]);
D("v26","atex",[CB],"Gli apparecchi del gruppo I della direttiva ATEX di prodotto sono destinati:",["Ai lavori in sotterraneo nelle miniere e relativi impianti di superficie (grisù, polveri).","A tutti gli altri siti con atmosfere esplosive.","Solo agli ambienti con polveri."]);
D("v27","atex",[CB],"Gli apparecchi ATEX di categoria 1 garantiscono:",["Un livello di protezione molto elevato: non devono innescare neanche in caso di guasto eccezionale.","Protezione solo a funzionamento normale.","Protezione con anomalie ricorrenti."]);
D("v28","atex",[CB],"Gli apparecchi ATEX di categoria 3 garantiscono il livello di protezione richiesto:",["A funzionamento normale.","Anche in caso di guasto eccezionale.","Anche con due guasti indipendenti."]);
D("v29","atex",[CB],"Nella marcatura ATEX, le lettere G e D indicano rispettivamente:",["Gas, vapori e nebbie; polveri (dust).","Gruppo e divisione.","Grado e durata."]);
D("v30","atex",[CB],"Se un'esplosione può essere seguita da un incendio:",["L'incendio va valutato considerando i danni causati dall'esplosione.","L'incendio si valuta separatamente come se l'esplosione non ci fosse.","Non va valutato."]);
D("v31","atex",[CB],"Secondo l'appendice nazionale EN 1991-1-7, la classe di conseguenza CC3 riguarda:",["Opere con funzioni pubbliche o strategiche importanti e industrie molto pericolose per l'ambiente.","Edifici agricoli con presenza occasionale di persone.","Edifici residenziali ordinari."]);

// Blocco 20 – Regole tecniche verticali (Piombini): RTV, art. 2 e 2-bis DM 3/8/2015, V.4 Uffici, DM 22/2/2006.
const PI = "Lezione Piombini – Regole tecniche verticali";
ARGOMENTI.rtv = { sigla: "RTV", nome: "Regole tecniche verticali e regole tradizionali" };
D("w10","rtv",[PI],"Secondo il Codice (G.1), una «regola tecnica verticale» (RTV) è:",["Una regola tecnica applicabile a una specifica attività o ad ambiti di essa, con indicazioni complementari o sostitutive di quelle della RTO.","Una regola applicabile a tutte le attività.","Una norma volontaria UNI."]);
D("w11","rtv",[PI],"Ai fini del Codice, è considerata regola tecnica orizzontale l'insieme dei capitoli delle sezioni:",["Generalità, Strategia antincendio e Metodi.","Strategia e Regole tecniche verticali.","Solo Strategia antincendio."]);

D("n20","ist",[L139],"Al personale incaricato dei controlli (art. 19 D.Lgs. 139/2006) è consentito, tra l'altro:",["L'accesso alle attività anche durante l'esercizio e il prelievo di campioni per esami e prove.","Solo l'esame dei documenti presso il Comando.","L'accesso solo previo preavviso di 30 giorni."]);

D("n27","ist",[L139],"Le tariffe dei servizi di prevenzione incendi (art. 23 D.Lgs. 139/2006) sono aggiornate:",["Annualmente sulla base degli indici ISTAT al 31 dicembre dell'anno precedente.","Ogni cinque anni con legge.","Ogni dieci anni con DPR."]);
D("n28","ist",[L139],"Gli interventi di soccorso pubblico del Corpo nazionale (art. 25 D.Lgs. 139/2006):",["Non comportano oneri per chi ne beneficia, salvo se non sussiste imminente pericolo di danno a persone o cose.","Sono sempre a pagamento.","Sono a carico del Comune."]);
