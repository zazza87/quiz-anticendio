        </div>` : ""}

        <section class="hero" aria-label="Simulazione d'esame">
          <div class="top">
            <div class="ring" style="background:conic-gradient(var(--ink-ring) 0 ${media ?? 0}%, var(--ink-track) ${media ?? 0}% 100%)" aria-hidden="true"><span>${media === null ? "–" : media + "%"}</span></div>
            <div class="txt">
              ${sims.length
                ? `<small>Media ${sims.length === 1 ? "dell'ultima simulazione" : `delle ultime ${sims.length} simulazioni`}</small><b>${mediaOk} su ${ESAME_N} in media</b><small>Ultima: ${dateIt(ultima.t)} · ${ultima.ok}/${ultima.tot} in ${Math.round(ultima.secs / 60)} min</small>`
                : `<small>Nessuna simulazione ancora</small><b>Misurati con una prova d'esame</b><small>${ESAME_N} domande casuali da ${tot}</small>`}
            </div>
          </div>
          <button class="hero-cta" data-act="exam"><span>Inizia la simulazione</span><small>${Math.min(ESAME_N, tot)} dom. · ${ESAME_MIN}′</small></button>
        </section>

        <div class="tiles">
          <button class="tile" data-act="wrong" ${wrong.length ? "" : "disabled"}>
            <b style="color:var(--ko)">${wrong.length}</b><span>Errori da ripassare</span><small>${wrong.length ? "sbagliate l'ultima volta" : "nessun errore aperto"}</small>
          </button>
          <button class="tile" data-act="mix">
            <b>${PRATICA_ARG_N}</b><span>Esercitazione mista</span><small>domande casuali, correzione subito</small>
          </button>
        </div>

        <div class="row" style="align-items:baseline">
          <h2>Argomenti</h2><span class="spacer"></span>
          <span class="small muted">dal più debole · tocca per aprire</span>
        </div>
        <div class="tlist">
          ${shown.map(({ k, st, p }) => {
            const c = p === null ? "na" : pctCls(p);
            return `<button class="trow" data-tv="${k}">
              <span class="nm">${esc(topicName(k))}</span>
              <span class="pc ${c}">${p === null ? `${COUNT[k] || 0} dom. · mai fatto` : `${p}% · ${st.n} risp.`}</span>
              <span class="track">${p === null ? "" : `<i class="${c}" style="width:${p}%"></i>`}</span>
            </button>`;
          }).join("")}
        </div>
        ${rows.length > 8 ? `<div class="row"><button class="linkbtn small" data-act="alltopics">${ui.allTopics ? "Mostra meno" : `Mostra tutti gli argomenti (${rows.length})`}</button></div>` : ""}

        <p class="footer">${tot} domande tratte dai test e dal materiale del corso${VERSIONE ? " · versione del " + VERSIONE : ""}. I risultati sono legati al tuo nome e salvati online.</p>
      </div>
      ${tabs("home")}`);

    // ridisegna la pagina mantenendo la posizione di scorrimento
    const keep = () => { const y = window.scrollY; renderHome(); window.scrollTo(0, y); };
    onClick = b => {
      switch (b.dataset.act) {
        case "exam": return startExam();
        case "logout": return logout();
        case "resume":
          if (sess.mode === "esame" && Date.now() > sess.end) return finish();   // tempo scaduto mentre era in pausa
          return go("quiz");
        case "discard": ui.discardAsk = true; return keep();
        case "discardno": ui.discardAsk = false; return keep();
        case "discardyes": ui.discardAsk = false; db.sess = null; save(); return keep();
        case "alltopics": ui.allTopics = !ui.allTopics; return keep();
        case "mix": return startPractice(shuffle(DOMANDE.map(d => d.id)).slice(0, PRATICA_ARG_N), "Esercitazione mista");
        case "wrong": return startPractice(wrongIds(), "Ripasso errori");
      }
    };
  }

  // =====================================================================
  // Vista: Quiz (simulazione o esercitazione)
  // =====================================================================
  const ICONS = {
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    prev: '<path d="M15 6l-6 6 6 6"/>',
    next: '<path d="M9 6l6 6-6 6"/>',
    grid: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
    flag: '<path d="M6 3v18l6-4 6 4V3z"/>',
    ok: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    doc: '<path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5V7.5h5"/><path d="M9 13h7M9 16.5h7"/>',
  };
  const icon = (name, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

  function renderQuiz() {
    const s = db.sess, it = s.items[s.cur], d = byId[it.id];
    const exam = s.mode === "esame";
    const N = s.items.length;
    const answered = s.items.filter(i => i.ans !== null).length;
    const blank = N - answered;
    const flagged = s.items.filter(x => x.flag).length;
    const revealed = !exam && it.ans !== null;
    const last = s.cur === N - 1;
    const endLabel = exam ? "Consegna" : "Termina";   // ultima domanda

    // striscia di avanzamento: una tacca per domanda fino a 60, altrimenti barra continua
    const strip = N <= 60
      ? `<div class="strip" style="grid-template-columns:repeat(${N},minmax(0,1fr))" aria-hidden="true">${s.items.map((x, i) =>
          `<i class="${i === s.cur ? "c" : x.flag ? "f" : x.ans === null ? "" : exam ? "d" : isRight(x) ? "ok" : "ko"}"></i>`).join("")}</div>`
      : `<div class="progress" aria-hidden="true"><div style="width:${answered / N * 100}%"></div></div>`;

    // pannello in basso: conferma consegna, correzione (esercitazione) o barra comandi
    let bottom;
    if (ui.confirm) {
      // «end» = ultima domanda; «exit» = tasto X: consegna, esci e riprendi dopo, oppure continua
      const exit = ui.confirm === "exit";
      const canEnd = exam || answered > 0;
      bottom = `<div class="sheet" role="alertdialog" aria-label="${exit ? "Uscire?" : "Conferma consegna"}"><div>
        <span class="grip"></span>
        <div class="vhead">${exit ? (exam ? "Uscire dalla simulazione?" : "Uscire dall'esercitazione?") : exam ? "Consegnare la simulazione?" : "Terminare l'esercitazione?"}</div>
        <p class="small">${exam || !exit ? (blank ? `Hai ${blank} ${blank === 1 ? "domanda" : "domande"} senza risposta${exam ? ", che contano come errate" : ""}.` : "Hai risposto a tutte le domande.") + (flagged ? ` ${flagged} segnate per dopo.` : "") : `Hai risposto a ${answered} ${answered === 1 ? "domanda" : "domande"} su ${N}.`}${exit ? ` Se esci, ${exam ? "il tempo continua a scorrere e " : ""}la ritrovi nella pagina iniziale.` : ""}</p>
        <div class="stack" style="gap:8px">
          ${canEnd ? `<button class="btn primary" data-act="endyes">${exam ? "Consegna ora" : "Termina e vedi la correzione"}</button>` : ""}
          ${exit || !canEnd ? `<button class="btn" data-act="home">Esci e riprendi dopo</button>` : ""}
          <button class="btn ghost" data-act="endno">Continua</button>
        </div>
      </div></div>`;
    } else if (revealed) {
      const right = isRight(it);
      const okLetter = LET[it.order.indexOf(d.c)];
      const p = PAG[d.id];
      bottom = `<section class="sheet" aria-label="Correzione"><div>
        <span class="grip"></span>
        <div class="vhead"><span class="vicon ${right ? "ok" : "ko"}">${icon(right ? "ok" : "close", 2.4)}</span>${right ? "Risposta corretta" : `Risposta sbagliata: la corretta è la ${okLetter}`}</div>
        <p class="small muted">Fonte: ${esc(d.f.join(", "))}</p>
        ${d.dubbia ? `<div class="note"><strong>Risposta da verificare.</strong> ${esc(d.n || "")}</div>` : ""}
        ${p ? `<a class="matcard" href="${pdfUrl(p[0], p[1])}" target="_blank" rel="noopener"><span class="doc">${icon("doc", 1.8)}</span><span class="t"><strong>Ripassa sulla scheda</strong><small>${esc(FID2SRC[p[0]] || "")}${p[1] ? " · pagina " + p[1] : ""}</small></span><span class="muted" aria-hidden="true">›</span></a>` : ""}
        <div class="row" style="flex-wrap:nowrap">
          <button class="iconbtn" style="width:52px;height:52px;border-radius:12px" data-act="prev" aria-label="Domanda precedente" ${s.cur === 0 ? "disabled" : ""}>${icon("prev")}</button>
          <button class="btn primary" style="flex:1" data-act="${last ? "end" : "next"}">${last ? endLabel : "Continua"}</button>
        </div>
      </div></section>`;
    } else {
      bottom = `<div class="actbar"><div>
        <button class="iconbtn" data-act="prev" aria-label="Domanda precedente" ${s.cur === 0 ? "disabled" : ""}>${icon("prev")}</button>
        ${exam ? `<button class="btn ghost flag" data-act="flag" aria-pressed="${it.flag}">${icon("flag")}<span>${it.flag ? "Segnata" : "Segna"}</span></button>` : ""}
        ${last
          ? `<button class="btn primary grow" data-act="end">${endLabel}</button>`
          : `<button class="btn primary grow" data-act="next">${exam || it.ans !== null ? "Successiva" : "Salta"}${icon("next")}</button>`}
      </div></div>`;
    }

    paint(`
      <div class="qhead">
        <div class="row">
          <button class="iconbtn" data-act="exit" aria-label="Esci o consegna">${icon("close")}</button>
          <div class="who">
            <span class="eyebrow">${esc(s.label)}</span>
            <strong>Domanda ${s.cur + 1} di ${N}</strong>
          </div>
          ${exam ? `<button class="iconbtn" data-act="grid" aria-label="Elenco delle domande" aria-pressed="${ui.showGrid}">${icon("grid")}</button>` : ""}
          ${exam ? `<span class="timer" id="timer" aria-live="off">${fmt((s.end - Date.now()) / 1000)}</span>` : ""}
        </div>
        ${strip}
      </div>
      <div class="stack">
        ${exam && ui.showGrid ? `<div class="panel">
          <div class="qgrid">${s.items.map((x, i) => {
            const cls = x.ans === null ? "" : exam ? "done" : isRight(x) ? "ok" : "ko";
            return `<button class="${cls} ${x.flag ? "flagged" : ""} ${i === s.cur ? "cur" : ""}" data-go="${i}" aria-label="Domanda ${i + 1}">${i + 1}</button>`;
          }).join("")}</div>
          <div class="legend"><span><i style="background:var(--fg)"></i>Risposta data</span><span><i style="background:var(--warn)"></i>Segnata per dopo</span></div>
          <p class="small muted" style="margin:0">${answered} risposte date su ${N}. Tocca un numero per andare a quella domanda.</p>
        </div>` : ""}

        <article class="qcard">
          <span class="qtag">${esc(topicName(d.s))}</span>
          <p class="qtext">${esc(d.q)}</p>
          <div class="opts" role="radiogroup" aria-label="Risposte">
            ${it.order.map((oi, k) => {
              let cls = "";
              if (revealed) cls = oi === d.c ? "right" : k === it.ans ? "wrong" : "";
              else if (k === it.ans) cls = "sel";
              return `<button class="opt ${cls}" role="radio" aria-checked="${k === it.ans}" data-opt="${k}" ${revealed ? "disabled" : ""}><span class="let">${LET[k]}</span><span>${esc(d.o[oi])}</span></button>`;
            }).join("")}
          </div>
        </article>
      </div>
      ${bottom}`);

    const move = i => { s.cur = Math.max(0, Math.min(N - 1, i)); ui.confirm = false; save(); render(); };
    onClick = b => {
      if (b.dataset.opt !== undefined) {
        const k = +b.dataset.opt;
        if (revealed) return;
        it.ans = exam && it.ans === k ? null : k;   // in simulazione un secondo tocco toglie la risposta
        save(); return renderQuiz();
      }
      if (b.dataset.go !== undefined) return move(+b.dataset.go);
      switch (b.dataset.act) {
        case "prev": return move(s.cur - 1);
        case "next": return move(s.cur + 1);
        case "flag": it.flag = !it.flag; save(); return renderQuiz();
        case "grid": ui.showGrid = !ui.showGrid; return renderQuiz();
        case "end": ui.confirm = "end"; return renderQuiz();
        case "exit": ui.confirm = "exit"; return renderQuiz();
        case "endno": ui.confirm = false; return renderQuiz();
        case "endyes": ui.confirm = false; return finish();
        case "home": ui.confirm = false; return go("home");
      }
    };

    if (exam) {
      const t = document.getElementById("timer");
      const tick = () => {
        const left = (s.end - Date.now()) / 1000;
        if (left <= 0) { clearInterval(timerH); finish(); return false; }
        t.textContent = fmt(left); t.classList.toggle("low", left <= 300);
        return true;
      };
      clearInterval(timerH);
      if (tick()) timerH = setInterval(tick, 1000);
    }
  }

  // =====================================================================
  // Vista: Correzione (test appena concluso o dallo storico)
  // =====================================================================
  function renderResult(s, fromHist) {
    const items = s.mode === "pratica" ? s.items.filter(i => i.ans !== null) : s.items;
    const ok = items.filter(isRight).length, na = items.filter(i => i.ans === null).length, ko = items.length - ok - na;
    const byT = {};
    items.forEach(i => { const k = byId[i.id].s, t = byT[k] || (byT[k] = { n: 0, ok: 0 }); t.n++; if (isRight(i)) t.ok++; });
    const list = ui.filter === "all" ? items : items.filter(i => !isRight(i));

    paint(`
      <header class="mast">
        <span class="eyebrow">${esc(s.label)} · ${dateIt(s.start)}</span>
        <div class="score"><b>${ok}/${items.length}</b><span class="muted">${pct(ok, items.length)}% di risposte corrette · tempo ${fmt((s.stop - s.start) / 1000)}</span></div>
      </header>
      ${tabs(fromHist ? "risultati" : "")}
      <div class="stack">
        ${fromHist ? `<div class="row"><button class="btn ghost" data-nav="risultati">← Torna ai risultati</button></div>` : ""}
        <section class="panel">
          <div class="facts">
            <div class="fact"><b class="mono" style="color:var(--ok)">${ok}</b><span>corrette</span></div>
            <div class="fact"><b class="mono" style="color:var(--ko)">${ko}</b><span>sbagliate</span></div>
            <div class="fact"><b class="mono">${na}</b><span>senza risposta</span></div>
          </div>
          <h3>Risposte corrette per argomento</h3>
          ${barsHtml(byT, v => `${v.ok}/${v.n}`)}
          <div class="row">
            ${ko + na ? `<button class="btn primary" data-act="redo">${rifai(ko + na)}</button>` : ""}
            ${fromHist ? "" : `<button class="btn" data-act="home">Torna all'inizio</button>`}
          </div>
        </section>

        <div class="row">
          <h2>Correzione</h2><span class="spacer"></span>
          <div class="seg" role="group" aria-label="Filtro">
            <button data-f="ko" aria-pressed="${ui.filter !== "all"}">Errori (${ko + na})</button>
            <button data-f="all" aria-pressed="${ui.filter === "all"}">Tutte (${items.length})</button>
          </div>
        </div>
        <div class="review">
          ${list.length ? list.map(i => {
            const d = byId[i.id], st = i.ans === null ? "na" : isRight(i) ? "ok" : "ko";
            const head = `<div class="row small"><span class="mono muted">${s.items.indexOf(i) + 1}.</span><span class="eyebrow">${esc(topicName(d.s))}</span><span class="spacer"></span><span class="verdict ${st === "ok" ? "ok" : "ko"} small">${st === "ok" ? "Corretta" : st === "ko" ? "Sbagliata" : "Senza risposta"}</span></div>`;
            return `<div class="ritem ${st}">${head}${answerBlock(d, { your: st === "ko" ? d.o[i.order[i.ans]] : null, topicLink: true })}</div>`;
          }).join("") : `<p class="muted">Nessun errore. Ottimo lavoro.</p>`}
        </div>
      </div>`);

    onClick = b => {
      if (b.dataset.f) { ui.filter = b.dataset.f; return render(); }
      switch (b.dataset.act) {
        case "redo": return startPractice(items.filter(i => !isRight(i)).map(i => i.id), "Ripasso errori");
        case "home": db.sess = null; save(); return go("home");
      }
    };
  }

  // =====================================================================
  // Vista: Risultati (storico e statistiche per argomento)
  // =====================================================================
  function renderRisultati() {
    const rows = db.hist.map((h, i) => ({ h, i }));
    const sims = db.hist.filter(h => h.mode === "esame");
    const media = sims.length ? Math.round(sims.reduce((a, h) => a + h.ok / h.tot, 0) / sims.length * 100) : null;
    const best = sims.length ? sims.reduce((a, h) => h.ok / h.tot > a.ok / a.tot ? h : a) : null;
    const ts = topicStats();
    const hasStats = Object.keys(ts).length > 0;

    const histRow = ({ h, i }) => {
      const p = pct(h.ok, h.tot), exam = h.mode === "esame";
      const inner = `<span class="stripe ${pctCls(p)}"></span>
        <span class="stack" style="gap:4px;min-width:0">
          <span class="row small" style="gap:8px"><span class="tag ${exam ? "exam" : ""}">${exam ? "Simulazione" : "Esercitazione"}</span><span class="muted">${dateIt(h.t)}</span></span>
          <span class="small">${exam ? "" : esc(h.label) + " · "}tempo ${fmt(h.secs)}${h.items ? "" : " · correzione non disponibile"}</span>
        </span>
        <span class="sc">${h.ok}/${h.tot}<small>${p}%</small></span>`;
      return h.items ? `<button class="hrow" data-h="${i}" aria-label="Apri la correzione del test del ${dateIt(h.t)}">${inner}</button>` : `<div class="hrow">${inner}</div>`;
    };

    paint(`
      <header class="mast">
        <span class="eyebrow">Storico di ${esc(utente.nome)}</span>
        <h1>Risultati</h1>
      </header>
      ${tabs("risultati")}
      <div class="stack">
        <section class="panel">
          <div class="facts">
            <div class="fact"><b class="mono">${db.hist.length}</b><span>test conclusi</span></div>
            <div class="fact"><b class="mono">${sims.length}</b><span>simulazioni d'esame</span></div>
            <div class="fact"><b class="mono">${media === null ? "–" : media + "%"}</b><span>media simulazioni</span></div>
            <div class="fact"><b class="mono">${best ? best.ok + "/" + best.tot : "–"}</b><span>miglior simulazione</span></div>
          </div>
        </section>

        <h2>Test fatti</h2>
        ${rows.length
          ? `<div class="hlist">${rows.map(histRow).join("")}</div><p class="small muted">Tocca un test per rivedere domande, risposte date e correzione.</p>`
          : `<p class="muted">Non hai ancora concluso nessun test. Le simulazioni e le esercitazioni compariranno qui.</p>`}

        ${hasStats ? `<section class="panel">
          <h3>Risposte corrette per argomento</h3>
          <p class="small muted">Tutte le risposte date, in simulazioni ed esercitazioni. Argomenti ordinati dal più debole; a destra la percentuale e il numero di risposte. Tocca un argomento per aprire domande e materiale.</p>
          ${barsHtml(ts, (v, q) => `${q}% · ${v.n}`)}
        </section>` : ""}

        ${db.hist.length || hasStats ? `<div class="row"><button class="linkbtn small" data-act="reset">Azzera i miei risultati</button></div>` : ""}
        ${ui.resetAsk ? confirmBox(`Cancellare lo storico dei test e le statistiche di ${esc(utente.nome)}, anche online?`, "resetyes", "Azzera", "resetno", "Annulla") : ""}
      </div>`);

    onClick = b => {
      if (b.dataset.h !== undefined) { ui.hIdx = +b.dataset.h; ui.filter = "ko"; return go("dettaglio"); }
      switch (b.dataset.act) {
        case "reset": ui.resetAsk = true; return renderRisultati();
        case "resetno": ui.resetAsk = false; return renderRisultati();
        case "resetyes": db.stats = {}; db.hist = []; db.azz = Date.now(); ui.resetAsk = false; save(); return renderRisultati();
      }
    };
  }

  // =====================================================================
  // Vista: Scheda argomento (statistiche, materiale, domande)
  // =====================================================================
  function renderTopic() {
    const k = ui.tk, nome = topicName(k);
    const qs = DOMANDE.filter(d => d.s === k);
    let n = 0, ok = 0;
    qs.forEach(d => { const x = db.stats[d.id]; if (x) { n += x.n; ok += x.ok; } });
    const errs = qs.filter(d => lastResult(d.id) === "ko"), mai = qs.filter(d => lastResult(d.id) === "na");
    const fc = {};
    qs.forEach(d => d.f.forEach(f => { fc[f] = (fc[f] || 0) + 1; }));
    const fonti = Object.entries(fc).sort((x, y) => y[1] - x[1]);
    const conPdf = fonti.filter(([f]) => MAT[f]);
    if (ui.tf === "auto") ui.tf = errs.length ? "ko" : "all";
    const list = ui.tf === "ko" ? errs : ui.tf === "na" ? mai : qs;
    const back = { risultati: "Torna ai risultati", archivio: "Torna all'archivio", result: "Torna alla correzione", dettaglio: "Torna alla correzione", quiz: "Torna al quiz" }[ui.prev] || "Torna all'inizio";
    const stLabel = { ok: "Ultima: corretta", ko: "Ultima: sbagliata", na: "Mai affrontata" };

    paint(`
      <header class="mast">
        <span class="eyebrow">Argomento · ${qs.length} domande</span>
        <h1>${esc(nome)}</h1>
      </header>
      ${tabs(["home", "risultati", "archivio"].includes(ui.prev) ? ui.prev : "")}
      <div class="stack">
        <div class="row"><button class="btn ghost" data-act="back">← ${back}</button></div>
        <section class="panel">
          <div class="facts">
            <div class="fact"><b class="mono">${n ? pct(ok, n) + "%" : "–"}</b><span>risposte corrette${n ? ` (${ok}/${n})` : ""}</span></div>
            <div class="fact"><b class="mono" style="color:var(--ko)">${errs.length}</b><span>da ripassare</span></div>
            <div class="fact"><b class="mono">${mai.length}</b><span>mai affrontate</span></div>
          </div>
          <div class="row">
            <button class="btn primary" data-act="tprat">Esercitati su ${Math.min(PRATICA_ARG_N, qs.length)} domande</button>
            ${errs.length ? `<button class="btn" data-act="tko">${rifai(errs.length)}</button>` : ""}
          </div>
        </section>

        <h2>Materiale di riferimento</h2>
        ${conPdf.length ? `<div class="mlist">${conPdf.map(([f, c]) => `<div class="mitem">
            <strong>${esc(f)}</strong><span class="small muted mono">${c} dom.</span>
            <div class="files">${sourceLinks(f)}</div>
          </div>`).join("")}</div>` : `<p class="muted small">Nessun PDF collegato a questo argomento.</p>`}

        <div class="row">
          <h2>Domande</h2><span class="spacer"></span>
          <div class="seg" role="group" aria-label="Filtro domande">
            <button data-tf="all" aria-pressed="${ui.tf === "all"}">Tutte (${qs.length})</button>
            <button data-tf="ko" aria-pressed="${ui.tf === "ko"}">Sbagliate (${errs.length})</button>
            <button data-tf="na" aria-pressed="${ui.tf === "na"}">Mai fatte (${mai.length})</button>
          </div>
        </div>
        ${list.length ? `<div class="review">${list.map(d => {
          const st = lastResult(d.id);
          return `<div class="ritem ${st}"><div class="row small"><span class="st ${st}">${stLabel[st]}</span></div>${answerBlock(d)}</div>`;
        }).join("")}</div>` : `<p class="muted">Nessuna domanda in questo elenco.</p>`}
      </div>`);

    onClick = b => {
      if (b.dataset.tf) { ui.tf = b.dataset.tf; return renderTopic(); }
      switch (b.dataset.act) {
        case "back": return go(ui.prev && ui.prev !== "argomento" ? ui.prev : "home");
        case "tprat": return startPractice(shuffle(qs.map(d => d.id)).slice(0, PRATICA_ARG_N), "Esercitazione · " + nome);
        case "tko": return startPractice(errs.map(d => d.id), "Ripasso errori · " + nome);
      }
    };
  }

  // =====================================================================
  // Vista: Archivio (per argomento o per documento, con ricerca)
  // =====================================================================
  function renderArchive() {
    const q = ui.q.trim().toLowerCase();
    const match = d => !q || (d.q + " " + d.o.join(" ") + " " + d.f.join(" ")).toLowerCase().includes(q);
    const groups = Object.entries(ARGOMENTI)
      .map(([k, a]) => ({ title: a.nome, qs: DOMANDE.filter(d => d.s === k && match(d)), top: `<button class="btn" data-tv="${k}">Apri l'argomento: materiale ed esercitazione</button>` }))
      .filter(g => g.qs.length);
    const found = groups.reduce((n, g) => n + g.qs.length, 0);

    paint(`
      <header class="mast">
        <span class="eyebrow">Archivio · ${DOMANDE.length} domande${VERSIONE ? " · aggiornato il " + VERSIONE : ""}</span>
        <h1>Archivio domande</h1>
      </header>
      ${tabs("archivio")}
      <div class="stack">
        <input class="search" id="cerca" type="search" placeholder="Cerca una parola, es. ASET, compartimento, UNI 9795" value="${esc(ui.q)}" aria-label="Cerca nelle domande">
        ${q ? `<p class="small muted">${found} domande trovate.</p>` : ""}
        ${groups.map(g => `<details class="topic" ${q ? "open" : ""}>
          <summary><strong>${esc(g.title)}</strong><span class="muted small mono">${g.qs.length}</span></summary>
          <div class="alist">
            <div class="aitem"><div class="row">${g.top}</div></div>
            ${g.qs.map(d => `<div class="aitem">${answerBlock(d)}</div>`).join("")}
          </div>
        </details>`).join("")}
      </div>`);

    // ricerca con breve attesa, mantenendo il cursore nel campo
    const inp = document.getElementById("cerca");
    let deb = null;
    inp.oninput = () => {
      clearTimeout(deb);
      deb = setTimeout(() => {
        if (ui.view !== "archivio" || !inp.isConnected) return;
        ui.q = inp.value;
        const pos = inp.selectionStart;
        renderArchive();
        const n = document.getElementById("cerca");
        n.focus();
        try { n.setSelectionRange(pos, pos); } catch (e) { /* ignorato */ }
      }, 200);
    };
    onClick = null;
  }

  // =====================================================================
  // Visore PDF interno (pdf.js): i link «materiale/…» si aprono qui
  // =====================================================================
  const $ = id => document.getElementById(id);
  const pv = { el: $("pv"), body: $("pv-body"), docs: {}, doc: null, fid: null, page: 1, zoom: 1, lib: null, task: 0 };

  function loadLib() {
    if (!pv.lib) {
      pv.lib = import(PDFJS + "pdf.min.mjs")
        .then(lib => { lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs"; return lib; })
        .catch(e => { pv.lib = null; throw e; });
    }
    return pv.lib;
  }
  function getDoc(fid) {
    if (!pv.docs[fid]) {
      pv.docs[fid] = (async () => {
        const lib = await loadLib();
        const r = await fetch(pdfUrl(fid, 0));
        if (!r.ok) throw new Error("http " + r.status);
        return lib.getDocument({ data: new Uint8Array(await r.arrayBuffer()) }).promise;
      })().catch(e => { delete pv.docs[fid]; throw e; });
    }
    return pv.docs[fid];
  }
  function pvMessage(html) { pv.body.innerHTML = `<div class="pv-msg">${html}</div>`; }
  function pvBar() {
    const n = pv.doc ? pv.doc.numPages : 0;
    $("pv-pg").textContent = n ? `pag. ${pv.page} / ${n}` : "";
    $("pv-prev").disabled = !n || pv.page <= 1;
    $("pv-next").disabled = !n || pv.page >= n;
    $("pv-ext").href = pdfUrl(pv.fid, pv.page);
  }
  async function pvRender() {
    const my = ++pv.task;       // scarta i render superati da un cambio pagina più recente
    pvBar();
    if (!pv.doc) return;
    const page = await pv.doc.getPage(pv.page);
    if (my !== pv.task) return;
    const avail = Math.max(240, pv.body.clientWidth - 24);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = avail / page.getViewport({ scale: 1 }).width * pv.zoom;
    const vp = page.getViewport({ scale: scale * dpr });
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width / dpr) + "px"; c.style.height = Math.floor(vp.height / dpr) + "px";
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    if (my !== pv.task) return;
    pv.body.replaceChildren(c);
    pv.body.scrollTop = 0;
  }
  async function openPdf(fid, pg) {
    Object.assign(pv, { fid, page: Math.max(1, pg || 1), zoom: 1, doc: null });
    $("pv-title").textContent = FID2SRC[fid] || TIT[fid] || "Documento";
    pv.el.classList.add("open");
    document.body.style.overflow = "hidden";
    pvBar(); pvMessage("Caricamento del documento…");
    $("pv-close").focus();
    try {
      const d = await getDoc(fid);
      if (pv.fid !== fid) return;
      pv.doc = d; pv.page = Math.min(pv.page, d.numPages);
      await pvRender();
    } catch (e) {
      if (pv.fid !== fid) return;
      pvMessage(`Non riesco a mostrare il documento qui.<br><a href="${pdfUrl(fid, pv.page)}" target="_blank" rel="noopener">Prova ad aprirlo in una nuova scheda</a>.`);
    }
  }
  function closePdf() {
    pv.el.classList.remove("open");
    Object.assign(pv, { fid: null, doc: null });
    pv.task++;
    pv.body.replaceChildren();
    document.body.style.overflow = "";
  }
  const pvGo = delta => { if (pv.doc && pv.page + delta >= 1 && pv.page + delta <= pv.doc.numPages) { pv.page += delta; pvRender(); } };
  const pvZoom = f => { pv.zoom = Math.min(3, Math.max(.5, pv.zoom * f)); pvRender(); };
  $("pv-close").onclick = closePdf;
  $("pv-prev").onclick = () => pvGo(-1);
  $("pv-next").onclick = () => pvGo(1);
  $("pv-zin").onclick = () => pvZoom(1.25);
  $("pv-zout").onclick = () => pvZoom(1 / 1.25);
  window.addEventListener("resize", () => { if (pv.doc) pvRender(); });

  // =====================================================================
  // Tastiera
  // =====================================================================
  document.addEventListener("keydown", e => {
    // visore aperto: Esc chiude, frecce cambiano pagina
    if (pv.el.classList.contains("open")) {
      const k = { Escape: closePdf, ArrowRight: () => pvGo(1), ArrowLeft: () => pvGo(-1) }[e.key];
      if (k) { e.preventDefault(); k(); }
      return;
    }
    // quiz: 1-4 o A-D per rispondere, frecce per spostarsi
    const s = db.sess;
    if (ui.view !== "quiz" || !s || s.done || e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toUpperCase();
    let idx = "1234".indexOf(key); if (idx < 0) idx = "ABCD".indexOf(key);
    if (e.key.length === 1 && idx >= 0 && idx < s.items[s.cur].order.length && !ui.confirm) {
      const b = app.querySelector(`[data-opt="${idx}"]`);
      if (b && !b.disabled) b.click();
    } else if (e.key === "ArrowRight" && s.cur < s.items.length - 1) { s.cur++; ui.confirm = false; save(); render(); }
    else if (e.key === "ArrowLeft" && s.cur > 0) { s.cur--; ui.confirm = false; save(); render(); }
    else if (e.key === "Escape" && (ui.confirm || ui.showGrid)) { ui.confirm = false; ui.showGrid = false; renderQuiz(); }
  });

  // =====================================================================
  // Avvio: accesso, poi una simulazione scaduta mentre la pagina era chiusa viene consegnata
  // =====================================================================
  function avvio() {
    if (db.sess && !db.sess.done && db.sess.mode === "esame" && Date.now() > db.sess.end) finish();
    else render();
  }
  avvio();
  pull();
})();
</script>

</body>
</html>
