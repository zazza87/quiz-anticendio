D("z32","fse",[EFSA],"Nell'esempio, l'obiettivo di sicurezza della progettazione prestazionale è garantire agli occupanti:",["Condizioni di «tenibilità» fino al raggiungimento del luogo sicuro.","L'assenza totale di fumo nell'autorimessa.","L'intervento dei Vigili del fuoco entro 10 minuti."]);
D("z33","fse",[EFSA],"Secondo il Codice richiamato nell'esempio, salvo valutazioni specifiche, il margine di sicurezza tra ASET e RSET è:",["Il 100% di RSET e comunque mai inferiore a 30 secondi.","Il 10% di RSET.","Sempre 60 secondi."]);
D("z34","fse",[EFSA],"Nel metodo avanzato (ISO 13571) richiamato nell'esempio, ASET è il minore fra quelli calcolati con i modelli:",["Dei gas tossici, dei gas irritanti, del calore e dell'oscuramento della visibilità.","Del solo calore e della sola visibilità.","Della resistenza al fuoco e della reazione al fuoco."]);
D("z35","fse",[EFSA],"Lo scenario di incendio dell'esempio, tratto dalla RTV autorimesse, prevede:",["Quattro veicoli attorno a una colonna, con propagazione dopo 12 minuti a due veicoli e dopo altri 12 all'ultimo.","Un solo veicolo con incendio ultra-fast.","Incendio di tutti i veicoli contemporaneamente."]);
D("z36","fse",[EFSA],"Nell'esempio FSE, il focolare è stato descritto con i parametri della schiuma di poliuretano flessibile per far emergere soprattutto:",["La criticità della perdita di visibilità (elevata resa in particolato).","La produzione di gas irritanti.","L'irraggiamento verso le strutture."]);
D("z37","fse",[EFSA],"Secondo l'esempio, il PVC rispetto al poliuretano:",["Produce più gas irritanti ma meno particolato.","Produce più particolato e nessun gas irritante.","Non partecipa alla combustione."]);
D("z38","fse",[EFSA],"I modelli «a zone» citati nell'esempio:",["Suddividono l'ambiente in pochi volumi di controllo (strati) con proprietà uniformi al loro interno.","Risolvono le equazioni di conservazione in un gran numero di celle.","Simulano solo il movimento degli occupanti."]);
D("z39","fse",[EFSA],"I modelli di campo (CFD) citati nell'esempio sono necessari soprattutto quando:",["Gli altri modelli forniscono soluzioni eccessivamente conservative.","Il compartimento è inferiore a 100 m².","Non è disponibile un computer."]);
D("z40","fse",[EFSA],"Il software FDS usato nell'esempio è sviluppato e rilasciato open source da:",["Il NIST (National Institute of Standards and Technology).","Il CNVVF.","L'UNI."]);
D("z41","fse",[EFSA],"Nell'esempio FSE, l'ASET risultante è stato determinato dalla prima soglia che fallisce, cioè:",["La visibilità (ASET = 226 s).","La temperatura (ASET = 600 s).","La concentrazione di CO (ASET = 60 s)."]);
D("z42","fse",[EFSA],"In FDS, i «devices» sono:",["Sensori virtuali di misura delle grandezze fisiche di interesse.","Gli occupanti simulati.","Le aperture di ventilazione."]);
D("z43","fse",[EFSA],"Secondo l'esempio (ISO/TR 16738), RSET è la somma dei tempi di:",["Rivelazione, allarme generale, attività di pre-movimento e movimento.","Rivelazione e intervento dei soccorritori.","Pre-movimento e spegnimento."]);
D("z44","fse",[EFSA],"Secondo l'esempio, il tempo di allarme generale ta si assume pari a zero quando:",["La rivelazione attiva direttamente l'allarme generale dell'edificio.","Esiste un addetto alla centrale di controllo.","L'edificio è un albergo."]);
D("z45","fse",[EFSA],"Secondo l'esempio, la fase di pre-movimento:",["Spesso occupa la maggior parte del tempo totale di esodo.","È sempre trascurabile.","Coincide con il tempo di rivelazione."]);
D("z46","fse",[EFSA],"Nell'esempio, il tempo stimato di inizio esodo (140 s) è la somma di:",["Circa 20 s di attivazione IRAI, 90 s di pre-movimento e 30 s di margine cautelativo.","60 s di rivelazione e 80 s di movimento.","140 s di solo pre-movimento."]);

// --- Distanza di separazione
D("z50","s3",[ED],"Nell'esempio di calcolo della distanza di separazione (azienda di pellami), l'obiettivo è:",["Non superare la soglia di irraggiamento di 12,6 kW/m² dal capannone al deposito esterno.","Garantire 2,5 kW/m² sulle vie d'esodo interne.","Limitare la temperatura interna a 200 °C."]);
D("z51","s3",[ED],"Nell'esempio, il compartimento produzione ha qf < 600 MJ/m²: per esso la soluzione conforme fornisce una distanza di separazione di:",["3,5 m.","10,5 m.","8 m."]);
D("z52","s3",[ED],"Nel metodo analitico dell'esempio, con qf > 1200 MJ/m² la potenza termica radiante dell'incendio convenzionale E1 vale:",["149 kW/m².","12,6 kW/m².","60 kW/m²."]);
D("z53","s3",[ED],"Nel metodo analitico, lo spessore della fiamma df è assunto pari a:",["2/3 dell'altezza del varco da cui esce la fiamma.","L'intera altezza del compartimento.","1 m in ogni caso."]);
D("z54","s3",[ED],"Nell'esempio, la distanza reale di 8 m risulta rispetto a quella richiesta (10,52 m analitica, 9,44 m tabellare):",["Insufficiente con entrambi i metodi.","Sufficiente con entrambi i metodi.","Sufficiente solo con il metodo tabellare."]);
D("z55","s3",[ED],"Come metodologia alternativa, l'esempio calcola il fattore di vista secondo:",["L'Allegato G della EN 1991-1-2 (Eurocodice 1).","La UNI 9795.","La EN 13501-1."]);
D("z56","s3",[ED],"Con il metodo dell'Allegato G della EN 1991-1-2, quando la proiezione del bersaglio cade al centro della sorgente, il fattore di vista è:",["La somma dei fattori delle 4 sub-sorgenti in cui la sorgente è suddivisa.","Il prodotto dei fattori delle 4 sub-sorgenti.","Sempre pari a 1."]);
D("z57","s3",[ED],"Spostando il bersaglio in posizione più defilata rispetto al centro della sorgente, il fattore di vista:",["Diminuisce.","Aumenta.","Resta invariato."]);
D("z58","s3",[ED],"Se la proiezione del bersaglio cade fuori dalla superficie radiante, nel metodo EN 1991-1-2 alcuni fattori delle sub-sorgenti:",["Vanno sottratti nella somma.","Vanno raddoppiati.","Vanno ignorati."]);
D("z59","s3",[EDF],"Nell'esempio con FSE sulla distanza di separazione, il problema nasceva da:",["Un'ampia superficie vetrata non compartimentante affacciata sull'edificio uffici a 5 m.","Una parete REI 120 troppo vicina.","L'assenza di idranti esterni."]);
D("z60","s3",[EDF],"Secondo l'esempio, il problema della distanza di separazione sarebbe risolto anche:",["Realizzando la superficie vetrata con infissi EI pari alla classe della parete del compartimento.","Aumentando l'illuminazione di sicurezza.","Installando rivelatori di fumo."]);
D("z61","s3",[EDF],"Nell'esempio FSE sulla distanza di separazione, la curva RHR è stata costruita con il metodo del par. M.2.6 adottando per l'attività industriale:",["Potenza massima 50 MW e velocità di crescita ultra-fast.","Potenza massima 5 MW e crescita slow.","Potenza massima 1 MW e crescita medium."]);
D("z62","s3",[EDF],"Secondo l'esempio, la soluzione conforme sulla distanza di separazione è molto cautelativa perché:",["Associa alle aperture temperature caratteristiche dell'incendio convenzionale cellulosico.","Trascura l'irraggiamento.","Considera solo i vetri chiusi."]);
D("z63","s3",[EDF],"Secondo le conclusioni dell'esempio, nelle soluzioni alternative la GSA è ancora più decisiva perché:",["Quantità, tipo di materiale e layout ipotizzati nella simulazione devono essere mantenuti nel tempo.","Sostituisce le misure di protezione attiva.","Esonera dal rinnovo periodico."]);
D("z64","fse",[EDF],"Secondo l'esempio, nell'uso di FDS un passaggio fondamentale per l'affidabilità dei risultati è:",["La scelta della dimensione della mesh con un'analisi di sensibilità.","L'uso di una sola cella di calcolo.","La scelta del colore delle slice."]);

// --- Edificio tutelato: compartimentazione con FSE
D("z70","proc",[EC],"Un ufficio con oltre 300 persone in un edificio tutelato ai sensi del D.Lgs. 42/2004 rientra, secondo l'esempio, nell'attività:",["72.1.C (e non 71.1.A).","71.1.A.","73.1.B."]);
D("z71","s3",[EC],"Nell'esempio dell'edificio storico, non era possibile installare una porta E 45-Sa verso la scala monumentale per:",["Ragioni estetiche legate al vincolo storico dell'edificio.","Mancanza di spazio per l'esodo.","Costi eccessivi."]);
D("z72","s3",[EC],"Per la soluzione alternativa sulla scala monumentale, l'esempio adotta la modalità della tab. S.3-3 relativa a:",["Le caratteristiche del filtro.","La distanza di separazione.","La compartimentazione multipiano."]);
D("z73","s3",[EC],"Nell'esempio, il portone di legno verso la scala deve restare sempre aperto: questa prescrizione:",["Entra nella GSA, con un controllo ogni mattina all'apertura dell'attività.","È irrilevante ai fini antincendio.","È sostituita da una porta REI 120."]);
D("z74","s3",[EC],"Nello scenario 1 dell'esempio, oltre all'assenza di passaggio di fumi, si verifica che l'irraggiamento vicino al varco resti sotto:",["2,5 kW/m² (tab. M.3-2).","12,6 kW/m².","50 kW/m²."]);
D("z75","s3",[EC],"Nello scenario 1 dell'esempio è stato adottato un focolare molto severo pari a:",["5 MW, valore massimo della tab. M.2-2 per attività civili.","500 kW.","50 MW."]);

// --- Edificio tutelato: reazione al fuoco
D("z80","s1",[ER],"Secondo la RTV uffici (V.4.4.1), nelle vie d'esodo verticali e nei passaggi delle vie d'esodo orizzontali vanno impiegati materiali almeno del gruppo:",["GM2.","GM3.","GM4."]);
D("z81","s1",[ER],"Secondo la RTV V.4, nelle vie d'esodo è ammesso il gruppo GM3 se:",["Si incrementa di un livello la prestazione di controllo dell'incendio (S.6) e di rivelazione e allarme (S.7).","Si installano più estintori.","L'edificio è inferiore a 12 m."]);
D("z82","s1",[ER],"Nell'esempio, i rivestimenti in legno non conformi lungo i corridoi sono stati gestiti con soluzione alternativa mediante:",["Tende tagliafuoco mobili in aderenza alle pareti del percorso d'esodo (prodotto innovativo, G.2.7).","Verniciatura intumescente del legno.","Rimozione totale dei rivestimenti."]);
D("z83","s1",[ER],"Nell'esempio, le tende tagliafuoco scelte devono avere almeno:",["Resistenza al fuoco EI 30 e reazione al fuoco B-s1,d0.","Resistenza REI 120 e classe A1.","Solo classe E di reazione al fuoco."]);
D("z84","s1",[ER],"Per un prodotto «innovativo» non normato (tab. G.2-1), l'idoneità all'impiego può essere giustificata:",["Dal professionista antincendio con valutazione del rischio basata su certificazioni di prova di organismi autorizzati.","Dal solo fabbricante con autodichiarazione.","Dal Comando VVF senza documentazione."]);
D("z85","codg",[ER],"Nell'esempio, il profilo Rbeni = 2 è attribuito perché l'edificio è:",["Vincolato ma non strategico.","Strategico ma non vincolato.","Né vincolato né strategico."]);
D("z86","codg",[ER],"Negli uffici aperti al pubblico dell'esempio, δocc = B perché gli occupanti sono:",["Svegli ma senza familiarità con l'edificio.","Svegli e con familiarità con l'edificio.","Addormentati."]);

// Blocco 25 – RTV V.11 Strutture sanitarie (Tinti) ed Esercitazione RTV V.5 attività ricettive (albergo 171 posti letto).
const V11 = "Lezione Tinti – RTV V.11 Strutture sanitarie";
const V5E = "Esercitazione RTV V.5 – Albergo da 171 posti letto";

// --- V.11
D("v40","rtv",[V11],"Secondo la lezione, il DM 29 marzo 2021 (RTV strutture sanitarie) è entrato in vigore il:",["9 maggio 2021.","9 aprile 2021.","1° gennaio 2022."]);
D("v41","rtv",[V11],"Per le strutture sanitarie, in alternativa alla RTV V.11, si possono continuare ad applicare:",["Le norme tradizionali del DM 18 settembre 2002.","Solo le norme del DM 10 marzo 1998.","Nessuna alternativa: la RTV è obbligatoria."]);
D("v42","rtv",[V11],"Le case di riposo per anziani autosufficienti, prive di assistenza sanitaria, secondo la lezione:",["Non rientrano nel DM 18/9/2002, che però può essere un riferimento da ponderare in base alle condizioni degli ospiti.","Rientrano sempre nel DM 18/9/2002.","Non sono mai attività soggette."]);
D("v43","rtv",[V11],"Per le strutture sanitarie, i parametri di classificazione della RTV sono:",["Tipologia della prestazione erogata, quota massima dei piani e numero di posti letto.","Solo la superficie lorda.","Solo il numero di addetti."]);
D("v44","codg",[V11],"Il «piano di riferimento del compartimento» è:",["Il piano del luogo sicuro esterno verso cui avviene prevalentemente l'esodo e da cui accedono i soccorritori.","Il piano più alto dell'edificio.","Il piano con la superficie maggiore."]);
D("v45","codg",[V11],"La «quota di piano» è il dislivello tra il piano e il piano di riferimento del compartimento e può essere:",["Positiva, negativa o nulla.","Solo positiva.","Solo negativa."]);
D("v46","rtv",[V11],"Nella RTV V.11 il profilo Rvita indicato per alcune aree:",["È indicativo: il progettista può scegliere valori diversi motivandone la scelta.","È vincolante e non modificabile.","Non è mai indicato."]);
D("v47","rtv",[V11],"I valori di resistenza al fuoco della tabella V.11-2 sono:",["Valori minimi: va comunque calcolata la classe di ciascun compartimento.","Valori massimi da non superare.","Valori validi solo per strutture in legno."]);
D("v48","rtv",[V11],"A differenza di altre RTV, la V.11 richiede espressamente per le aree di ricovero e le unità speciali:",["L'esodo orizzontale progressivo.","L'esodo per fasi.","Solo l'esodo simultaneo."]);
D("v49","s4",[V11],"L'esodo orizzontale progressivo prevede:",["Lo spostamento degli occupanti dal compartimento di primo innesco a uno adiacente capace di contenerli e proteggerli.","L'evacuazione immediata di tutto l'edificio.","La permanenza degli occupanti nelle proprie stanze."]);
D("v50","rtv",[V11],"Nella RTV V.11, alcune aree tecniche o depositi ubicati in opere con aree TA o TB richiedono per il controllo dell'incendio il livello:",["IV.","II.","I."]);
D("v51","rtv",[V11],"In presenza di compartimenti con profilo D1 e D2 (ricovero, unità speciali), la RTV V.11 evidenzia la necessità di:",["Un ascensore (montalettighe) antincendio.","Un impianto sprinkler in tutti i locali.","Un elisuperficie."]);
D("v52","rtv",[V11],"Gli impianti delle aree TA2 (unità speciali, cure intensive) devono garantire:",["La continuità delle prestazioni sanitarie anche in caso di incendio in un qualunque altro compartimento.","Lo spegnimento automatico in 30 secondi.","L'evacuazione dei pazienti entro 5 minuti."]);
D("v53","rtv",[V11],"Nelle strutture con ricovero, secondo la RTV V.11, le bombole di gas medicali possono essere detenute:",["Con esclusione dei percorsi d'esodo e delle aree con visitatori, nel rispetto di specifiche prescrizioni.","In qualsiasi locale, anche lungo i corridoi.","Solo all'esterno dell'edificio."]);
D("v54","rtv",[V11],"Le sostanze infiammabili per esigenze igienico-sanitarie possono essere detenute, secondo la RTV V.11:",["In armadi metallici con bacino di contenimento, in quantità compatibili con la valutazione del rischio.","Liberamente nelle stanze di degenza.","Mai, in nessun caso."]);
D("v55","rtv",[V11],"Per le strutture sanitarie con non più di 25 posti letto (non soggette al DPR 151), la RTV V.11:",["Fornisce indicazioni sui livelli di prestazione per alcune misure, rimandando alla RTO.","Non fornisce alcuna indicazione.","Impone l'applicazione integrale del DM 18/9/2002."]);
D("v56","codg",[V11],"Secondo la lezione, una soluzione progettuale «in deroga» si adotta:",["Per attività con RTV, quando non è possibile applicare efficacemente né le soluzioni conformi né quelle alternative.","Sempre, in alternativa alle soluzioni conformi.","Solo per attività non soggette."]);

// --- Esercitazione V.5 albergo
D("v60","rtv",[V5E],"Un albergo con 171 posti letto, secondo l'Allegato I del DPR 151/2011, rientra nell'attività:",["66.4.C (oltre 100 posti letto).","66.2.B.","66.1.A."]);
D("v61","rtv",[V5E],"Nella RTV V.5, un albergo con 171 posti letto è classificato, in relazione ai posti letto, come:",["PC (100 < p ≤ 500).","PB (50 < p ≤ 100).","PD (500 < p ≤ 1000)."]);
D("v62","rtv",[V5E],"Nella RTV V.5, un albergo alto 17,20 m è classificato, in relazione alla quota dei piani, come:",["HB (12 m < h ≤ 24 m).","HA (h ≤ 12 m).","HC (24 m < h ≤ 32 m)."]);
D("v63","rtv",[V5E],"Nella RTV V.5 le aree TC sono:",["Spazi di riposo, dove la maggior parte degli occupanti può essere addormentata (camere).","Spazi comuni come hall e sale colazione.","Depositi con qf > 600 MJ/m²."]);
D("v64","rtv",[V5E],"Nella RTV V.5 le aree TB sono:",["Spazi comuni, con occupanti svegli che non conoscono l'edificio (hall, sale colazione, sale riunioni).","Spazi riservati al personale.","Camere degli ospiti."]);
D("v65","rtv",[V5E],"Secondo il DM 9/8/2016, all'interno delle aree TC (camere) mobili imbottiti e tendaggi devono appartenere almeno al gruppo:",["GM2.","GM4.","GM0."]);
D("v66","rtv",[V5E],"Nell'esercitazione, sul piano camere lungo 77 m servono 3 uscite indipendenti perché:",["Con due sole uscite non sarebbe rispettata la lunghezza d'esodo massima di 30 m.","Lo impone la larghezza minima delle vie d'esodo.","Ci sono più di 100 posti letto per piano."]);
D("v67","rtv",[V5E],"Secondo la RTV V.5, le camere con affollamento non superiore a 10 occupanti:",["Sono escluse dai limiti minimi previsti per le larghezze delle vie d'esodo.","Devono avere porte larghe almeno 1200 mm.","Devono avere due uscite."]);
D("v68","rtv",[V5E],"Nell'albergo, planimetrie del sistema d'esodo e istruzioni di comportamento in emergenza devono essere esposte anche:",["All'interno di ciascuna camera, in più lingue.","Solo alla reception.","Solo nei vani scala."]);
D("v69","s5",[V5E],"Secondo l'esercitazione, nel registro dei controlli periodici vanno annotati:",["Controlli e manutenzioni, attività di informazione, formazione e addestramento e prove di evacuazione.","Solo gli interventi dei Vigili del fuoco.","Solo i consumi energetici."]);
D("v70","s6",[V5E],"Gli estintori, nella soluzione conforme, vanno installati con le impugnature a circa:",["110 cm dal piano di calpestio.","50 cm dal piano di calpestio.","180 cm dal piano di calpestio."]);
D("v71","s8",[V5E],"Nella soluzione conforme per il livello II di S.8, le aperture di smaltimento sono distribuite nella parte alta dei locali rispettando un raggio di influenza roffset di:",["20 m.","5 m.","50 m."]);

// Blocco 26 – Scarpa (Comando VVF Venezia): soluzioni alternative per misura ed esempi su edifici tutelati.
const SA = "Lezione Scarpa – Soluzioni alternative (2025)";
const SAE = "Lezione Scarpa – Esempi di soluzioni alternative (2025)";

D("sa10","codg",[SA],"Secondo il Codice (G.2.6.5.2), l'impiego di soluzioni alternative è consentito:",["Solo nelle attività con valutazione del progetto.","In tutte le attività, anche di categoria A senza progetto.","Solo nelle attività non soggette."]);
D("sa11","codg",[SA],"Secondo il G.2.6.5.3, possono diventare oggetto di procedimento di deroga:",["Tutte le disposizioni del Codice, comprese quelle delle regole tecniche verticali.","Solo le disposizioni della RTO.","Solo le misure S.4 ed S.2."]);
D("sa12","codg",[SA],"Per verificare una soluzione in deroga, il professionista antincendio può impiegare:",["I metodi della tabella G.2-1 e i metodi aggiuntivi della tabella G.2-2.","Solo le soluzioni conformi.","Solo prove sperimentali in scala reale."]);
D("sa13","s2",[SA],"Per il livello I e II di resistenza al fuoco, una modalità accettata per dimostrare l'assenza di danneggiamento ad altre costruzioni è:",["Dimostrare analiticamente che il collasso della costruzione è di tipo implosivo.","Aumentare la distanza dei parcheggi.","Installare estintori aggiuntivi."]);
D("sa14","s2",[SA],"Tra gli accorgimenti per guidare un collasso di tipo implosivo c'è:",["Assegnare sovraresistenza al fuoco alle strutture perimetrali rispetto a quelle interne.","Concentrare i carichi d'incendio lungo il perimetro.","Ridurre la resistenza delle strutture perimetrali."]);
D("sa15","s2",[SA],"Nel livello II di resistenza al fuoco con soluzione alternativa, la capacità portante deve garantire un margine:",["tmarg ≥ 100% RSET e comunque ≥ 15 minuti.","tmarg ≥ 10% RSET.","Di almeno 120 minuti."]);
D("sa16","s2",[SA],"Per il livello III, la capacità di compartimentazione interna con soluzione alternativa può essere dimostrata, ad esempio, valutando:",["Sistemi di controllo dell'incendio a disponibilità superiore, come lame d'acqua o controllo fumo e calore.","Solo l'aumento dello spessore dei muri.","L'eliminazione degli impianti."]);
D("sa17","s2",[SA],"Per i livelli IV e V di resistenza al fuoco, oltre alle verifiche del livello III, vanno verificati:",["I parametri di danneggiamento e funzionalità previsti dal progettista e dalla committenza.","Solo i tempi di esodo.","Solo la reazione al fuoco dei rivestimenti."]);
D("sa18","s2",[SA],"Le soluzioni alternative di resistenza al fuoco (capitolo S.2) sono state chiarite dalla circolare DCPREV:",["n. 9962 del 24 luglio 2020.","n. 5555 del 18 aprile 2012.","n. 15002 del 22 luglio 2026."]);
D("sa19","s4",[SA],"Secondo la lezione, per il livello II della misura Esodo:",["Non sono previste soluzioni conformi, ma solo soluzioni alternative.","Sono previste solo soluzioni conformi.","Non è ammessa alcuna soluzione."]);
D("sa20","s4",[SA],"Per una soluzione alternativa sulle lunghezze d'esodo, si dimostra che:",["Gli occupanti abbandonano il compartimento di primo innesco prima che l'incendio determini condizioni incapacitanti.","L'affollamento è superiore a quello di progetto.","Le uscite sono più larghe di 1200 mm."]);
D("sa21","s6",[SA],"Una soluzione alternativa per gli impianti automatici (S.6.9) citata nella lezione: in una configurazione non prevista dalla UNI EN 12845 si può ricorrere:",["Alla NFPA 13.","Alla UNI 9795.","Alla UNI 10779."]);
D("sa22","s10",[SA],"Per la misura S.10, secondo la lezione, sono ammesse soluzioni alternative:",["Solo alle prescrizioni del paragrafo S.10.6, dimostrando gli obiettivi del S.10.5.","Per tutte le prescrizioni del capitolo.","Mai."]);
D("sa23","rtv",[SAE],"Nell'esempio della chiesa di San Paternian (RTV V.10), la non conformità riguardava:",["L'IRAI di livello IV, difficile da realizzare per la tutela del bene e la temporaneità dell'attività.","La resistenza al fuoco delle strutture lignee.","La larghezza delle uscite."]);
D("sa24","rtv",[SAE],"Nell'esempio di Ca' Scarpa (scuola, spettacolo ed edificio tutelato) sono state applicate insieme:",["RTV V.7, V.10 e V.15 oltre alla RTO.","Solo la RTV V.4.","Solo le regole tecniche tradizionali."]);
D("sa25","s3",[SAE],"A Ca' Scarpa la scala monumentale non poteva essere compartimentata per prescrizioni:",["Della Soprintendenza, creando di fatto un compartimento multipiano non conforme.","Del Comune sull'altezza dell'edificio.","Del datore di lavoro."]);
D("sa26","fse",[SAE],"Nella soluzione alternativa con FSE di Ca' Scarpa, RSET e ASET sono stati valutati rispettivamente con:",["Modelli di evacuazione (EVAC) e modelli FDS.","Solo calcoli manuali per entrambi.","Prove di evacuazione reali e prove al forno."]);

D("cx23","proc",[PP],"Nel caso di più attività in un complesso, comprese attività di categoria A, la valutazione del progetto:",["Riguarda solo le attività B e C; le attività A vanno dichiarate e descritte ma non sono oggetto di parere.","Riguarda anche le attività A, che ricevono parere.","Non è possibile: servono istanze separate."]);

D("cx26","proc",[PP],"La ricevuta PEC di avvenuta consegna della SCIA inviata al Comando, secondo il manuale:",["Ha lo stesso valore legale dell'avviso di ricevimento di una raccomandata (DPR 68/2005).","Non ha alcun valore legale.","Vale solo se seguita dalla copia cartacea."]);
D("cx27","proc",[PP],"Se la documentazione inviata con la SCIA non è conforme a quella prevista (DPR 151/2011, DM 7/8/2012):",["L'istanza è invalida e il Comando lo comunica subito dopo la verifica della completezza formale.","L'istanza è comunque valida.","Il Comando completa d'ufficio la documentazione."]);

D("cx29","proc",[PP],"Le dichiarazioni di conformità CE e i certificati di prova dei prodotti, secondo il manuale:",["Fanno parte del fascicolo che il titolare tiene a disposizione per i controlli del Comando.","Vanno sempre allegati alla SCIA in originale.","Non sono mai necessari."]);
D("cx30","proc",[PP],"Tra i problemi ricorrenti nelle dichiarazioni di conformità degli impianti, il manuale segnala:",["Descrizione insufficiente, norme non citate o generiche, mancanza di allegati obbligatori e di firme.","L'eccessivo dettaglio dei progetti.","L'uso della PEC."]);

D("cx33","codg",[PP],"La valutazione del rischio incendio, secondo il manuale, individua:",["Le più severe ma credibili ipotesi d'incendio e le conseguenze per occupanti, beni e ambiente.","Solo la classe di resistenza al fuoco.","Solo il numero di estintori."]);

D("lc11","proc",[LC],"Secondo la circolare 13061/2011, il principio alla base del DPR 151/2011 che bilancia sicurezza e semplificazione è quello di:",["Proporzionalità, riguardo alla gravità del rischio, alla natura del soggetto e alla dimensione delle attività.","Precauzione assoluta, uguale per tutte le attività.","Sussidiarietà verticale tra Stato e Regioni."]);

D("lc13","proc",[LC],"Secondo la circolare 13061/2011, per le attività di categoria A non è più previsto il parere preventivo di conformità perché:",["Sono soggette a regole tecniche e, per la loro standardizzazione, non presentano particolare complessità.","Sono tutte attività pubbliche.","Sono già controllate dal Comune."]);

D("lc15","proc",[LC],"Secondo la circolare 13061/2011, la documentazione della SCIA è formata da atti «tecnico-amministrativi», tra cui:",["Dichiarazione sostitutiva di atto notorio del titolare, asseverazione del tecnico abilitato e certificazioni/dichiarazioni.","Solo il progetto approvato.","Solo il verbale del sopralluogo."]);
D("lc16","proc",[LC],"Se un progetto comprende attività di categorie diverse, secondo la circolare 13061/2011 la valutazione del progetto riguarda:",["Le sole attività B e C; le attività A vanno indicate negli elaborati e nella relazione solo per valutare eventuali interferenze.","Tutte le attività, comprese quelle di categoria A.","Solo l'attività di categoria più alta."]);
D("lc17","proc",[LC],"Secondo la circolare 13061/2011, fino al 31 dicembre 2011 i controlli a campione sulle nuove attività in categoria A e B dovevano riguardare almeno:",["Il 2% delle stesse, individuate a sorteggio.","Il 10% delle stesse.","Il 50% delle stesse."]);
D("lc18","proc",[LC],"Secondo la circolare 13061/2011, il CPI nel nuovo regolamento:",["Non è più un provvedimento finale, ma il risultato del controllo effettuato, e non ha validità temporale.","Ha validità di cinque anni.","Sostituisce la SCIA."]);
D("lc19","proc",[LC],"Secondo la circolare 13061/2011, la ricevuta di avvenuta presentazione della SCIA (direttamente o tramite SUAP) è:",["Titolo abilitativo all'esercizio dell'attività ai soli fini antincendio.","Un semplice atto di protocollo senza effetti.","Un parere di conformità del progetto."]);
D("lc20","proc",[LC],"Secondo la circolare 13061/2011, se dai controlli emergono carenze, il Comando:",["Può anche non interrompere l'attività, chiedendo di conformarla entro un termine congruo, ove possibile con misure tecnico-gestionali.","Deve sempre e in ogni caso interrompere l'attività.","Non può adottare provvedimenti."]);
D("lc21","proc",[LC],"Secondo la circolare 13061/2011 (art. 19, c. 4 L. 241/90), decorso il termine per i provvedimenti, l'amministrazione può intervenire solo:",["In presenza di pericolo di danno per patrimonio artistico, ambiente, salute, sicurezza pubblica o difesa nazionale.","Su richiesta del titolare.","Entro ulteriori 15 giorni senza condizioni."]);
D("lc22","proc",[LC],"Secondo la circolare 13061/2011, i nuovi procedimenti volontari introdotti dal DPR 151/2011 sono:",["Il nulla osta di fattibilità (NOF) e le verifiche in corso d'opera.","La deroga e il rinnovo periodico.","La voltura e il CPI."]);
D("lc23","proc",[LC],"Secondo la circolare 13061/2011, il NOF e le verifiche in corso d'opera:",["Non sostituiscono gli obblighi degli artt. 3 e 4 e si concludono entro 30 giorni dalla presentazione.","Sostituiscono la SCIA.","Si concludono entro 60 giorni."]);
D("lc24","proc",[LC],"Secondo la circolare 13061/2011, durante i lavori sottoposti a verifiche in corso d'opera è necessario concordare con il Comando:",["Un cronoprogramma delle visite, in fase preliminare progettuale.","La sospensione dei lavori a ogni visita.","Il collaudo finale in contraddittorio."]);
D("lc25","proc",[LC],"Secondo la circolare 13061/2011, per i titolari con parere di conformità ex art. 2 DPR 37/98 e opera non ancora completata:",["Prima di iniziare l'attività presentano la SCIA; il parere vale come valutazione del progetto ex art. 3 DPR 151/11.","Devono ripresentare il progetto.","Devono chiedere il CPI con il vecchio regime."]);
D("lc26","proc",[LC],"Secondo la circolare 13061/2011, le attività prima non soggette e incluse nell'Allegato I del DPR 151/2011 dovevano concludere gli adempimenti entro il:",["6 ottobre 2012.","31 dicembre 2011.","7 ottobre 2016."]);
D("lc27","proc",[LC],"Secondo la circolare 13061/2011, nel transitorio i procedimenti di valutazione dei progetti riguardavano, per categoria:",["Esclusivamente le attività B e C (deroga per A, B, C; NOF per B e C; verifiche in corso d'opera per A, B, C).","Tutte le attività A, B e C.","Solo le attività di categoria C."]);
D("lc28","proc",[LC],"Secondo la circolare 13061/2011, l'asseverazione allegata al rinnovo periodico attesta l'efficienza di dispositivi, sistemi e impianti di protezione attiva, con esclusione:",["Delle attrezzature mobili di estinzione.","Degli impianti di rivelazione.","Delle porte tagliafuoco."]);
D("lc29","proc",[LC],"Secondo la circolare 13061/2011, l'asseverazione per il rinnovo periodico è resa da:",["Professionista abilitato e iscritto negli elenchi del Ministero dell'interno (L. 818/1984).","Qualsiasi tecnico, anche non iscritto agli elenchi.","Il titolare dell'attività."]);
D("lc30","proc",[LC],"Secondo la circolare 13061/2011, nel transitorio il valore orario per la valutazione dei progetti e il rinnovo periodico era di:",["44 euro (48 euro per i controlli di prevenzione incendi).","48 euro (44 euro per i controlli).","100 euro per tutti i servizi."]);
D("lc31","proc",[LC],"Secondo la circolare 13061/2011, se l'attività comprende più punti dell'Allegato I, la tariffa da corrispondere è:",["La somma delle tariffe delle singole attività/categorie.","Quella dell'attività di categoria più alta.","Una tariffa forfettaria unica."]);
D("lc32","proc",[LC],"Secondo la circolare 13061/2011, se la valutazione del progetto comprende anche punti di categoria A, la tariffa:",["Non tiene conto della categoria A, la cui tariffa si paga nella fase dei controlli.","Comprende anche la categoria A.","Raddoppia."]);

D("lc34","proc",[LC],"Secondo la circolare 13061/2011, per le verifiche in corso d'opera si applica la tariffa:",["Prevista per i controlli di prevenzione incendi.","Della valutazione dei progetti.","Della voltura."]);

// --- Aggravio del rischio (slide di sintesi)
D("ag10","proc",[AGG],"Secondo le slide di sintesi, l'aggravio del rischio incendio è:",["L'incremento, anche solo potenziale, del livello di rischio rispetto alla situazione precedentemente assentita.","Qualsiasi modifica dell'attività, anche migliorativa.","Il superamento del 10% del carico d'incendio."]);
D("ag11","proc",[AGG],"Per valutare l'aggravio, il punto di partenza è:",["L'assetto approvato con l'ultimo titolo VVF valido (valutazione progetto, SCIA o rinnovo).","Il progetto originario dell'edificio.","La normativa in vigore alla data della modifica."]);
D("ag12","proc",[AGG],"Con il Codice, secondo le slide, l'aggravio scatta se la modifica:",["Abbassa un livello di prestazione, elimina una misura prevista o rende non conforme una soluzione.","Cambia il colore delle pareti.","Riguarda solo gli arredi."]);
D("ag13","proc",[AGG],"Con le regole tecniche tradizionali, secondo le slide, l'aggravio scatta con:",["La perdita di conformità puntuale (es. riduzione REI, riduzione larghezza uscite, idranti non conformi).","Qualsiasi variazione di superficie.","Solo il cambio di titolare."]);
D("ag14","proc",[AGG],"Quale tra queste modifiche, secondo le slide, NON costituisce aggravio?",["Restyling delle finiture con materiali di reazione al fuoco pari o migliore.","Introduzione di solventi infiammabili in nuovi processi.","Foratura di setti compartimentali."]);
D("ag15","proc",[AGG],"Quale tra queste modifiche, secondo le slide, costituisce aggravio?",["Ampliamento delle aree di deposito con maggiore densità di stoccaggio combustibile.","Spostamento di arredi senza variazione dei percorsi.","Sostituzione di apparecchiature con altre equivalenti."]);
D("ag16","proc",[AGG],"Secondo le slide, l'aggravio:",["Non è una soglia numerica nazionale, ma una verifica integrata dei margini di sicurezza.","Scatta sempre con +10% di carico d'incendio.","Riguarda solo le attività di categoria C."]);
D("ag17","proc",[AGG],"In sede di rinnovo periodico, se c'è aggravio, secondo le slide occorre:",["Presentare prima la SCIA (o la valutazione del progetto) sul nuovo assetto.","Presentare comunque il rinnovo.","Attendere la scadenza successiva."]);
D("ag18","proc",[AGG],"Nella dichiarazione di non aggravio va attestato esplicitamente che:",["Carico d'incendio, vie d'esodo, compartimenti, impianti e affollamenti restano invariati e conformi.","L'attività è stata ispezionata dal Comando.","Il titolare è cambiato."]);
D("ag19","proc",[AGG],"In caso di valutazione «borderline» sull'aggravio, le slide consigliano di:",["Formalizzare un aggiornamento della SCIA o chiedere un confronto preliminare con il Comando.","Non comunicare nulla.","Attendere il controllo del Comando."]);

D("ab11","codg",[EAB],"Nell'esempio del laboratorio di abbigliamento, con occupanti svegli che conoscono l'edificio e velocità di crescita media, il profilo Rvita è:",["A2.","B2.","A3."]);
D("ab12","codg",[EAB],"Nell'esempio, δα = 2 (media) perché la percentuale di tessuti e fibre sintetiche sul totale:",["Non supera il 25%, come dichiarato dal titolare.","Supera il 50%.","È nulla."]);
D("ab13","s2",[EAB],"Nell'esempio, il carico d'incendio specifico è qf = 598,97 MJ/m²; con δq1 = 1, δq2 = 1 e δn = 0,85 si ottiene qf,d pari a circa:",["509 MJ/m², a cui corrisponde una classe minima di resistenza al fuoco 45.","598 MJ/m², classe 60.","300 MJ/m², classe 15."]);
D("ab14","s1",[EAB],"Nell'esempio con Rvita A2, per vie d'esodo e altri locali la reazione al fuoco richiede il livello I, quindi è ammesso l'impiego di materiali:",["Del gruppo GM4 (non classificati).","Solo del gruppo GM1.","Solo del gruppo GM0."]);
D("ab15","s2",[EAB],"Nell'esempio, il livello di prestazione III di resistenza al fuoco è attribuito perché l'opera:",["Non rientra negli altri criteri di attribuzione (es. è adiacente ad altre opere con civile abitazione).","È un edificio vincolato.","Ha un carico d'incendio superiore a 1200 MJ/m²."]);
D("ab16","s3",[EAB],"Nell'esempio, la civile abitazione al piano primo è stata resa:",["Non comunicante con il laboratorio; il piano interrato è accessibile tramite porta e scala EI 120.","Comunicante tramite filtro a prova di fumo.","Comunicante senza requisiti."]);
D("ab17","s3",[EAB],"Nell'esempio, la distanza di separazione calcolata con d = αp + β (α = 3,9, β = 2,9, p = 0,351) è di circa:",["4,27 m, verificata rispetto alla larghezza della strada di 6,80 m.","12,6 m, non verificata.","2,5 m, verificata."]);
D("ab18","s4",[EAB],"Nell'esempio, per 50 occupanti con Rvita A2 (Lu = 3,80 mm/persona) la larghezza minima Lo dell'esodo orizzontale è:",["190 mm (ma la larghezza minima delle vie d'esodo resta ≥ 900 mm).","1200 mm.","50 mm."]);
D("ab19","s4",[EAB],"Nell'esempio del laboratorio, la soluzione conforme per l'esodo prevede:",["Due uscite (120 cm e 90 cm) e lunghezza d'esodo massima di 30 m, inferiore ai 60 m ammessi.","Una sola uscita da 80 cm.","Quattro uscite da 120 cm."]);
D("ab20","s6",[EAB],"Nell'esempio, la soluzione conforme per il controllo dell'incendio (livello II) prevede:",["2 estintori da 6 kg con capacità 13A 70B.","Un impianto sprinkler.","Un solo estintore a CO2."]);
D("ab21","s8",[EAB],"Nell'esempio, con qf ≤ 600 MJ/m² e superficie di 398,2 m², la superficie utile minima delle aperture di smaltimento SE1 è:",["A/40 ≈ 10 m².","A/25 ≈ 16 m².","A/100 ≈ 4 m²."]);
D("ab22","s8",[EAB],"Nell'esempio, le aperture di smaltimento coincidono con:",["Gli infissi presenti nel locale, in parte di tipo permanentemente aperto (SEa).","Lucernai motorizzati collegati all'IRAI.","Condotti di estrazione meccanica."]);
D("ab23","s9",[EAB],"Nella soluzione conforme per il livello II di operatività antincendio, la distanza dei mezzi di soccorso dagli accessi di norma non dovrebbe superare:",["50 m.","100 m.","20 m."]);
D("ab24","s10",[EAB],"Nell'esempio, illuminazione di sicurezza e IRAI dispongono di alimentazione di sicurezza con:",["Interruzione breve (≤ 0,5 s) e autonomia non inferiore a 30 minuti.","Interruzione media (≤ 15 s) e autonomia 120 minuti.","Nessuna autonomia."]);
D("ab25","s10",[EAB],"Sul dispositivo generale a protezione di ciascuna linea elettrica di sicurezza deve essere indicato il messaggio:",["«Non manovrare in caso d'incendio».","«Sganciare in caso d'incendio».","«Uso esclusivo VVF»."]);
D("ab26","s10",[EAB],"Secondo l'esempio, il quadro elettrico generale va ubicato:",["In posizione segnalata, in particolare nei pressi dell'ingresso principale.","Nel locale più interno dell'attività.","Al piano interrato."]);

// --- Palestra
D("pa10","rtv",[EPA],"Il DM 18 marzo 1996 sugli impianti sportivi si applica integralmente quando è prevista la presenza di spettatori:",["In numero superiore a 100.","In numero superiore a 50.","In qualsiasi numero."]);
D("pa11","rtv",[EPA],"Per gli impianti sportivi con spettatori non superiori a 100 o privi di spettatori, il DM 18/3/1996 rinvia:",["Alle disposizioni dell'art. 20.","Al DM 10 marzo 1998.","Al DM 3 agosto 2015 per intero."]);
D("pa12","lav",[EPA],"Secondo l'art. 3 del DM 3/9/2021, per i luoghi di lavoro non a basso rischio e non coperti da regole tecniche si applicano i criteri:",["Del DM 3 agosto 2015.","Del DM 10 marzo 1998.","Del DM 18 marzo 1996."]);
D("pa13","s2",[EPA],"Nell'esempio della palestra (qf = 250 MJ/m², δq2 = 0,80, δn = 0,90 × 0,85), il qf,d del piano interrato è maggiore di quello dei piani fuori terra perché:",["δq1 vale 1,20 per la maggiore superficie del compartimento interrato.","Il carico d'incendio è doppio.","Manca la rivelazione."]);
D("pa14","s2",[EPA],"Nel compartimento multipiano con scale aperte e solai con adeguata capacità di compartimentazione, il carico d'incendio:",["Può essere considerato separatamente sui singoli piani.","Va sommato su tutti i piani.","Va considerato solo all'ultimo piano."]);
D("pa15","s4",[EPA],"Nell'esempio della palestra, il responsabile dell'attività dichiara un affollamento inferiore a quello calcolato e:",["Si impegna a rispettarlo in ogni condizione d'esercizio.","Non ha alcun obbligo successivo.","Deve ottenere una deroga."]);
D("pa16","s8",[EPA],"Nell'esempio della palestra, per un piano di 280 m² la superficie utile minima delle aperture di smaltimento (SE1) risulta:",["7 m² (280/40).","11,2 m² (280/25).","2,8 m² (280/100)."]);

// --- Deposito
D("de10","s2",[EDE],"Nella traccia del deposito, pur bastando R 30 per le strutture, la parete di separazione tra deposito combustibili e deposito infiammabili deve essere REI 120 perché:",["Il deposito infiammabili ha qf,d di circa 1772 MJ/m².","L'edificio supera i 24 m.","Lo impone la RTV uffici."]);
D("de11","s8",[EDE],"Nella traccia del deposito di 4400 m², la superficie minima di smaltimento SE1 (A/40) risulta:",["110 m².","176 m².","44 m²."]);
D("de12","s8",[EDE],"Nel verificare la distribuzione delle aperture di smaltimento, la traccia ricorda il raggio di influenza roffset pari in genere a:",["20 m.","50 m.","5 m."]);
D("de13","s7",[EDE],"Nella traccia, nel deposito di infiammabili il SENFC è previsto collegato all'IRAI e conforme alla norma:",["UNI 9494.","UNI 9795.","UNI 10779."]);
D("de14","s3",[EDE],"Nella traccia del deposito, la distanza di separazione calcolata con α = 3,1, β = 6,1 e p = 0,31 risulta circa:",["7,1 m.","3,1 m.","12,6 m."]);

// Blocco 31 – Manuali INAIL: «Prevenzione incendi per attività di autorimesse» (2023) e «per attività commerciali» (2024).
const IAU = "Manuale INAIL – Prevenzione incendi per attività di autorimesse (RTV V.6, 2023)";
const ICO = "Manuale INAIL – Prevenzione incendi per attività commerciali (RTV V.8, 2024)";

// --- Approccio prescrittivo e prestazionale
D("in10","codg",[IAU],"Secondo il manuale INAIL, il principale vantaggio dell'approccio prescrittivo è:",["L'agevole e omogenea applicazione e la ragionevole aspettativa di uniformità di giudizio dei controllori.","L'estrema flessibilità delle soluzioni.","La possibilità di simulare incendi complessi."]);
D("in11","codg",[IAU],"Secondo il manuale INAIL, il maggiore svantaggio dell'approccio prescrittivo è:",["L'estrema rigidità, che spesso obbliga a ricorrere alla deroga.","L'elevato onere computazionale.","La difficoltà di validare i modelli."]);
D("in12","codg",[IAU],"Secondo il manuale INAIL, tra i limiti dell'approccio prestazionale (FSE) ci sono:",["La validazione dei modelli di calcolo e la forte preparazione richiesta a progettisti e controllori.","L'impossibilità di simulare incendi complessi.","L'obbligo di ricorrere sempre alla deroga."]);
D("in13","fse",[IAU],"I modelli di campo, secondo il manuale INAIL, stimano l'evoluzione dell'incendio risolvendo numericamente:",["Le equazioni di Navier-Stokes.","Le equazioni di Bernoulli per i soli fluidi incomprimibili.","Le sole equazioni di bilancio energetico a due zone."]);
D("in14","fse",[IAU],"Prima del Codice, secondo il manuale INAIL, la Fire Safety Engineering in Italia era usata essenzialmente per:",["Attività non normate e istanze di deroga per dimostrare la sicurezza equivalente.","Tutte le attività soggette.","Solo per le attività di categoria A."]);

// --- DM 1/2/1986 e autorimesse
D("in20","rtv",[IAU],"Secondo il DM 1 febbraio 1986, un'autorimessa è di tipo «isolato» quando:",["È situata in edificio esclusivamente destinato a tale uso, eventualmente adiacente ad altri, strutturalmente e funzionalmente separato.","Dista almeno 100 m da altri edifici.","Ha meno di nove autoveicoli."]);
D("in21","rtv",[IAU],"Secondo il DM 1/2/1986, un'autorimessa è «aperta» se le aperture perimetrali su spazio a cielo libero realizzano un'aerazione permanente:",["Non inferiore al 60% della superficie delle pareti e comunque superiore al 15% della superficie in pianta.","Non inferiore al 25% della superficie in pianta.","Non inferiore a 1/30 della superficie in pianta."]);
D("in22","rtv",[IAU],"Secondo il DM 1/2/1986, un'autorimessa con piano di parcamento sotto quota è considerata «fuori terra» se l'intradosso del solaio supera il piano di riferimento di almeno:",["0,6 m, con aperture di aerazione alte almeno 0,5 m.","2 m, con aperture alte almeno 1 m.","0,3 m, senza altri requisiti."]);
D("in23","rtv",[IAU],"Secondo il DM 1/2/1986, un'autorimessa «sorvegliata» è quella:",["Provvista di sistemi automatici di controllo antincendio o di vigilanza continua almeno durante l'orario di apertura.","Con custode residente nell'edificio.","Con meno di 50 posti auto."]);
D("in24","rtv",[IAU],"Secondo il manuale INAIL, la superficie complessiva dell'autorimessa (soglia dei 300 m²) è:",["La superficie lorda al netto delle pertinenze compartimentate: somma di aree TA, TB e TM1 non compartimentate.","La superficie dell'intero edificio.","La sola superficie dei posti auto."]);
D("in25","rtv",[IAU],"Nella RTV V.6 le aree di minuta manutenzione dei veicoli (TB) devono avere superficie non superiore:",["Al 30% del compartimento ed essere collocate a quota superiore a −6 m.","Al 50% del compartimento, a qualsiasi quota.","A 25 m²."]);
D("in27","rtv",[IAU],"Secondo il manuale INAIL, si può ancora applicare il DM 1/2/1986 a un ampliamento di autorimessa esistente quando:",["L'applicazione del Codice alla nuova porzione determinerebbe incompatibilità con le porzioni esistenti non interessate.","Lo decide il titolare senza motivazione.","L'autorimessa è sotto i 300 m²."]);
D("in28","proc",[IAU],"Secondo la circolare 3277/2016 richiamata dal manuale INAIL, la deroga è proponibile solo se:",["Esiste una regola tecnica ufficiale da derogare e si individuano misure che garantiscono sicurezza equivalente.","Esiste una linea guida o una guida tecnica.","L'attività è di categoria A."]);
D("in29","proc",[IAU],"Secondo il manuale INAIL, non è possibile chiedere la deroga a:",["Linee guida, linee di indirizzo e guide tecniche.","Regole tecniche verticali.","Regole tecniche tradizionali."]);
D("in30","rtv",[IAU],"Nel caso studio INAIL, la deroga al DM 1/2/1986 riguardava tra l'altro scale/ascensori REI 90 invece di REI 120 e larghezza delle uscite di 0,90 m invece di:",["1,20 m (due moduli).","1,80 m.","0,80 m."]);
D("in31","rtv",[IAU],"Secondo il manuale INAIL, rispetto al GPL, le auto alimentate a metano:",["Non sono soggette a limitazioni, perché il metano tende a salire e non si accumula in basso.","Sono vietate nei piani interrati.","Hanno lo stesso rischio di accumulo a pavimento."]);
D("in32","rtv",[IAU],"Secondo il manuale INAIL, per le auto elettriche una criticità specifica è che:",["La combustione delle batterie agli ioni di litio può manifestarsi anche in modo differito, anche dopo giorni.","Non possono mai incendiarsi.","Producono solo incendi di classe A."]);

// --- Attività commerciali: DM 27/7/2010 e caso studio
D("in40","rtv",[ICO],"Secondo il DM 27/7/2010 richiamato dal manuale INAIL, la densità di affollamento nelle aree di vendita del settore non alimentare è:",["0,2 persone/m².","0,4 persone/m².","0,7 persone/m²."]);
D("in41","rtv",[ICO],"Secondo il DM 27/7/2010, nelle aree di vendita del settore alimentare o misto fino a 2500 m² la densità di affollamento è:",["0,4 persone/m².","0,2 persone/m².","1,2 persone/m²."]);
D("in42","rtv",[ICO],"Secondo il DM 27/7/2010, per le aree di ristorazione delle attività commerciali la densità di affollamento è:",["0,7 persone/m².","0,4 persone/m².","2 persone/m²."]);
D("in43","rtv",[ICO],"Nei centri commerciali (DM 27/7/2010), per le parti comuni frequentate dal pubblico la densità di affollamento è non inferiore a:",["0,2 persone/m².","0,1 persone/m².","0,7 persone/m²."]);
D("in44","rtv",[ICO],"Secondo il DM 27/7/2010, se l'affollamento delle aree di ristorazione supera 200 persone:",["Almeno la metà delle uscite di emergenza deve immettere direttamente all'esterno o su luogo sicuro dinamico.","Serve un impianto sprinkler dedicato.","Va presentata istanza di deroga."]);
D("in45","rtv",[ICO],"Secondo il DM 27/7/2010, per aree temporanee per mostre o intrattenimento con capienza oltre 100 persone si considera una densità di:",["1,2 persone/m², in aggiunta all'affollamento delle superfici di vendita.","0,4 persone/m².","0,2 persone/m²."]);
D("in46","rtv",[ICO],"Secondo il DM 27/7/2010, la capacità di deflusso per locali con pavimento a quota compresa tra ±1 m dal piano di riferimento non deve superare:",["50.","37,5.","33."]);
D("in47","rtv",[ICO],"La RTV V.8 si applica alle attività commerciali con superficie lorda, comprensiva di servizi, depositi e spazi comuni coperti, superiore a:",["400 m².","200 m².","1000 m²."]);
D("in48","rtv",[ICO],"Nel caso studio INAIL, un centro commerciale con A > 10000 m² e piani tra −5 m e 12 m è classificato:",["AE e HB.","AC e HA.","AD e HC."]);
D("in49","fse",[ICO],"Nel caso studio INAIL del centro commerciale, la soluzione alternativa con FSE ha mostrato che:",["Non era possibile posizionare un'autovettura nel portico al piano terra senza compromettere la salvaguardia della vita.","Lo sprinkler nella mall era superfluo in ogni caso.","Le vie d'esodo erano sovradimensionate del 50%."]);
D("in50","fse",[ICO],"Nel caso studio INAIL, la GSA risulta fondamentale anche per garantire:",["La disponibilità superiore degli impianti di controllo dell'incendio ipotizzata in progetto.","L'esonero dal rinnovo periodico.","La riduzione del carico d'incendio a zero."]);

    let sess = s.sess || null;
    if (sess) {
      sess.label = label(sess);
      sess.items = (sess.items || []).filter(i => byId[i.id]);
      if (!sess.items.length) sess = null;     // niente da riprendere né da correggere
      else sess.cur = Math.min(Math.max(0, sess.cur || 0), sess.items.length - 1);
    }
    return { stats: s.stats || {}, hist, sess, upd: s.upd || 0, azz: s.azz || 0 };
  }

  // unisce la copia del dispositivo e quella online, così un test fatto senza rete
  // non cancella quelli fatti nel frattempo su un altro dispositivo
  function merge(a, b) {
    const newer = (a.upd || 0) >= (b.upd || 0) ? a : b, older = newer === a ? b : a;
    if ((newer.azz || 0) > (older.upd || 0)) return newer;          // azzerato dopo l'ultima modifica dell'altra copia
    const seen = new Set(), hist = [];
    [...newer.hist, ...older.hist].forEach(h => {
      const k = h.t + "|" + h.mode + "|" + h.tot;
      if (h.t > (newer.azz || 0) && !seen.has(k)) { seen.add(k); hist.push(h); }
    });
    hist.sort((x, y) => y.t - x.t);
    hist.length = Math.min(hist.length, STORICO_MAX);
    const stats = (older.azz || 0) >= (newer.azz || 0) ? { ...older.stats } : {};   // l'altra copia aveva visto l'azzeramento
    Object.entries(newer.stats).forEach(([id, st]) => { const o = stats[id]; if (!o || st.n >= o.n) stats[id] = st; });
    return { stats, hist, sess: newer.sess, upd: Math.max(a.upd || 0, b.upd || 0), azz: Math.max(a.azz || 0, b.azz || 0) };
  }
  const same = (a, b) => JSON.stringify([a.stats, a.hist, a.sess, a.azz]) === JSON.stringify([b.stats, b.hist, b.sess, b.azz]);
  const isEmpty = d => !d.hist.length && !d.sess && !Object.keys(d.stats).length;

  let utente = jsonOr(lsGet(K_UTENTE), null);           // { id, nome } oppure null
  if (utente && !(utente.id && utente.nome)) utente = null;
  let db = utente ? parseDb(jsonOr(lsGet(K_DATI(utente.id)), {})) : parseDb({});
  const legacy = () => { const d = parseDb(jsonOr(lsGet(KEY), {})); return isEmpty(d) ? null : d; };   // dati di prima del login

  // stato del salvataggio online: "off" (non ancora), "sync", "ok", "offline"
  const net = { state: "off", timer: null, busy: false, again: false };

  async function remoteGet(id) {
    const r = await fetch(FS_DOC + id, { cache: "no-store" });
    if (r.status === 404) {
      const j = await r.json().catch(() => ({}));
      // documento inesistente = nome nuovo; database non creato = errore
      if (/does not exist/i.test((j.error && j.error.message) || "")) throw new Error("database");
      return null;
    }
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const f = j.fields || {};
    return { nome: f.nome && f.nome.stringValue, dati: jsonOr(f.dati && f.dati.stringValue, {}) };
  }
  async function remotePut() {
    if (!utente) return;
    let dati = JSON.stringify(db);
    for (let i = db.hist.length - 1; dati.length > 850000 && i >= 0; i--) {
      if (db.hist[i].items) { db.hist[i].items = null; dati = JSON.stringify(db); }
    }
    const r = await fetch(FS_DOC + utente.id, {
      method: "PATCH", headers: { "content-type": "application/json" },
      body: JSON.stringify({ fields: { nome: { stringValue: utente.nome }, dati: { stringValue: dati }, agg: { timestampValue: new Date().toISOString() } } }),
    });
    if (!r.ok) throw new Error("http " + r.status);
  }
  function setNet(st) {
    net.state = st;
    const el = document.getElementById("netst");
    if (el) { el.className = "netst " + st; el.textContent = NET_LABEL[st]; }
  }
  const NET_LABEL = { off: "", sync: "salvataggio…", ok: "salvato online", offline: "non connesso · salvato sul dispositivo" };

  // invio online, uno alla volta; le modifiche arrivate nel frattempo partono subito dopo
  async function push() {
    clearTimeout(net.timer); net.timer = null;
    if (!utente) return;
    if (net.busy) { net.again = true; return; }
    net.busy = true; setNet("sync");
    try { await remotePut(); setNet("ok"); } catch (e) { setNet("offline"); }
    net.busy = false;
    if (net.again) { net.again = false; push(); }
  }
  function save() {
    db.upd = Date.now();
    if (!utente) return;
    lsSet(K_DATI(utente.id), JSON.stringify(db));
    clearTimeout(net.timer);
    net.timer = setTimeout(push, 1500);
  }

  // allinea con la copia online: vince la più recente
  async function pull() {
    if (!utente) return;
    const id = utente.id;
    try {
      const r = await remoteGet(id);
      if (!utente || utente.id !== id) return;
      if (!r) return push();
      const remoto = parseDb(r.dati), unito = merge(db, remoto);
      if (!same(unito, db)) {
        db = unito;
        lsSet(K_DATI(id), JSON.stringify(db));
        if (!(ui.view === "quiz" && ui.confirm)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
      }
      if (!same(unito, remoto)) push(); else setNet("ok");
    } catch (e) { setNet("offline"); }
  }
  window.addEventListener("online", () => { if (utente) pull(); });
  document.addEventListener("visibilitychange", () => {
    if (!utente) return;
    if (document.visibilityState === "hidden") { if (net.timer) push(); }
    else pull();
  });

  async function login(nome, importa) {
    nome = nome.trim().replace(/\s+/g, " ").slice(0, 40);
    const id = slug(nome);
    if (!id) return;
    let remoto, errore = false;
    try { remoto = await remoteGet(id); } catch (e) { errore = true; }
    const locale = parseDb(jsonOr(lsGet(K_DATI(id)), {}));
    utente = { id, nome: remoto && remoto.nome ? remoto.nome : nome };
    const online = remoto ? parseDb(remoto.dati) : null;
    db = online ? merge(locale, online) : locale;
    const vecchi = importa ? legacy() : null;
    if (vecchi && isEmpty(db)) { db = vecchi; db.upd = Date.now(); lsDel(KEY); }   // risultati di prima del login portati nel nuovo account
    lsSet(K_UTENTE, JSON.stringify(utente));
    const nomi = jsonOr(lsGet(K_NOMI), []).filter(n => slug(n) !== id);
    lsSet(K_NOMI, JSON.stringify([utente.nome, ...nomi].slice(0, 6)));
    lsSet(K_DATI(id), JSON.stringify(db));
    // senza rete non si sovrascrive la copia online: ci pensa pull() quando torna la connessione
    if (errore) setNet("offline");
    else if (!online || !same(db, online)) push();
    else setNet("ok");
    ui.view = "home"; avvio();
  }
  async function logout() {
    while (net.busy) await new Promise(r => setTimeout(r, 100));
    if (net.timer) await push();
    utente = null; db = parseDb({}); lsDel(K_UTENTE); setNet("off");
    go("login");
  }

  // =====================================================================
  // Utilità
  // =====================================================================
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const dateIt = t => { const d = new Date(t); return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }); };
  const pct = (ok, n) => n ? Math.round(ok / n * 100) : 0;
  const rifai = n => n === 1 ? "Rifai la domanda sbagliata" : `Rifai le ${n} sbagliate`;
  const pctCls = p => p >= 80 ? "hi" : p >= 60 ? "mid" : "low";
  const topicName = k => ARGOMENTI[k].nome;

  const isRight = it => it.ans !== null && it.order[it.ans] === byId[it.id].c;
  const lastResult = id => { const x = db.stats[id]; return !x ? "na" : x.last === 1 ? "ok" : "ko"; };
  const wrongIds = () => Object.entries(db.stats).filter(([id, s]) => byId[id] && s.last === 0).map(([id]) => id);

  function makeItems(ids) {
    return ids.map(id => {
      const d = byId[id], idx = d.o.map((_, i) => i);
      return { id, order: d.fix ? idx : shuffle(idx), ans: null, flag: false };
    });
  }

  function topicStats() {
    const out = {};
    Object.entries(db.stats).forEach(([id, s]) => {
      const d = byId[id]; if (!d) return;
      const t = out[d.s] || (out[d.s] = { n: 0, ok: 0 });
      t.n += s.n; t.ok += s.ok;
    });
    return out;
  }

  // =====================================================================
  // Pezzi di interfaccia riutilizzati
  // =====================================================================
  const ICON_PDF = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/><path d="M6 9h5M6 11.5h5"/></svg>`;
  const pdfUrl = (fid, pg) => `materiale/${fid}.pdf${pg ? "#page=" + pg : ""}`;
  const pdfLink = (fid, pg, label) => `<a class="matlink" href="${pdfUrl(fid, pg)}" target="_blank" rel="noopener">${ICON_PDF}${esc(label)}</a>`;

  // link a tutti i PDF di una fonte (uno o più file)
  function sourceLinks(src) {
    const ids = MAT[src] || [];
    return ids.map(fid => pdfLink(fid, 0, ids.length > 1 ? (TIT[fid] || "Apri il PDF") : "Apri il PDF")).join("");
  }

  // «Ripassa sulla scheda» (pagina più pertinente) e, se richiesto, link alla scheda argomento
  function ripassa(d, withTopic) {
    const p = PAG[d.id];
    let h = p ? pdfLink(p[0], p[1], "Ripassa sulla scheda" + (p[1] ? " · pag. " + p[1] : "")) : "";
    if (withTopic) h += `<button class="linkbtn small" data-tv="${d.s}">${p ? "Tutto l'argomento" : "Ripassa l'argomento: domande e materiale"} →</button>`;
    return h ? `<div class="row small">${h}</div>` : "";
  }

  // corpo di una domanda con la risposta corretta (correzione, scheda argomento, archivio)
  function answerBlock(d, { your = null, meta = null, topicLink = false } = {}) {
    return `<p>${esc(d.q)}</p>
      ${your !== null ? `<p class="ans your">✗ Tua risposta: ${esc(your)}</p>` : ""}
      <p class="ans good">✓ ${esc(d.o[d.c])}</p>
      ${d.dubbia ? `<div class="note"><strong>Risposta da verificare.</strong> ${esc(d.n || "")}</div>` : ""}
      <p class="small muted">${meta !== null ? meta : "Fonte: " + esc(d.f.join(", "))}</p>
      ${ripassa(d, topicLink)}`;
  }

  // barra di navigazione fissa in basso
  const NAV_ICON = {
    home: '<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3 0-5 1-7.5z"/>',
    risultati: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    archivio: '<path d="M4 5h16M4 12h16M4 19h10"/>',
  };
  function tabs(cur) {
    const t = [["home", "Allenamento"], ["risultati", "Risultati", db.hist.length], ["archivio", "Archivio"]];
    return `<nav class="nav" aria-label="Sezioni"><div>${t.map(([k, l, n]) =>
      `<button data-nav="${k}" ${k === cur ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON[k]}</svg>${l}${n ? `<span class="cnt">${n}</span>` : ""}</button>`).join("")}</div></nav>`;
  }

  // scrive la vista e adatta il margine inferiore a barre e pannelli fissi
  function paint(html) {
    app.innerHTML = html;
    app.classList.toggle("has-nav", !!app.querySelector(".nav"));
    app.classList.toggle("has-bar", !!app.querySelector(".actbar"));
    app.classList.toggle("has-sheet", !!app.querySelector(".sheet"));
  }

  // barre «risposte corrette per argomento», dalla più debole; ogni barra apre la scheda argomento
  function barsHtml(stats, right) {
    return `<div class="bars">${Object.entries(stats).filter(([, v]) => v.n)
      .sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n)
      .map(([k, v]) => {
        const q = pct(v.ok, v.n), cls = q >= 80 ? "" : q >= 60 ? "mid" : "low";
        return `<button class="bar" data-tv="${k}" aria-label="${esc(topicName(k))}: apri domande e materiale"><span class="nm">${esc(topicName(k))}</span><span class="pct">${right(v, q)} ›</span><div class="track"><div class="fill ${cls}" style="width:${q}%"></div></div></button>`;
      }).join("")}</div>`;
  }

  const confirmBox = (text, yesAct, yesLabel, noAct, noLabel) =>
    `<div class="confirm" role="alertdialog"><span>${text}</span><div class="row"><button class="btn primary" data-act="${yesAct}">${yesLabel}</button><button class="btn ghost" data-act="${noAct}">${noLabel}</button></div></div>`;

  // =====================================================================
  // Stato dell'interfaccia e navigazione
  // =====================================================================
  const ui = {
    view: utente ? "home" : "login",
    allTopics: false, discardAsk: false,                  // allenamento
    showGrid: false, confirm: false,                      // quiz
    filter: "ko",                                         // correzione
    hIdx: null, resetAsk: false,               // risultati
    tk: null, tf: "auto", prev: "home",                   // scheda argomento
    q: "",                                                // archivio
  };
  let timerH = null;
  let onClick = null;   // gestore dei pulsanti della vista corrente (impostato da ogni render*)

  function go(view) { ui.view = view; ui.resetAsk = false; ui.discardAsk = false; render(); }
  function openTopic(k) {
    if (ui.view !== "argomento") ui.prev = ui.view;
    ui.tk = k; ui.tf = "auto"; go("argomento");
  }

  function render() {
    clearInterval(timerH);
    const sess = db.sess;
    if (!utente) { ui.view = "login"; renderLogin(); }
    else if (ui.view === "quiz" && sess && !sess.done) renderQuiz();
    else if (ui.view === "result" && sess) renderResult(sess, false);
    else if (ui.view === "dettaglio" && db.hist[ui.hIdx] && db.hist[ui.hIdx].items) renderResult(histSess(db.hist[ui.hIdx]), true);
    else if (ui.view === "risultati") renderRisultati();
    else if (ui.view === "argomento" && ARGOMENTI[ui.tk]) renderTopic();
    else if (ui.view === "archivio") renderArchive();
    else { ui.view = "home"; renderHome(); }
    try { window.scrollTo(0, 0); } catch (e) { /* ignorato */ }
  }

  // un solo gestore dei clic per tutta l'app
  app.addEventListener("click", e => {
    const a = e.target.closest("a.matlink, a.matcard");
    if (a) {
      const m = (a.getAttribute("href") || "").match(/^materiale\/([^.]+)\.pdf(?:#page=(\d+))?/);
      if (m) { e.preventDefault(); openPdf(m[1], m[2] ? +m[2] : 1); }
      return;
    }
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.nav) return go(b.dataset.nav);
    if (b.dataset.tv) return openTopic(b.dataset.tv);
    if (onClick) onClick(b);
  });

  // =====================================================================
  // Sessioni: simulazione, esercitazione, consegna
  // =====================================================================
  function startSession(mode, ids, label) {
    if (!ids.length) return;
    const now = Date.now();
    db.sess = { mode, label, items: makeItems(ids), cur: 0, start: now, end: mode === "esame" ? now + ESAME_MIN * 60000 : null, done: false };
    ui.confirm = false; ui.showGrid = false;
    save(); go("quiz");
  }
  const startExam = () => startSession("esame", shuffle(DOMANDE.map(d => d.id)).slice(0, ESAME_N), "Simulazione d'esame");
  const startPractice = (ids, label) => startSession("pratica", shuffle(ids), label);

  function finish() {
    const s = db.sess;
    if (!s || s.done) return;
    s.done = true;
    s.stop = s.end ? Math.min(Date.now(), s.end) : Date.now();   // una simulazione scaduta si ferma al limite
    const counted = s.mode === "esame" ? s.items : s.items.filter(i => i.ans !== null);
    counted.forEach(it => {
      const st = db.stats[it.id] || { n: 0, ok: 0, last: null };
      st.n++;
      if (isRight(it)) { st.ok++; st.last = 1; } else st.last = 0;
      db.stats[it.id] = st;
    });
    if (counted.length) {
      db.hist.unshift({
        t: s.start, mode: s.mode, label: s.label,
        ok: counted.filter(isRight).length, tot: counted.length, secs: Math.round((s.stop - s.start) / 1000),
        items: s.items.map(i => [i.id, i.order, i.ans]),
      });
      db.hist.length = Math.min(db.hist.length, STORICO_MAX);
    }
    ui.filter = "ko";
    save(); go("result");
  }

  // ricostruisce una sessione conclusa dallo storico (salta le domande non più presenti)
  function histSess(h) {
    const items = h.items.filter(x => byId[x[0]]).map(x => ({ id: x[0], order: x[1], ans: x[2], flag: false }));
    return { mode: h.mode, label: h.label, items, start: h.t, stop: h.t + h.secs * 1000, done: true };
  }

  // =====================================================================
  // Vista: Accesso con il solo nome
  // =====================================================================

  // =====================================================================
  // Vista: Allenamento (cruscotto)
  // =====================================================================
  function renderHome() {
    const tot = DOMANDE.length;
    const wrong = wrongIds();
    const sess = db.sess && !db.sess.done ? db.sess : null;
    const sims = db.hist.filter(h => h.mode === "esame").slice(0, 3);
    const media = sims.length ? Math.round(sims.reduce((a, h) => a + h.ok / h.tot, 0) / sims.length * 100) : null;
    const mediaOk = sims.length ? Math.round(sims.reduce((a, h) => a + h.ok, 0) / sims.length) : 0;
    const ultima = sims[0];

    const ts = topicStats();
    const rows = Object.keys(ARGOMENTI).map(k => ({ k, st: ts[k], p: ts[k] ? pct(ts[k].ok, ts[k].n) : null }))
      .sort((a, b) => (a.p === null) - (b.p === null) || (a.p ?? 0) - (b.p ?? 0) || (COUNT[b.k] || 0) - (COUNT[a.k] || 0));

        <span class="eyebrow">Corso base 120 ore · D.M. 5 agosto 2011</span>

        <div class="userbar"><span class="avatar" aria-hidden="true">${esc(utente.nome.trim()[0] || "?").toUpperCase()}</span><span class="un"><strong>${esc(utente.nome)}</strong><span id="netst" class="netst ${net.state}">${NET_LABEL[net.state]}</span></span><button class="linkbtn small" data-act="logout">Cambia nome</button></div>
