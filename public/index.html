<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2124">
<meta name="description" content="Quiz per l'esame da professionista antincendio (corso base 120 ore, D.M. 5/8/2011)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23c4161c%27 d=%27M12 2c2.5 3.5 6 6 6 11a6 6 0 0 1-12 0c0-2.5 1.2-4.3 2.4-5.4 0 2.4 1.2 3.6 2.4 3.6 0-3.6 0-6 1.2-9.2z%27/%3E%3C/svg%3E">
<title>Quiz Professionista Antincendio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: colonna unica centrata (max 760px); barra di navigazione fissa in basso; nel quiz comandi fissi in basso e correzione in un pannello che sale dal basso; visore PDF a schermo intero. */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --surface-2: #e4e9e7;
  --line: #cfd7d4;
  --fg: #1a2124;
  --muted: #5a666a;
  --accent: #c4161c;      /* rosso segnaletica antincendio */
  --accent-ink: #ffffff;
  --accent-soft: #fbe5e5;
  --ok: #0b7a46;          /* verde segnaletica di esodo */
  --ok-soft: #dff1e7;
  --ko: #b3261e;
  --ko-soft: #f9e1df;
  --warn: #8a5a00;
  --warn-soft: #fbefd3;
  --focus: #1d5fd1;
  --ink-bg: #1a2124; --ink-fg: #ffffff; --ink-muted: #b9c4c7; --ink-track: #3a454a; --ink-ring: #4fd18b;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121618; --surface: #1b2124; --surface-2: #242c30; --line: #34404a;
    --fg: #e6ecee; --muted: #9aa8ad; --accent: #ff4d4f; --accent-ink: #1a0b0b; --accent-soft: #3a1c1d;
    --ok: #4fd18b; --ok-soft: #17342a; --ko: #ff7a70; --ko-soft: #3b1f1d; --warn: #f2c25c; --warn-soft: #3a2f16; --focus: #7fb0ff;
    --ink-bg: #242c30; --ink-track: #3a454a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121618; --surface: #1b2124; --surface-2: #242c30; --line: #34404a;
  --fg: #e6ecee; --muted: #9aa8ad; --accent: #ff4d4f; --accent-ink: #1a0b0b; --accent-soft: #3a1c1d;
  --ok: #4fd18b; --ok-soft: #17342a; --ko: #ff7a70; --ko-soft: #3b1f1d; --warn: #f2c25c; --warn-soft: #3a2f16; --focus: #7fb0ff;
  --ink-bg: #242c30; --ink-track: #3a454a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Testata */
.mast { display: flex; flex-direction: column; gap: 6px; padding-bottom: 18px; border-bottom: 3px solid var(--accent); margin-bottom: 22px; }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Riquadri */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.exam { border-color: var(--accent); border-width: 2px; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; }
.fact b { display: block; font-family: var(--font-display); font-size: 2rem; line-height: 1; font-weight: 700; }
.fact span { font-size: .8rem; color: var(--muted); }

/* Selezione argomenti e controlli segmentati */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; min-height: 40px; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }

/* Navigazione in basso */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav > div { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nav button { border: 0; background: none; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .75rem; font-weight: 500; color: var(--muted); position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.nav .cnt { position: absolute; top: 5px; left: calc(50% + 9px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--surface-2); color: var(--fg); font-family: var(--font-mono); font-size: .68rem; display: grid; place-items: center; }
.wrap.has-nav { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.wrap.has-bar { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.wrap.has-sheet { padding-bottom: 380px; }

/* Pagina iniziale: cruscotto */
.hero { background: var(--ink-bg); color: var(--ink-fg); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.hero .top { display: flex; align-items: center; gap: 16px; }
.hero .ring { width: 88px; height: 88px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.hero .ring > span { width: 70px; height: 70px; border-radius: 50%; background: var(--ink-bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; }
.hero .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hero .txt small { font-size: .82rem; color: var(--ink-muted); }
.hero .txt b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; line-height: 1.1; }
.hero-cta { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 54px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1rem; }
.hero-cta small { font-family: var(--font-mono); font-size: .76rem; opacity: .9; }
.hero-cta span { text-align: left; }
.hero-cta small { white-space: nowrap; }
.btn svg { width: 20px; height: 20px; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 88px; display: flex; flex-direction: column; gap: 3px; }
.tile:hover:not(:disabled) { border-color: var(--muted); }
.tile:disabled { opacity: .55; cursor: default; }
.tile b { font-family: var(--font-display); font-size: 1.8rem; line-height: 1; }
.tile span { font-size: .88rem; font-weight: 600; }
.tile small { font-size: .78rem; color: var(--muted); }
.tlist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; text-align: left; width: 100%; min-height: 58px; border: 0; border-bottom: 1px solid var(--surface-2); background: none; padding: 10px 14px; }
.trow:last-child { border-bottom: 0; }
.trow:hover { background: var(--surface-2); }
.trow .nm { font-size: .92rem; font-weight: 500; }
.trow .pc { font-family: var(--font-mono); font-size: .78rem; white-space: nowrap; }
.trow .pc.hi { color: var(--ok); } .trow .pc.mid { color: var(--warn); } .trow .pc.low { color: var(--ko); } .trow .pc.na { color: var(--muted); }
.trow .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.trow .track i { display: block; height: 100%; }
.trow .track i.hi { background: var(--ok); } .trow .track i.mid { background: var(--warn); } .trow .track i.low { background: var(--ko); }

/* Barre per argomento (cliccabili) */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: .86rem;
  width: 100%; border: 0; background: none; padding: 6px 4px; margin: -2px -4px; border-radius: 6px; text-align: left; box-sizing: content-box; }
.bar:hover { background: var(--surface-2); }
.bar .nm { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.bar:hover .nm { text-decoration-color: var(--fg); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ok); }
.bar .fill.mid { background: var(--warn); }
.bar .fill.low { background: var(--ko); }

/* Storico dei test */
.hlist { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 10px 0; overflow: hidden; text-align: left; width: 100%; }
button.hrow:hover { border-color: var(--muted); }
.hrow .stripe { align-self: stretch; margin: -10px 0; background: var(--line); }
.hrow .stripe.hi { background: var(--ok); } .hrow .stripe.mid { background: var(--warn); } .hrow .stripe.low { background: var(--ko); }
.hrow .sc { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.hrow .sc small { display: block; font-family: var(--font-mono); font-size: .74rem; font-weight: 500; color: var(--muted); margin-top: 3px; }
.tag { font-family: var(--font-mono); font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); }
.tag.exam { background: var(--accent-soft); color: var(--accent); }

/* Materiale di riferimento */
.matlink { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 6px; padding: 5px 10px; min-height: 34px; font-size: .84rem; background: var(--surface); }
.matlink:hover { background: var(--accent-soft); }
.matlink svg { width: 15px; height: 15px; flex: none; }
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mitem .files { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.st { font-family: var(--font-mono); font-size: .72rem; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.st.ok { background: var(--ok-soft); color: var(--ok); } .st.ko { background: var(--ko-soft); color: var(--ko); } .st.na { background: var(--surface-2); color: var(--muted); }

/* Quiz */
.qhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 8px 0 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.qhead .row { flex-wrap: nowrap; }
.qhead .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qhead .who .eyebrow, .qhead .who strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; place-items: center; flex: none; color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 1.15rem; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.strip { display: grid; gap: 2px; height: 6px; }
.strip i { border-radius: 1px; background: var(--surface-2); }
.strip i.d { background: var(--fg); } .strip i.f { background: var(--warn); } .strip i.ok { background: var(--ok); } .strip i.ko { background: var(--ko); }
.strip i.c { background: var(--accent); }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--fg); transition: width .2s; }
.qcard { display: flex; flex-direction: column; gap: 16px; }
.qtag { align-self: flex-start; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.qtext { font-size: 1.15rem; font-weight: 500; line-height: 1.5; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); line-height: 1.45; min-height: 56px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .let { font-family: var(--font-mono); font-weight: 600; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font-size: .85rem; }
.opt.sel { border-color: var(--fg); background: var(--surface-2); }
.opt.sel .let { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .let { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--ko); background: var(--ko-soft); }
.opt.wrong .let { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.opt:disabled { cursor: default; }
.note { border-radius: 8px; padding: 10px 12px; font-size: .88rem; background: var(--warn-soft); color: var(--fg); border-left: 4px solid var(--warn); }
/* barra comandi e pannelli dal basso */
.actbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.actbar > div, .sheet > div { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.actbar > div { display: flex; gap: 8px; align-items: center; }
.actbar .btn { min-height: 52px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.actbar .iconbtn { width: 52px; height: 52px; border-radius: 12px; }
.actbar .grow { flex: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 28px rgba(0, 0, 0, .18); max-height: 75vh; overflow-y: auto; }
.sheet > div { padding-top: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet .grip { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet .vhead { display: flex; align-items: center; gap: 10px; font-size: 1.08rem; font-weight: 600; }
.vicon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.vicon svg { width: 18px; height: 18px; }
.vicon.ok { background: var(--ok-soft); color: var(--ok); } .vicon.ko { background: var(--ko-soft); color: var(--ko); }
.sheet .row .btn { min-height: 52px; border-radius: 12px; }
.matcard { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); text-decoration: none; color: var(--fg); }
.matcard:hover { border-color: var(--muted); }
.matcard .doc { width: 40px; height: 48px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); flex: none; }
.matcard .doc svg { width: 20px; height: 20px; }
.matcard .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.matcard .t small { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.ko { color: var(--ko); }
.flag[aria-pressed="true"] { border-color: var(--warn); background: var(--warn-soft); color: var(--fg); }

.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.qgrid button { height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-family: var(--font-mono); font-size: .82rem; position: relative; }
.qgrid button.done { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.qgrid button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qgrid button.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.qgrid button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--fg); }
.qgrid button.ko { background: var(--ko-soft); border-color: var(--ko); color: var(--fg); }
.qgrid button.na { background: var(--surface-2); color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }

.confirm { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* Risultati */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-family: var(--font-display); font-size: 4rem; line-height: .9; font-weight: 700; font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ritem.ok { border-left-color: var(--ok); }
.ritem.ko { border-left-color: var(--ko); }
.ritem.na { border-left-color: var(--muted); }
.ans { font-size: .9rem; }
.ans.your { color: var(--ko); }
.ans.good { color: var(--ok); font-weight: 500; }

/* Archivio */
.login { max-width: 460px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.login form label { display: flex; }
.userbar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.userbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 600; flex: none; }
.userbar .un { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.userbar .un strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.netst { font-size: .76rem; color: var(--muted); }
.netst.ok { color: var(--ok); }
.netst.offline { color: var(--warn); }
.search { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; min-height: 44px; }
details.topic { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.topic > summary { padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
details.topic > summary::-webkit-details-marker { display: none; }
details.topic > summary::after { content: "+"; margin-left: auto; font-family: var(--font-mono); color: var(--muted); }
details.topic[open] > summary::after { content: "−"; }
.alist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.aitem { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.aitem:last-child { border-bottom: 0; }

.footer { margin-top: 28px; font-size: .8rem; color: var(--muted); }

/* Visore PDF interno */
.pv { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: var(--bg); }
.pv.open { display: flex; }
.pv-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pv-title { flex: 1 1 200px; min-width: 0; font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-bar button, .pv-bar a { min-height: 40px; min-width: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; font-size: .85rem; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.pv-bar button:disabled { opacity: .4; }
.pv-pg { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); white-space: nowrap; }
.pv-body { flex: 1; overflow: auto; padding: 12px; display: flex; justify-content: center; align-items: flex-start; -webkit-overflow-scrolling: touch; }
.pv-body canvas { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.25); max-width: none; }
.pv-msg { margin: 40px auto; max-width: 420px; text-align: center; color: var(--muted); line-height: 1.5; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

D("j01","ist",[G16,G21],"Ai sensi dell'art. 1 del D.Lgs. 139/2006, il Corpo nazionale dei Vigili del fuoco è:",["Una struttura dello Stato ad ordinamento civile, incardinata nel Ministero dell'interno – Dipartimento dei vigili del fuoco, del soccorso pubblico e della difesa civile.","Una struttura dello Stato ad ordinamento militare, incardinata nel Ministero della difesa.","Un ente pubblico economico vigilato dalla Presidenza del Consiglio dei ministri."]);
D("j02","ist",[G16],"Rispetto al servizio nazionale di protezione civile, il Corpo nazionale dei Vigili del fuoco:",["Ne è componente fondamentale.","Ne è un organo esterno con funzioni solo consultive.","Interviene solo su richiesta delle Regioni."]);
D("j03","ist",[G16,G21],"Gli obiettivi primari della prevenzione incendi sono:",["Sicurezza della vita umana, incolumità delle persone, tutela dei beni e dell'ambiente.","Sicurezza della vita umana, continuità produttiva e contenimento dei costi assicurativi.","Esclusivamente la sicurezza dei lavoratori nei luoghi di lavoro."]);
D("j04","ist",[G16,G21],"Quale dei seguenti è uno degli obiettivi da raggiungere progettando, realizzando e gestendo un'attività secondo il Codice?",["Tutelare gli edifici pregevoli per arte o storia.","Garantire l'assenza di qualsiasi danno ai beni contenuti.","Ridurre i premi assicurativi dell'attività."]);
D("j05","ist",[G16,G21],"Tra gli obiettivi della progettazione antincendio, «garantire la stabilità delle strutture portanti» va inteso:",["Per un periodo di tempo determinato.","Per tutta la durata dell'incendio, qualunque essa sia.","Solo fino all'arrivo delle squadre di soccorso."]);
D("j06","ist",[G16,G21],"Secondo il Codice, il «responsabile dell'attività» è:",["Il soggetto tenuto agli obblighi di prevenzione incendi per l'attività.","Il professionista che firma il progetto antincendio.","Il funzionario del Comando che esegue il sopralluogo."]);
D("j07","ist",[G16,G21],"Secondo il Codice, il «tecnico abilitato» è:",["Il professionista iscritto in albo professionale, che opera nell'ambito delle proprie competenze.","Il professionista iscritto negli elenchi del Ministero dell'interno.","Il dipendente del CNVVF abilitato ai controlli di prevenzione incendi."]);
D("j08","ist",[G16,G21],"Secondo il Codice, il «professionista antincendio» è:",["Il tecnico abilitato iscritto negli appositi elenchi del Ministero dell'interno di cui all'art. 16 del D.Lgs. 139/2006.","Il tecnico abilitato con almeno dieci anni di iscrizione al proprio albo.","Il lavoratore designato dal datore di lavoro ai sensi del D.Lgs. 81/08."]);
D("j09","ist",[G16,G21],"Secondo il Codice, il «progettista» è:",["Il tecnico abilitato o il professionista antincendio incaricato dal responsabile dell'attività della progettazione ai fini antincendio.","Esclusivamente il professionista antincendio incaricato dal Comando.","Il tecnico del Comando che valuta il progetto."]);
D("j10","ist",[G16,G21],"Secondo l'art. 16, comma 4, del D.Lgs. 139/2006, il Comando acquisisce dai responsabili delle attività le certificazioni e le dichiarazioni di conformità rilasciate da:",["Enti, laboratori o professionisti iscritti in albi professionali, autorizzati e iscritti a domanda in appositi elenchi del Ministero dell'interno.","Qualsiasi tecnico, anche non iscritto ad un albo professionale.","Esclusivamente laboratori pubblici del CNVVF."]);
D("j11","ist",[G16,G21],"Quale norma ha previsto per la prima volta che i professionisti fossero autorizzati e iscritti in appositi elenchi del Ministero dell'interno?",["La Legge 7 dicembre 1984, n. 818.","Il D.P.R. 29 luglio 1982, n. 577.","Il D.Lgs. 8 marzo 2006, n. 139."]);
D("j12","ist",[G16,G21],"Il Decreto 25 marzo 1985 stabiliva:",["Le procedure e i requisiti per l'autorizzazione e l'iscrizione dei professionisti negli elenchi del Ministero dell'interno di cui alla Legge 818/1984.","L'elenco delle attività soggette ai controlli di prevenzione incendi.","I criteri di classificazione di reazione al fuoco dei materiali."]);
D("j13","ist",[G16,G21],"Con il DM 5 agosto 2011 il corso base di specializzazione in prevenzione incendi ha una durata di:",["120 ore.","80 ore.","100 ore."]);
D("j14","ist",[G16,G21],"Con il DM 5 agosto 2011, la possibilità di iscriversi negli elenchi del Ministero dell'interno con dieci anni di anzianità di iscrizione all'albo:",["È stata esclusa.","È rimasta, previo colloquio.","È rimasta solo per ingegneri e architetti."]);
D("j15","ist",[G16,G21],"Con il DM 5 agosto 2011, per l'iscrizione negli elenchi il requisito di due anni di iscrizione all'albo professionale:",["Non è più necessario.","È ancora necessario.","È stato portato a cinque anni."]);
D("j16","ist",[G16,G21],"Per iscriversi negli elenchi del Ministero dell'interno (art. 3 DM 5/8/2011), alla data della domanda servono:",["Iscrizione all'albo professionale e attestazione di frequenza con esito positivo del corso base di specializzazione.","Iscrizione all'albo da almeno due anni e corso base di specializzazione.","Iscrizione all'albo e documentata esperienza nella progettazione antincendio."]);
D("j17","ist",[G16,G21],"Quale dei seguenti albi NON è tra quelli i cui iscritti possono iscriversi negli elenchi del Ministero dell'interno (art. 3 DM 5/8/2011)?",["Consulenti del lavoro.","Periti agrari e periti agrari laureati.","Agrotecnici e agrotecnici laureati."]);
D("j18","ist",[G16,G21],"Se il candidato non supera l'esame di fine corso (art. 5 DM 5/8/2011):",["Può ripeterlo; in caso di ulteriore esito negativo deve frequentare un nuovo corso.","Deve frequentare subito un nuovo corso.","Può ripeterlo senza limiti di tentativi."]);
D("j19","ist",[G16,G21],"Per mantenere l'iscrizione negli elenchi del Ministero dell'interno il professionista deve frequentare corsi o seminari di aggiornamento per almeno:",["40 ore nell'arco di cinque anni.","40 ore ogni anno.","120 ore nell'arco di cinque anni."]);
D("j20","ist",[G16,G21],"Ai sensi dell'art. 2 del DM 5/8/2011, i professionisti iscritti negli elenchi sono autorizzati, tra l'altro:",["Alla redazione dei progetti con l'approccio ingegneristico (DM 9 maggio 2007) e del relativo documento sul sistema di gestione della sicurezza antincendio.","Al rilascio del certificato di prevenzione incendi.","All'esecuzione dei controlli di prevenzione incendi a campione."]);
D("j21","ist",[G16,G21],"Secondo l'art. 13 del D.Lgs. 139/2006 la prevenzione incendi è:",["Una funzione di preminente interesse pubblico, diretta a conseguire secondo criteri applicativi uniformi sul territorio nazionale gli obiettivi di sicurezza.","Un servizio reso a domanda dei privati, regolato dalle Regioni.","Una funzione di vigilanza limitata ai luoghi di lavoro."]);
D("j22","ist",[G16,G21],"In ragione della sua rilevanza interdisciplinare, la prevenzione incendi si esplica anche nei settori:",["Sicurezza nei luoghi di lavoro, incidenti rilevanti, energia, protezione da radiazioni ionizzanti, prodotti da costruzione.","Urbanistica, edilizia residenziale e trasporti pubblici.","Solo nelle attività dell'Allegato I al DPR 151/2011."]);
D("j23","ist",[G16,G21],"Ai sensi dell'art. 14 del D.Lgs. 139/2006, la prevenzione incendi è affidata:",["Alla competenza esclusiva del Ministero dell'interno, che la esercita attraverso il Dipartimento e il Corpo nazionale.","Alle Regioni, che la esercitano tramite le ASL.","In modo condiviso a Ministero dell'interno e Ministero del lavoro."]);
D("j24","ist",[G16,G21],"Quale delle seguenti rientra tra le attività di prevenzione incendi dell'art. 14 del D.Lgs. 139/2006?",["I servizi di vigilanza antincendio nei locali di pubblico spettacolo e intrattenimento.","La progettazione degli impianti antincendio per conto dei privati.","Il rilascio della dichiarazione di conformità degli impianti ai sensi del DM 37/08."]);
D("j25","ist",[G16,G21],"Ai sensi dell'art. 15 del D.Lgs. 139/2006, le norme tecniche di prevenzione incendi sono adottate:",["Con decreto del Ministro dell'interno, di concerto con i Ministri interessati, sentito il Comitato centrale tecnico-scientifico per la prevenzione incendi.","Con circolare del Capo del Corpo nazionale dei Vigili del fuoco.","Con legge regionale, sentito il Comando provinciale."]);
D("j26","ist",[G16,G21],"Le misure intese a ridurre la probabilità che insorgano incendi ed esplosioni (art. 15 D.Lgs. 139/2006) agiscono:",["Sulle sorgenti di ignizione, sul materiale combustibile e sull'agente ossidante.","Sulle vie di esodo e sulle compartimentazioni.","Sui distanziamenti e sulle caratteristiche costruttive."]);
D("j27","ist",[G16],"Ai sensi dell'art. 13 del D.Lgs. 81/08, la vigilanza sulla salute e sicurezza nei luoghi di lavoro è svolta:",["Dall'ASL competente, dall'Ispettorato nazionale del lavoro e, per quanto di specifica competenza, dal CNVVF.","Esclusivamente dal Corpo nazionale dei Vigili del fuoco.","Esclusivamente dall'INAIL."]);
D("j28","ist",[G16,G21],"Le regole tecniche orizzontali (RTO) del Codice:",["Regolano misure valide per tutte le attività, come reazione al fuoco, resistenza al fuoco, compartimentazione, esodo (capitoli S.1–S.10).","Regolano una singola attività, ad esempio scuole o ospedali.","Sono norme volontarie UNI richiamate dal Codice."]);
D("j29","ist",[G16,G21],"Le regole tecniche verticali (RTV) del Codice:",["Sono applicabili ad una specifica attività, come scuole, ospedali o autorimesse.","Regolano la reazione e la resistenza al fuoco di tutte le attività.","Sono le regole tecniche tradizionali escluse dal Codice."]);
D("j30","ist",[G21],"Secondo la lezione, il Codice di prevenzione incendi è:",["Un insieme di norme di tipo prescrittivo, salvo la sezione M «Metodi» che tratta l'ingegneria della sicurezza antincendio.","Un insieme di norme interamente prestazionali.","Un insieme di norme volontarie di buona tecnica."]);
D("j31","ist",[G21],"Con le regole tecniche tradizionali, se per vincoli particolari (es. valore storico-artistico dell'edificio) non si possono rispettare tutte le prescrizioni, si ricorre:",["All'istituto della deroga, con misure che garantiscano un livello di sicurezza equivalente.","Alla sospensione dell'attività in attesa di una nuova norma.","Ad una semplice dichiarazione del responsabile dell'attività."]);
D("j32","ist",[G16,G21],"Nel Codice, con una «soluzione alternativa» il professionista antincendio deve:",["Dimostrare il raggiungimento del collegato livello di prestazione con uno dei metodi di progettazione ammessi.","Richiedere una deroga al Comando.","Applicare le regole tecniche tradizionali."]);
D("j33","ist",[G16,G21],"Nella soluzione in deroga prevista dal Codice (G.2.8), l'analisi secondo «giudizio esperto» si fonda:",["Sui principi generali di prevenzione incendi e sul bagaglio di conoscenze del professionista antincendio.","Sul parere vincolante del Comitato tecnico regionale.","Esclusivamente su prove sperimentali in scala reale."]);
D("j34","ist",[G16,G21],"Nel Codice, le prove sperimentali come metodo di progettazione (G.2.7) sono condotte:",["In scala reale o adeguatamente rappresentativa, secondo protocolli standardizzati o condivisi con la DCPST del CNVVF.","Solo in scala ridotta, secondo protocolli scelti dal progettista.","Solo dai laboratori del Comando provinciale."]);
D("j35","ist",[G16,G21],"Nel Codice, l'impiego di prodotti o tecnologie di tipo innovativo è consentito quando:",["L'idoneità all'impiego può essere attestata dal professionista antincendio.","Il prodotto ha almeno dieci anni di impiego documentato.","Il Comando ha rilasciato un nulla osta di fattibilità."]);

// ---- Procedimento di prevenzione incendi e certificazioni ----
D("p06","proc",[G16,G21],"Con il DPR 151/2011 le attività soggette ai controlli di prevenzione incendi sono:",["80, rispetto alle 97 precedenti.","97, come in precedenza.","151, una per ciascun numero del regolamento."]);
D("p07","proc",[G16,G21],"Il DPR 151/2011 distingue le attività soggette in categorie:",["A, B e C, rispettivamente a basso, medio ed elevato rischio.","1, 2 e 3, rispettivamente a elevato, medio e basso rischio.","A e B, con o senza regola tecnica."]);
D("p08","proc",[G16,G21],"Con il DPR 151/2011 la valutazione dei progetti si effettua:",["Solo per le attività di categoria B e C, entro 60 giorni.","Per tutte le attività, entro 45 giorni.","Solo per le attività di categoria C, entro 90 giorni."]);
D("p09","proc",[G16,G21],"Con il DPR 151/2011 i controlli di prevenzione incendi sono:",["A campione per le attività di categoria A e B, obbligatori per quelle di categoria C, entro 60 giorni.","Obbligatori per tutte le attività, entro 30 giorni.","A campione per tutte le attività, entro 90 giorni."]);
D("p10","proc",[G16,G21],"Con il DPR 151/2011 il certificato di prevenzione incendi (CPI) si rilascia:",["Solo per le attività di categoria C.","Per tutte le attività soggette.","Solo per le attività di categoria B e C."]);
D("p11","proc",[G16],"Se il controllo accerta carenze ma è possibile adeguarsi alle norme, il Comando concede al titolare per l'adeguamento:",["45 giorni.","15 giorni.","90 giorni."]);
D("p12","proc",[G16,G21],"Quali nuovi istituti sono stati introdotti dal DPR 151/2011?",["Il nulla osta di fattibilità (NOF) e le verifiche in corso d'opera.","Il nulla osta provvisorio e il silenzio-assenso sui progetti.","La deroga e l'esame progetto preliminare."]);
D("p13","proc",[G16],"Il nulla osta di fattibilità (art. 8 DPR 151/2011) è:",["Un parere su uno o più aspetti rilevanti del progetto, ad esempio ubicazione, compartimentazione, vie di esodo, impianti.","Il certificato definitivo che autorizza l'esercizio dell'attività.","La ricevuta rilasciata dal SUAP alla presentazione della SCIA."]);
D("p14","proc",[G16],"Le verifiche in corso d'opera (art. 9 DPR 151/2011):",["Sono visite tecniche richieste al Comando dai responsabili delle attività durante la realizzazione dell'opera.","Sono disposte d'ufficio dal Comando per tutte le attività di categoria C.","Sono eseguite dal professionista antincendio senza coinvolgere il Comando."]);
D("p15","proc",[G16,G21],"Con il DPR 151/2011 il certificato di prevenzione incendi:",["È solo il risultato del controllo, non ha validità temporale e attesta il rispetto delle prescrizioni.","È il provvedimento finale del procedimento e ha validità quinquennale.","Sostituisce la SCIA per le attività di categoria A."]);
D("p16","proc",[G16],"Nel procedimento automatizzato del SUAP (DPR 160/2010), dopo il rilascio della ricevuta della SCIA il richiedente:",["Può avviare immediatamente l'intervento o l'attività.","Deve attendere il sopralluogo del Comando.","Deve attendere 60 giorni dalla presentazione."]);
D("p17","proc",[G16],"Il DPR 151/2011 integra il procedimento di prevenzione incendi con la disciplina:",["Dello sportello unico per le attività produttive (DPR 160/2010).","Dell'autorizzazione integrata ambientale.","Del permesso di costruire (DPR 380/2001)."]);
D("p18","proc",[G16,G21],"Il DM 7 agosto 2012 disciplina:",["Le modalità di presentazione delle istanze dei procedimenti di prevenzione incendi e la documentazione da allegare.","Le regole tecniche per gli impianti di protezione attiva.","La formazione dei professionisti antincendio."]);
D("p19","proc",[G16,G21],"Il modello PIN 3.1 è:",["L'asseverazione ai fini dell'attestazione di rinnovo periodico di conformità antincendio.","L'asseverazione ai fini della sicurezza antincendio allegata alla SCIA.","La certificazione di resistenza al fuoco."]);
D("p20","proc",[G16,G21],"La richiesta di rinnovo periodico di conformità antincendio contiene l'asseverazione del professionista antincendio che attesta l'efficienza degli impianti di protezione attiva, con esclusione:",["Delle attrezzature mobili di estinzione.","Degli impianti di rivelazione incendio.","Delle reti idranti."]);
D("p21","proc",[G16,G21],"La certificazione di resistenza al fuoco degli elementi costruttivi portanti e/o separanti (mod. PIN 2.2 CERT. REI) è a firma:",["Del professionista antincendio, qualunque sia il metodo di valutazione (tabellare, analitico o sperimentale).","Del tecnico abilitato se la valutazione è tabellare.","Del direttore dei lavori."]);
D("p22","proc",[G16,G21],"La certificazione PIN 2.2 CERT. REI riguarda gli elementi costruttivi in opera:",["Con esclusione delle porte e degli elementi di chiusura.","Comprese le porte e gli elementi di chiusura.","Solo le porte e gli elementi di chiusura."]);
D("p23","proc",[G16,G21],"La dichiarazione inerente i prodotti per reazione e resistenza al fuoco e i dispositivi di apertura delle porte (PIN 2.3 DICH. PROD.) è a firma:",["Del tecnico abilitato incaricato del coordinamento, direzione o sorveglianza dei lavori o, in loro assenza, del professionista antincendio.","Sempre del professionista antincendio.","Del produttore dei materiali."]);
D("p24","proc",[G16,G21],"Per un impianto non soggetto al DM 37/08 e privo di progetto, la documentazione è costituita dalla certificazione di rispondenza e corretto funzionamento (PIN 2.5 CERT. IMP.) a firma:",["Del professionista antincendio.","Dell'installatore.","Del responsabile dell'attività."]);
D("p25","proc",[G16,G21],"Nell'istanza di valutazione del progetto con approccio ingegneristico, la documentazione tecnica è a firma:",["Del professionista antincendio.","Del tecnico abilitato.","Del responsabile dell'attività."]);
D("p26","proc",[G16,G21],"Nell'istanza di deroga, la documentazione tecnica a firma del professionista antincendio è integrata da:",["Una valutazione del rischio aggiuntivo dovuto alla mancata osservanza della norma e dalle misure ritenute idonee a compensarlo.","Il parere preventivo del Comitato tecnico regionale.","Il certificato di prevenzione incendi dell'attività."]);
D("p27","proc",[G16,G21],"Il DM 20 dicembre 2012 considera impianti di protezione attiva:",["Rivelazione e allarme incendio, estinzione o controllo dell'incendio automatici o manuali, controllo del fumo e del calore.","Solo gli impianti di estinzione automatici.","Anche gli impianti elettrici e di illuminazione ordinaria."]);
D("p28","proc",[G16,G21],"Secondo il DM 20/12/2012, il progetto di un impianto di protezione attiva secondo le norme dell'Ente di normalizzazione europeo è redatto:",["Da un tecnico abilitato.","Obbligatoriamente da un professionista antincendio.","Dall'impresa installatrice."]);
D("p29","proc",[G16,G21],"Per un impianto realizzato secondo norme di organismi internazionalmente riconosciuti, ai fini dei controlli la documentazione è integrata da:",["La certificazione di rispondenza e di corretto funzionamento a firma di professionista antincendio.","La sola dichiarazione dell'installatore.","Il collaudo del Comando provinciale."]);
D("p30","proc",[G16,G21],"Nel Codice (G.2.10.1), se il progetto di un impianto prevede prodotti o tecnologie di tipo innovativo, il progetto è a firma:",["Del professionista antincendio.","Del tecnico abilitato.","Del produttore della tecnologia."]);
D("p31","proc",[G16,G21],"Nel Codice (S.6.8.2), la continuità dell'alimentazione idrica da acquedotto della rete idranti può essere attestata:",["Dagli enti erogatori o da professionista antincendio, anche con dati statistici degli anni precedenti.","Solo dal responsabile dell'attività.","Solo dal Comando provinciale dei VVF."]);
D("p32","proc",[G16,G21],"Nel Codice (S.2.8.3), per produzioni strutturali in serie valutate su prototipi, il professionista antincendio:",["Certifica i requisiti di resistenza al fuoco delle strutture in opera, verificando il rispetto delle ipotesi assunte per i prototipi.","Non deve certificare nulla, perché vale la prova sul prototipo.","Deve ripetere la prova sperimentale su ogni struttura."]);

// ---- Direttive europee (Manna) ----
D("u01","dir",[MD],"Nel sistema giuridico comunitario, il regolamento è:",["Un atto obbligatorio, direttamente applicabile senza una legge di recepimento.","Un atto obbligatorio solo nei risultati, che ogni Stato recepisce con forme e mezzi propri.","Uno strumento non vincolante che fissa orientamenti futuri."]);
D("u02","dir",[MD],"Nel sistema giuridico comunitario, la direttiva è:",["Obbligatoria nei risultati, ma lascia a ciascuno Stato la scelta delle forme e dei mezzi per attuarla.","Direttamente applicabile senza recepimento.","Un invito non vincolante agli Stati membri."]);
D("u03","dir",[MD],"Nel sistema giuridico comunitario, la raccomandazione è:",["Lo strumento con cui si chiede agli Stati membri di adottare determinati provvedimenti.","Un atto obbligatorio direttamente applicabile.","Un atto obbligatorio solo per i destinatari, senza recepimento."]);
D("u04","dir",[MD],"Nel sistema giuridico italiano, una circolare è:",["Un'interpretazione governativa o ministeriale non vincolante.","Un atto con valore di legge.","Un atto ministeriale attuativo vincolante come un decreto."]);
D("u05","dir",[MD],"Il decreto-legge è:",["Un atto del Governo con valore di legge per 60 giorni, emesso per ragioni di urgenza.","Un atto del Governo con valore di legge su delega specifica del Parlamento.","Un atto ministeriale attuativo."]);
D("u06","dir",[MD],"La Direttiva 83/189/CEE prevede, tra l'altro, che:",["Se la Commissione europea sta studiando una norma tecnica su una materia, siano sospesi i lavori nazionali sulla stessa materia.","Ogni Stato membro possa adottare liberamente nuove regole tecniche nazionali.","I prodotti da costruzione abbiano la marcatura CE."]);
D("u07","dir",[MD],"Per i prodotti soggetti alle direttive di prodotto, all'acquirente devono essere forniti:",["Marcatura CE, dichiarazione di conformità e manuale d'uso e manutenzione.","Solo la marcatura CE.","Il certificato di prevenzione incendi del produttore."]);
D("u08","dir",[MD],"La Direttiva 89/106/CEE sui prodotti da costruzione era stata recepita in Italia con:",["Il DPR 246/1993.","Il D.Lgs. 106/2017.","Il DPR 151/2011."]);
D("u09","dir",[MD],"Il Regolamento (UE) 305/2011 (CPR) sui prodotti da costruzione:",["Abroga la Direttiva 89/106/CEE; in Italia la legislazione di adeguamento è il D.Lgs. 106/2017.","Integra la Direttiva 89/106/CEE, che resta in vigore.","È stato recepito con il DPR 246/1993."]);
D("u10","dir",[MD],"Nel Regolamento 305/2011, il requisito di base delle opere n. 2 è:",["Sicurezza in caso d'incendio.","Resistenza meccanica e stabilità.","Igiene, salute e ambiente."]);
D("u11","dir",[MD],"Rispetto ai sei requisiti essenziali della Direttiva 89/106, il Regolamento 305/2011 ha aggiunto il requisito di base:",["Uso sostenibile delle risorse naturali.","Sicurezza in caso d'incendio.","Protezione contro il rumore."]);
D("u12","dir",[MD],"Secondo il Regolamento 305/2011, un «prodotto da costruzione» è:",["Un prodotto o kit immesso sul mercato per essere incorporato in modo permanente in opere di costruzione, la cui prestazione incide sui requisiti di base delle opere.","Qualsiasi prodotto usato in cantiere, anche temporaneamente.","Solo un elemento strutturale portante."]);
D("u13","dir",[MD],"Secondo il Regolamento 305/2011, le «opere di costruzione» sono:",["Gli edifici e le opere di ingegneria civile.","Solo gli edifici.","Solo le opere soggette ai controlli di prevenzione incendi."]);
D("u14","dir",[MD],"Con il Regolamento 305/2011, la marcatura CE di un prodotto da costruzione:",["Non attesta più la conformità a una specifica tecnica, ma accompagna la dichiarazione della prestazione del prodotto.","Attesta la conformità del prodotto a una specifica tecnica.","È facoltativa per i prodotti da costruzione."]);
D("u15","dir",[MD],"La marcatura CE deve essere apposta in forma visibile, leggibile e indelebile:",["Sul prodotto, su un'etichetta attaccata, sull'imballaggio o nei documenti di accompagnamento.","Solo sul prodotto stesso.","Solo nella dichiarazione di prestazione."]);
D("u16","dir",[MD],"Nell'etichetta della marcatura CE, le due cifre riportate sotto il simbolo indicano:",["Le ultime due cifre dell'anno in cui la marcatura è stata apposta per la prima volta.","La classe di reazione al fuoco.","Il numero dell'organismo notificato."]);
D("u17","dir",[MD],"Quale dei seguenti NON è un obiettivo del requisito di base «sicurezza in caso d'incendio»?",["Evitare qualsiasi danno ai beni contenuti nell'opera.","Garantire per un periodo determinato la capacità portante dell'opera.","Prendere in considerazione la sicurezza delle squadre di soccorso."]);
D("u18","dir",[MD],"Nella classificazione europea di reazione al fuoco, la sigla «s» indica:",["La produzione di fumo (smoke), con classi s1, s2, s3.","Il gocciolamento di particelle ardenti.","I prodotti per pavimenti."]);
D("u19","dir",[MD],"Nella classificazione europea di reazione al fuoco, la sigla «d» (d0, d1, d2) indica:",["Il gocciolamento di gocce o particelle ardenti (flaming droplets).","La densità del fumo prodotto.","La durata di resistenza al fuoco."]);
D("u20","dir",[MD],"Per i prodotti a pavimento (pedice «fl») della classificazione europea:",["Non è previsto il parametro «d» relativo al gocciolamento.","Non è previsto il parametro «s» relativo al fumo.","Sono previste solo le classi A1 e A2."]);
D("u21","dir",[MD],"Nella classificazione europea di reazione al fuoco, la classe principale peggiora nell'ordine:",["A1, A2, B, C, D, E, F.","F, E, D, C, B, A2, A1.","0, 1, 2, 3, 4, 5."]);
D("u22","dir",[MD],"Nella classificazione italiana di reazione al fuoco, le classi 1 IM, 2 IM, 3 IM riguardano:",["I mobili imbottiti.","I materiali da pavimento.","I prodotti isolanti per impianti."]);
D("u23","dir",[MD],"Nella tabella S.1-5 del Codice, per i mobili imbottiti nel gruppo GM3 la classe italiana richiesta è:",["2 IM.","1 IM.","3 IM."]);
D("u24","dir",[MD],"La Direttiva Seveso III (2012/18/UE) è stata recepita in Italia con:",["Il D.Lgs. 26 giugno 2015, n. 105.","Il D.Lgs. 17 agosto 1999, n. 334.","Il DPR 17 maggio 1988, n. 175."]);
D("u25","dir",[MD],"La Direttiva Seveso II (96/82/CE) era stata recepita in Italia con:",["Il D.Lgs. 334/1999.","Il DPR 175/1988.","Il D.Lgs. 105/2015."]);
D("u26","dir",[MD],"Uno dei motivi della Direttiva Seveso III è l'adeguamento al sistema di classificazione delle sostanze chimiche GHS, recepito in UE con:",["Il regolamento CLP (Reg. 1272/2008).","Il regolamento REACH (Reg. 1907/2006).","Il regolamento CPR (Reg. 305/2011)."]);

D("u29","dir",[MD],"Nell'allegato 1 del D.Lgs. 105/2015, le sostanze pericolose sono associate a due limiti di soglia che distinguono:",["Stabilimenti di soglia superiore e stabilimenti di soglia inferiore.","Stabilimenti di categoria A, B e C.","Depositi e impianti di produzione."]);
D("u30","dir",[MD],"Nell'allegato 1, parte 1, del D.Lgs. 105/2015 le categorie di sostanze sono:",["21, suddivise in pericoli per la salute (H), fisici (P), per l'ambiente (E) e altri pericoli (O).","10, come nel D.Lgs. 334/99.","48 sostanze specifiche."]);
D("u31","dir",[MD],"Ai sensi del D.Lgs. 105/2015, il Comitato tecnico regionale (CTR) è istituito:",["Dal Ministero dell'interno, in ciascuna regione, ed è presieduto dal Direttore regionale dei Vigili del fuoco.","Dalla Regione, ed è presieduto dall'assessore all'ambiente.","Dal Ministero dell'ambiente, presso l'ISPRA."]);
D("u32","dir",[MD],"Per gli stabilimenti di soglia superiore il CTR si occupa, tra l'altro, di:",["Istruttorie sui rapporti di sicurezza, ispezioni e applicazione delle sanzioni amministrative pecuniarie.","Rilascio delle autorizzazioni edilizie.","Redazione dei piani di emergenza esterna."]);
D("u33","dir",[MD],"I piani di emergenza esterna degli stabilimenti Seveso sono predisposti:",["Dal Prefetto competente per territorio.","Dal gestore dello stabilimento.","Dal Comando provinciale dei Vigili del fuoco."]);
D("u34","dir",[MD],"Il piano nazionale di ispezioni per gli stabilimenti di soglia superiore è predisposto:",["Dalla Direzione centrale prevenzione e sicurezza tecnica del CNVVF, in collaborazione con l'ISPRA.","Da ciascun Comitato tecnico regionale in autonomia.","Dal Ministero della salute."]);
D("u35","dir",[MD],"Per le deliberazioni del CTR sono richiesti:",["La presenza dei 2/3 dei componenti e la delibera a maggioranza.","La presenza di tutti i componenti e l'unanimità.","La sola firma del presidente."]);
D("u36","dir",[MD],"Con il D.Lgs. 105/2015, l'inventario nazionale degli stabilimenti è gestito:",["Dall'ISPRA, con invio telematico della notifica.","Dalle Prefetture.","Dai Comandi provinciali dei VVF."]);
D("u37","dir",[MD],"La Direttiva 94/9/CE (ATEX prodotto) riguarda:",["Apparecchi e sistemi di protezione destinati ad essere usati in atmosfera potenzialmente esplosiva.","La tutela dei lavoratori esposti al rischio di atmosfere esplosive.","La classificazione delle sostanze pericolose."]);
D("u38","dir",[MD],"La Direttiva 99/92/CE (ATEX) riguarda:",["Le prescrizioni minime per la sicurezza e la salute dei lavoratori esposti al rischio di atmosfere esplosive.","La costruzione degli apparecchi per atmosfere esplosive.","I prodotti da costruzione."]);
D("u39","dir",[MD],"La Direttiva quadro 89/391/CEE sulla sicurezza e salute dei lavoratori era stata recepita in Italia con:",["Il D.Lgs. 626/1994.","Il D.Lgs. 81/2008.","Il DPR 547/1955."]);
D("u40","dir",[MD],"Secondo la Direttiva quadro 89/391/CEE, i tre cardini della moderna prevenzione sono:",["Tecnica, organizzazione, uomo.","Progettazione, controllo, sanzione.","Prevenzione, protezione, assicurazione."]);
D("u41","dir",[MD],"Il Regolamento REACH (CE 1907/2006) NON si applica, tra l'altro:",["Alle sostanze radioattive e ai rifiuti.","Alle sostanze chimiche prodotte in Europa.","Alle miscele di sostanze."]);

// ---- D.Lgs. 81/08 (Manna) ----
D("l06","lav",[MD],"Nel D.Lgs. 81/08, la protezione da atmosfere esplosive è disciplinata:",["Dal Titolo XI.","Dal Titolo IV.","Dal Titolo IX."]);
D("l07","lav",[MD],"Ai sensi dell'art. 3, comma 1, il D.Lgs. 81/08 si applica:",["A tutti i settori di attività, privati e pubblici, e a tutte le tipologie di rischio.","Solo alle attività private con dipendenti.","Solo alle attività soggette ai controlli di prevenzione incendi."]);
D("l08","lav",[MD],"Ai sensi dell'art. 18 del D.Lgs. 81/08, il datore di lavoro deve designare preventivamente i lavoratori incaricati:",["Delle misure di prevenzione incendi e lotta antincendio, evacuazione, salvataggio, primo soccorso e gestione dell'emergenza.","Della redazione del documento di valutazione dei rischi.","Della vigilanza sull'applicazione delle norme."]);
D("l09","lav",[MD],"Il DM 10 marzo 1998 è stato sostituito dai decreti:",["DM 1, 2 e 3 settembre 2021.","DM 3 agosto 2015 e DM 12 aprile 2019.","DM 7 agosto 2012 e DM 20 dicembre 2012."]);
D("l10","lav",[MD],"Secondo l'Allegato IV del D.Lgs. 81/08, le vie e le uscite di emergenza devono avere altezza minima di:",["2,0 m.","2,10 m.","1,80 m."]);
D("l11","lav",[MD],"Secondo l'Allegato IV del D.Lgs. 81/08, i mezzi e gli impianti di estinzione devono essere controllati da personale esperto almeno:",["Una volta ogni sei mesi.","Una volta all'anno.","Una volta ogni tre mesi."]);
D("l12","lav",[MD],"Il D.Lgs. 81/08 è stato coordinato e integrato in modo rilevante con:",["Il D.Lgs. 3 agosto 2009, n. 106.","Il D.Lgs. 26 giugno 2015, n. 105.","Il D.Lgs. 16 giugno 2017, n. 106."]);
D("l13","lav",[MD],"Ai sensi dell'art. 46 del D.Lgs. 81/08, nei luoghi di lavoro:",["Devono essere adottate idonee misure per prevenire gli incendi e tutelare l'incolumità dei lavoratori.","La prevenzione incendi è affidata alle ASL.","Le misure antincendio sono facoltative per le aziende con meno di 10 dipendenti."]);

// Blocco 2 – Lezione Manna 23/09/2026: combustione, incendio, estinguenti.
const MC = "Lezione Manna 23/09/2026 – Combustione ed estinguenti";
ARGOMENTI.comb = { sigla: "FIS", nome: "Combustione, esplosione ed effetti dell'incendio" };

D("cb01","comb",[MC],"La combustione è:",["Una reazione chimica sufficientemente rapida in cui un combustibile reagisce con un comburente liberando energia, in genere sotto forma di calore.","Una reazione chimica endotermica che assorbe calore dall'ambiente.","Un fenomeno fisico di evaporazione di un liquido infiammabile."]);
D("cb02","comb",[MC],"Nella reazione di combustione, il comburente è la sostanza che:",["Provoca l'ossidazione, ricevendo elettroni (si riduce).","Cede elettroni e si ossida.","Fornisce l'energia di attivazione."]);
D("cb03","comb",[MC],"La combustione è una reazione esotermica perché:",["I reagenti possiedono più energia dei prodotti e la differenza viene emessa come calore.","I prodotti possiedono più energia dei reagenti.","Avviene solo ad alta temperatura."]);
D("cb04","comb",[MC],"Il parametro che più influenza la velocità di una reazione di combustione è:",["La temperatura.","La pressione.","L'umidità relativa."]);
D("cb05","comb",[MC],"Rispetto all'energia di attivazione, un catalizzatore (es. radicali liberi):",["La abbassa, facendo procedere più velocemente la reazione.","La innalza, rallentando la reazione.","Non ha alcun effetto."]);
D("cb06","comb",[MC],"L'energia di accensione di una miscela combustibile–comburente è minima:",["Alla concentrazione stechiometrica.","Al limite inferiore di infiammabilità.","Al limite superiore di infiammabilità."]);
D("cb07","comb",[MC],"Tra le seguenti sostanze, quale ha l'energia minima di accensione più bassa?",["Idrogeno (circa 0,02 mJ).","Metano (circa 0,2 mJ).","Carbone (circa 60 mJ)."]);
D("cb08","comb",[MC],"Il triangolo del fuoco indica che, perché si verifichi la combustione, devono essere presenti contemporaneamente:",["Combustibile, comburente ed energia di attivazione (innesco).","Combustibile, acqua e ossigeno.","Calore, fumo e fiamma."]);
D("cb09","comb",[MC],"Il quadrilatero del fuoco aggiunge al triangolo, come condizione per mantenere la combustione:",["La presenza di radicali liberi (autocatalisi).","La presenza di fumo.","La presenza di umidità."]);
D("cb10","comb",[MC],"L'anticatalisi come metodo di estinzione consiste:",["Nell'impiego di sostanze che catturano i radicali liberi, bloccando le catene della reazione.","Nel raffreddare il combustibile con acqua.","Nel separare il combustibile dal focolaio."]);
D("cb11","comb",[MC],"Lo spegnimento per soffocamento si ottiene:",["Separando il comburente dal combustibile o riducendo la concentrazione di comburente nell'aria.","Allontanando il combustibile dal focolaio.","Abbassando la temperatura del combustibile."]);
D("cb12","comb",[MC],"Secondo la classificazione dei fuochi (EN 2), un incendio di gas infiammabili è di classe:",["C.","B.","D."]);
D("cb13","comb",[MC],"Secondo la classificazione dei fuochi (EN 2), un incendio di metalli combustibili è di classe:",["D.","C.","F."]);
D("cb14","comb",[MC],"La classe di fuoco F, introdotta dalla EN 2 del 2005, riguarda:",["Oli e grassi vegetali o animali negli apparecchi di cottura.","Apparecchiature elettriche in tensione.","Metalli combustibili."]);
D("cb15","comb",[MC],"La cosiddetta «classe E» indica:",["Incendi di apparecchiature elettriche che potrebbero trovarsi sotto tensione; la dicitura non è garantita da una norma esplicita.","Incendi di esplosivi, secondo la EN 2.","Incendi di liquidi infiammabili miscibili con acqua."]);
D("cb16","comb",[MC],"Si parla di «accensione indiretta» quando:",["Il calore d'innesco si trasmette per convezione, conduzione o irraggiamento, ad esempio aria calda lungo un vano scala.","Una fiamma o una scintilla entra in contatto diretto con il combustibile.","Il calore è prodotto dallo stesso combustibile."]);
D("cb17","comb",[MC],"Stracci imbevuti di olio di lino o cumuli di carbone che prendono fuoco sono un esempio di:",["Autocombustione o riscaldamento spontaneo.","Accensione per attrito.","Accensione diretta."]);
D("cb18","comb",[MC],"I prodotti della combustione si suddividono in:",["Fiamme, gas di combustione, fumo e calore.","Combustibile, comburente, innesco.","Braci, ceneri e vapore."]);
D("cb19","comb",[MC],"I gas di combustione sono i prodotti che:",["Restano allo stato gassoso anche quando, raffreddandosi, raggiungono la temperatura ambiente di riferimento (15 °C).","Condensano sotto i 100 °C formando fumo bianco.","Si formano solo nella combustione dei gas."]);
D("cb20","comb",[MC],"Nella maggior parte dei casi, la mortalità negli incendi è dovuta:",["All'inalazione dei gas e dei fumi, per anossia o tossicità.","Alle ustioni da contatto con le fiamme.","Ai crolli strutturali."]);
D("cb21","comb",[MC],"L'ossido di carbonio (CO) è:",["Tossico perché si lega all'emoglobina del sangue; è incolore e inodore.","Asfissiante ma non tossico.","Un gas dall'odore di mandorle amare."]);
D("cb22","comb",[MC],"L'anidride carbonica (CO2) è un gas:",["Asfissiante, perché sostituisce l'ossigeno, ma non tossico.","Tossico, perché si lega all'emoglobina.","Irritante, perché forma acido cloridrico."]);
D("cb23","comb",[MC],"Quale gas di combustione ha il caratteristico odore di mandorle amare?",["Acido cianidrico (HCN).","Fosgene.","Ossido di carbonio."]);
D("cb24","comb",[MC],"Il fosgene si sviluppa soprattutto:",["Nella combustione di materiali che contengono cloro, come alcune materie plastiche.","Nella combustione del legno.","Nella combustione del metano."]);
D("cb25","comb",[MC],"L'ossido di carbonio è un prodotto tipico delle combustioni:",["In atmosfera povera di ossigeno.","Con eccesso di aria.","Dei metalli."]);
D("cb26","comb",[MC],"Il fumo di colore bianco è dovuto principalmente:",["A particelle liquide, soprattutto vapore d'acqua condensato sotto i 100 °C.","A particelle solide incombuste.","Alla presenza di ossido di carbonio."]);
D("cb27","comb",[MC],"Il fumo di colore scuro è dovuto principalmente:",["A particelle solide incombuste trascinate dai gas caldi.","A vapore acqueo condensato.","All'anidride carbonica."]);
D("cb28","comb",[MC],"La temperatura di accensione (o autoaccensione) è:",["La minima temperatura alla quale la miscela combustibile/comburente inizia a bruciare spontaneamente e in modo continuo senza ulteriore apporto di energia.","La temperatura minima alla quale un liquido emette vapori sufficienti ad incendiarsi in caso di innesco.","La temperatura raggiunta dai fumi in assenza di perdite di calore."]);
D("cb29","comb",[MC],"La temperatura di infiammabilità è:",["La temperatura minima alla quale un liquido combustibile emette vapori in quantità tali da incendiarsi in caso di innesco.","La temperatura alla quale una sostanza brucia spontaneamente.","La temperatura massima raggiunta nell'incendio."]);
D("cb30","comb",[MC],"L'indice della maggiore o minore pericolosità di un liquido combustibile è:",["La temperatura di infiammabilità.","Il potere calorifico.","La densità."]);
D("cb31","comb",[MC],"Il potere calorifico inferiore considera:",["L'acqua prodotta dalla combustione allo stato di vapore.","L'acqua prodotta allo stato liquido.","Solo i combustibili gassosi."]);
D("cb32","comb",[MC],"Il potere calorifico del legno indicato nella lezione è di circa:",["17–18 MJ/kg.","42 MJ/kg.","120 MJ/kg."]);
D("cb33","comb",[MC],"La temperatura teorica di combustione è:",["La temperatura raggiunta dai prodotti di combustione senza perdite di calore e con combustione completa con l'aria teorica.","La temperatura effettivamente raggiunta in un incendio reale.","La temperatura alla quale inizia la pirolisi."]);
D("cb34","comb",[MC],"Il limite inferiore di infiammabilità è:",["La concentrazione di vapore al di sotto della quale non si ha accensione per carenza di combustibile.","La concentrazione al di sopra della quale non si ha accensione per eccesso di combustibile.","La temperatura minima di accensione."]);
D("cb35","comb",[MC],"Quale sostanza ha il campo di infiammabilità più ampio tra quelle indicate?",["Idrogeno (circa 4–75,6%).","Metano (circa 5–15%).","Benzina (circa 1–6,5%)."]);
D("cb36","comb",[MC],"All'aumentare della temperatura o della pressione, il campo di infiammabilità generalmente:",["Si allarga, soprattutto per l'aumento del limite superiore.","Si restringe.","Resta invariato."]);
D("cb37","comb",[MC],"Un'esplosione in cui la reazione si propaga nella miscela non ancora bruciata a velocità inferiore a quella del suono è detta:",["Deflagrazione.","Detonazione.","Dissociazione."]);
D("cb38","comb",[MC],"In un ambiente chiuso saturo di gas, vapori o polveri, l'esplosione può produrre un aumento di pressione fino a circa:",["8 volte la pressione iniziale.","2 volte la pressione iniziale.","50 volte la pressione iniziale."]);
D("cb39","comb",[MC],"Il modo migliore di proteggersi dalle esplosioni è:",["Prevenire la formazione di miscele infiammabili.","Installare impianti sprinkler.","Aumentare la resistenza al fuoco delle strutture."]);
D("cb40","comb",[MC],"La pirolisi è il fenomeno per cui:",["Un solido portato ad una determinata temperatura emette vapori infiammabili.","Un liquido evapora a temperatura ambiente.","Un gas si dissocia per effetto della pressione."]);
D("cb41","comb",[MC],"Quale tra i seguenti NON è un fattore che influenza la combustione dei solidi?",["Il colore del materiale.","Il grado di porosità.","Il contenuto di umidità."]);
D("cb42","comb",[MC],"I vapori dei liquidi infiammabili in genere:",["Hanno densità maggiore dell'aria e tendono ad accumularsi in basso.","Hanno densità minore dell'aria e salgono verso l'alto.","Si sciolgono nell'acqua."]);
D("cb43","comb",[MC],"Un gas si definisce «pesante» quando la sua densità rispetto all'aria è:",["Superiore a 0,8 (es. GPL, acetilene).","Inferiore a 0,8 (es. idrogeno, metano).","Superiore a 2."]);
D("cb44","comb",[MC],"Un litro di gas liquefatto, nel passaggio di fase, può sviluppare fino a circa:",["800 litri di gas.","80 litri di gas.","8000 litri di gas."]);
D("cb45","comb",[MC],"Il «grado di riempimento» dei contenitori di gas liquefatto serve a:",["Lasciare sempre libera una parte del volume per l'equilibrio del liquido con la propria fase vapore.","Indicare la pressione massima di stoccaggio.","Indicare la quantità di gas inerte da aggiungere."]);
D("cb46","comb",[MC],"L'acetilene è conservato disciolto in un solvente (es. acetone) all'interno di una massa porosa perché:",["Compresso oltre circa 1,5–2 atm può dare luogo a una pericolosa reazione di dissociazione.","È più leggero dell'aria.","È tossico per inalazione."]);
D("cb47","comb",[MC],"Le quattro fasi di un incendio tipo sono:",["Ignizione, propagazione, incendio generalizzato, spegnimento.","Innesco, esplosione, flashover, raffreddamento.","Ignizione, generalizzazione, propagazione, decadimento."]);
D("cb48","comb",[MC],"La fase di incendio generalizzato è caratterizzata da:",["Brusco aumento della temperatura e crescita esponenziale della velocità di combustione.","Lenta riduzione della temperatura.","Assenza di fumo e gas."]);
D("cb49","comb",[MC],"L'«effetto camino» nella propagazione dell'incendio è dovuto:",["Al tiraggio dei fumi attraverso scale, vani ascensore, cavedi e attraversamenti verticali non protetti.","All'azione del vento sulle facciate.","Alla conduzione del calore nelle strutture metalliche."]);
D("cb50","comb",[MC],"La potenza termica irradiata da un incendio diminuisce con la distanza:",["Con il quadrato della distanza.","In modo lineare.","Con il cubo della distanza."]);
D("cb51","comb",[MC],"Una temperatura dell'aria di circa 60 °C è da ritenere:",["La massima respirabile per breve tempo, data l'umidità presente negli incendi.","Del tutto innocua anche per lunghi periodi.","Già mortale in pochi secondi."]);
D("cb52","comb",[MC],"Secondo la lezione, l'ignizione del legno entro un minuto si ha con un irraggiamento di circa:",["33 kW/m².","12 kW/m².","60 kW/m²."]);
D("cb53","comb",[MC],"L'anidride carbonica produce asfissia quando riduce l'ossigeno nell'aria a valori inferiori a circa:",["17% in volume.","21% in volume.","10% in volume."]);
D("e02","estin",[MC],"L'azione estinguente principale dell'acqua è:",["L'abbassamento della temperatura del combustibile, oltre a soffocamento, diluizione e imbevimento.","L'interruzione chimica della reazione (anticatalisi).","La separazione del combustibile dal comburente con un film superficiale."]);
D("e03","estin",[MC],"L'acqua NON è impiegabile:",["Su impianti e apparecchiature in tensione e su sostanze incompatibili come sodio, potassio e carburi.","Su incendi di carta e legno.","Su incendi di tessuti."]);
D("e04","estin",[MC],"Le schiume ad alta espansione hanno un rapporto di espansione di circa:",["1:500 – 1:1000.","1:30 – 1:200.","1:6 – 1:12."]);
D("e05","estin",[MC],"Le schiume a bassa espansione hanno un rapporto di espansione di circa:",["1:6 – 1:12.","1:30 – 1:200.","1:500 – 1:1000."]);
D("e06","estin",[MC],"L'azione estinguente della schiuma avviene per:",["Separazione del combustibile dal comburente e raffreddamento.","Anticatalisi.","Diluizione dell'ossigeno con gas inerte."]);
D("e07","estin",[MC],"Gli schiumogeni AFFF (fluoro-sintetici filmanti) hanno la caratteristica di:",["Scorrere rapidamente sulla superficie del liquido incendiato, spegnendo con minore portata di soluzione.","Essere adatti solo alle schiume ad alta espansione.","Poter essere usati su parti in tensione."]);
D("e08","estin",[MC],"Gli schiumogeni per alcoli sono particolarmente efficaci su:",["Alcoli, esteri, chetoni, eteri, aldeidi e altri liquidi polari.","Metalli combustibili.","Incendi di apparecchiature elettriche."]);
D("e09","estin",[MC],"Le polveri estinguenti ordinarie sono adatte ai fuochi di classe:",["A, B e C; per la classe D servono polveri speciali.","Solo D.","Solo A."]);
D("e10","estin",[MC],"L'azione estinguente delle polveri è dovuta soprattutto:",["Alla decomposizione ad alta temperatura, con azione anticatalitica e produzione di CO2 e vapore d'acqua.","Al raffreddamento per evaporazione.","Alla formazione di un film acquoso."]);
D("e11","estin",[MC],"L'anidride carbonica come estinguente:",["Riduce la concentrazione del comburente e, a differenza dell'azoto, raffredda passando dalla fase liquida a quella gassosa.","Agisce solo per anticatalisi.","Non è dielettrica e non si usa su apparecchiature elettriche."]);
D("e12","estin",[MC],"Gli idrocarburi alogenati (halon) agiscono:",["Per interruzione chimica della reazione (catalisi negativa); il loro uso è limitato per la tutela dello strato di ozono.","Per raffreddamento.","Per soffocamento con schiuma."]);
D("e13","estin",[MC],"Gli agenti sostitutivi degli halon, rispetto agli halon:",["Salvaguardano l'ambiente ma hanno in genere minore capacità estinguente.","Sono più efficaci e più inquinanti.","Agiscono solo per raffreddamento."]);
D("e14","estin",[MC],"Secondo la tabella della lezione, su apparecchiature elettriche (motori, cabine, trasformatori) si possono usare:",["Polvere e anidride carbonica.","Acqua a getto pieno e schiuma.","Solo acqua nebulizzata."]);
D("e15","estin",[MC],"Secondo la tabella della lezione, su sostanze che reagiscono pericolosamente con l'acqua (carburo di calcio, sodio, potassio):",["Si usano polvere o anidride carbonica, non acqua né schiuma.","Si usa acqua a getto pieno.","Si usa schiuma."]);

// Blocco 3 – Modulo 2.2 (Biondi): rischio, misure preventive e protettive, estinguenti.
const BI = "Modulo 2.2 Biondi – Rischio, prevenzione e protezione";
D("b10","base",[BI],"Il «pericolo» è:",["La potenzialità intrinseca di una sorgente, sostanza, attività o situazione di causare un danno.","La misura della probabilità che un evento dannoso si verifichi.","Il danno medio atteso per unità di tempo."]);
D("b11","base",[BI],"Il «rischio» è:",["La misura associata alla possibilità (probabilità/frequenza) che il pericolo si concretizzi in un evento dannoso.","La proprietà intrinseca di una sostanza di causare danno.","L'entità del danno massimo possibile."]);
D("b12","base",[BI],"Nel rischio quantitativo R = f · D, il risultato R rappresenta:",["Il valore atteso del danno per unità di tempo (danno/anno).","Un indice convenzionale di criticità.","La probabilità matematica dell'incendio."]);
D("b13","base",[BI],"Si ricorre alla valutazione qualitativa del rischio (R = P × D) quando:",["Non sono disponibili dati sufficienti per quantificare la frequenza di accadimento dell'evento.","La frequenza dell'evento è nota con precisione.","Si applica l'ingegneria della sicurezza antincendio."]);
D("b14","base",[BI],"Nella valutazione qualitativa R = P × D, il termine P:",["È una stima della probabilità e non rappresenta necessariamente una probabilità matematica.","È la frequenza annua misurata dell'evento.","È la potenza termica dell'incendio."]);
D("b15","base",[BI],"Lungo una curva di isorischio:",["Il valore atteso del rischio è lo stesso per tutte le combinazioni di frequenza e danno.","Il danno è costante.","La frequenza è costante."]);
D("b16","base",[BI],"La riduzione della frequenza o probabilità di accadimento è propria:",["Della prevenzione.","Della protezione.","Dell'assicurazione del rischio."]);
D("b17","base",[BI],"La riduzione della magnitudo del danno è propria:",["Della protezione.","Della prevenzione.","Della valutazione del rischio."]);
D("b18","base",[BI],"Il rischio residuo:",["Permane in capo all'attività; parte delle conseguenze economiche può essere trasferita con strumenti assicurativi.","È sempre nullo se si applicano le norme.","È a carico del Corpo nazionale dei Vigili del fuoco."]);
D("b19","base",[BI],"I tre profili di rischio considerati dal Codice sono:",["Rvita, Rbeni e Rambiente.","Rbasso, Rmedio e Ralto.","Rincendio, Resplosione e Rcrollo."]);
D("b20","base",[BI],"Il profilo di rischio Rbeni tiene conto anche:",["Dell'eventuale valore strategico, storico o culturale dei beni da proteggere.","Del numero di occupanti presenti.","Della velocità di crescita dell'incendio."]);
D("b21","base",[BI],"Il Codice determina i profili di rischio Rvita, Rbeni e Rambiente attraverso:",["Un approccio semplificato di tipo qualitativo, basato sulle caratteristiche dell'attività, degli occupanti e dei beni.","Un calcolo probabilistico con alberi degli eventi.","Prove sperimentali in scala reale."]);
D("b22","base",[BI],"Nel capitolo M.2 del Codice gli scenari d'incendio credibili si selezionano:",["Analiticamente, anche con alberi degli eventi, valutandone probabilità e severità.","Scegliendo sempre lo scenario statisticamente più frequente.","Adottando lo scenario indicato dal Comando."]);
D("b23","base",[BI],"Quale dei seguenti NON è una componente della valutazione del rischio d'incendio?",["Il calcolo del premio assicurativo dell'attività.","L'individuazione dei pericoli d'incendio (combustibili e inneschi).","La determinazione di quantità e tipologia degli occupanti esposti."]);
D("b24","base",[BI],"Nella valutazione del rischio, la valutazione delle conseguenze dell'incendio è di tipo quantitativo quando si adotta:",["Una soluzione alternativa con FSE.","Una soluzione conforme.","Una regola tecnica tradizionale."]);
D("b25","base",[BI],"L'affinità dell'ossido di carbonio con l'emoglobina, rispetto a quella dell'ossigeno, è circa:",["220 volte superiore.","2 volte superiore.","20 volte superiore."]);
D("b26","base",[BI],"Per concentrazioni di ossigeno inferiori al 6%:",["Cessa la respirazione e la morte per asfissia avviene in circa 6 minuti.","Si ha solo una riduzione dell'attività muscolare.","Non si hanno effetti apprezzabili."]);
D("b27","base",[BI],"Una temperatura dell'aria di circa 150 °C è da ritenere:",["La massima sopportabile sulla pelle per brevissimo tempo, se l'aria è sufficientemente secca.","La massima respirabile per breve tempo.","Innocua per esposizioni prolungate."]);
D("b28","base",[BI],"Secondo la tabella del metodo di Eisenberg, un irraggiamento di circa 1,4 kW/m² rappresenta:",["Il limite per persone vestite esposte per lungo tempo.","La soglia per scottature di 2° grado.","Il 50% di probabilità di sopravvivenza."]);
D("b29","base",[BI],"Secondo la tabella della lezione, i danni alle strutture in acciaio si hanno con irraggiamento di circa:",["40 kW/m².","12,6 kW/m².","60 kW/m²."]);
D("b30","base",[BI],"Le acque di spegnimento di un incendio possono provocare:",["Contaminazione dell'acqua e del suolo per trascinamento di sostanze.","Solo danni alle strutture.","Nessun danno ambientale."]);
D("b31","base",[BI],"Gli impianti realizzati in conformità alle norme UNI, CEI o di altri enti di normalizzazione europei riconosciuti:",["Si considerano eseguiti secondo la regola dell'arte.","Devono comunque essere approvati dal Comando.","Non richiedono manutenzione."]);
D("b32","base",[BI],"Per gli impianti soggetti al DM 37/2008, al termine dei lavori l'impresa installatrice rilascia:",["La dichiarazione di conformità (Di.Co.).","Il modello PIN 2.5 CERT. IMP.","Il certificato di prevenzione incendi."]);
D("b33","base",[BI],"Le misure di prevenzione degli incendi individuate nella valutazione del rischio:",["Sono vincolanti per l'esercizio dell'attività.","Sono semplici raccomandazioni.","Valgono solo nella fase di progetto."]);
D("b34","base",[BI],"Con il DM 1° settembre 2021 la manutenzione dei presidi antincendio deve essere effettuata:",["Da tecnici manutentori qualificati.","Dagli addetti antincendio aziendali.","Dal responsabile del servizio di prevenzione e protezione."]);
D("b35","base",[BI],"La «sorveglianza» dei presidi antincendio è:",["L'insieme di controlli visivi, tra due controlli periodici, che può essere svolto dai lavoratori normalmente presenti dopo adeguate istruzioni.","L'intervento di riparazione eseguito dal manutentore qualificato.","Il collaudo iniziale dell'impianto."]);
D("b36","base",[BI],"Il «controllo periodico» dei presidi antincendio è:",["L'insieme di operazioni, con frequenza non superiore a quella indicata da norme o manuali, per verificare la completa e corretta funzionalità.","Un controllo visivo quotidiano dei lavoratori.","La sostituzione dei componenti a fine vita."]);
D("b37","base",[BI],"Secondo la lezione, quale tra le seguenti è una misura di protezione passiva?",["Il sistema d'esodo.","L'impianto di rivelazione e allarme.","Il controllo di fumi e calore."]);
D("b38","base",[BI],"La stessa quantità di carta archiviata in armadi metallici anziché su scaffali aperti:",["Riduce la velocità di propagazione dell'incendio.","Aumenta il carico d'incendio.","Non ha alcun effetto sul rischio."]);
D("e16","estin",[BI],"L'azione estinguente dell'acqua migliora considerevolmente:",["Al diminuire della dimensione delle gocce del getto.","All'aumentare della dimensione delle gocce.","Aggiungendo polvere estinguente."]);
D("e17","estin",[BI],"Sodio e potassio sono incompatibili con l'acqua perché a contatto con essa:",["Liberano idrogeno.","Liberano acetilene.","Liberano ossigeno."]);
D("e18","estin",[BI],"I carburi sono incompatibili con l'acqua perché a contatto con essa:",["Liberano acetilene.","Liberano idrogeno.","Liberano cloro."]);
D("e19","estin",[BI],"Per stabilire se un estintore a base d'acqua può essere usato su apparecchiature in tensione si esegue:",["La prova dielettrica prevista dalla UNI EN 3-7.","La prova di espansione della schiuma.","La prova di tenuta a pressione."]);
D("e20","estin",[BI],"Nella soluzione schiumogena le concentrazioni tipiche sono:",["90–95% di acqua e 5–10% di liquido schiumogeno.","50% di acqua e 50% di liquido schiumogeno.","10% di acqua e 90% di liquido schiumogeno."]);
D("e21","estin",[BI],"La schiuma è impiegata tipicamente per incendi di classe:",["B; non è utilizzabile su apparecchiature elettriche e su fuochi di classe D.","D.","C ed E."]);
D("e22","estin",[BI],"Le schiume «Fluorine-Free Foam» sono state sviluppate perché:",["Le norme ambientali stanno limitando o vietando i composti PFAS presenti in molti schiumogeni.","Sono più economiche delle schiume proteiniche.","Si possono usare su apparecchiature in tensione."]);
D("e23","estin",[BI],"Quale delle seguenti è una caratteristica delle polveri estinguenti?",["Non spengono efficacemente le braci e sono irritanti per le vie respiratorie.","Conducono l'elettricità.","Non lasciano residui sulle apparecchiature."]);
D("e24","estin",[BI],"Gli impianti fissi a gas inerti (a deplezione di ossigeno) sono tipicamente installati:",["In ambienti con beni da proteggere anche dagli effetti dannosi degli estinguenti a base d'acqua.","All'aperto, su depositi di liquidi infiammabili.","Nelle cucine, per fuochi di classe F."]);
